 duì tī jìnle yíngdé bǐsài de guānjiàn yī qiú","vi":"Vào thời khắc cuối cùng, anh ấy đã sút vào một quả bóng quan trọng giúp đội mình thắng trận."},{"zh":"只要你愿意，公司的大门时刻都为你开着。","pinyin":"Zhǐyào nǐ yuànyì, gōngsī de dàmén shíkè dōu wèi nǐ kāizhe","vi":"Chỉ cần bạn đồng ý, cánh cửa công ty luôn luôn mở vì bạn."}]},{"id":"HSK5-011","title":"至今 /Zhìjīn/","word_class":"Phó từ","explanation":"Chỉ thời gian, dùng để nhấn mạnh một trạng thái, sự việc hoặc tình huống kéo dài liên tục từ một thời điểm trong quá khứ cho đến thời điểm hiện tại (thời điểm nói)","examples":[{"zh":"那件事的真相至今仍是一个谜。","pinyin":"Nà jiàn shì de zhēnxiàng zhìjīn réng shì yī gè mí","vi":"Sự thật về vụ việc đó đến nay vẫn là một bí ẩn."}]},{"id":"HSK5-012","title":"顶/Dǐng/","word_class":"Danh từ/Động từ/Lượng từ","explanation":"Danh từ: Chỉ bộ phận cao nhất của con người hoặc vật thể. Động từ: Biểu thị động tác của đầu, hoặc đón lấy, chống lại (áp lực).\nLượng từ: Dùng cho mũ, ô hơi lớn, hoặc đồ vật có hình cái ô.","examples":[{"label":"Danh từ:","zh":"我们终于爬上了山顶，看到了美丽的日出。","pinyin":"Wǒmen zhōngyú pá shàng le shāndǐng, kàn dào le měilì de rìchū","vi":"Cuối cùng chúng tôi cũng leo lên được đỉnh núi, ngắm nhìn bình minh tuyệt đẹp."},{"label":"Động từ:","zh":"这根柱子顶着房梁。","pinyin":"Zhè gēn zhùzi dǐng zhe fángliáng","vi":"Cây cột này chống đỡ xà nhà."},{"label":"Lượng từ:","zh":"他戴着一顶红色的棒球帽。","pinyin":"Tā dài zhe yī dǐng hóngsè de bàngqiú mào","vi":"Anh ấy đội một cái mũ bóng chày màu đỏ."}]},{"id":"HSK5-013","title":"······得+不行/De bùxíng/","word_class":"Kết cấu","explanation":"Biểu thị trình độ, mức độ cao, còn có thể dùng “······+得+ 很/不得了”.","examples":[{"zh":"我今天忙了一整天，现在累得不行。","pinyin":"Wǒ jīntiān máng le yī zhěng tiān, xiànzài lèi de bùxíng","vi":"Hôm nay tôi bận cả ngày, giờ mệt không chịu nổi"}]},{"id":"HSK5-014","title":"反而 /Fǎn'ér/","word_class":"Phó từ","explanation":"Đứng giữa hai câu, biểu thị sự tương phản với dự kiến ban đầu (\"ngược lại\").","examples":[{"zh":"他平时话不多，但在辩论赛上反而成了最活跃的人。","pinyin":"Tā píngshí huà bù duō, dàn zài biànlùn sài shàng fǎn'ér chéng le zuì huóyuè de rén","vi":"Bình thường anh ấy ít nói, nhưng trong cuộc thi tranh luận lại trở thành người hoạt bát nhất."}]},{"id":"HSK5-015","title":"从而 /Cóng'ér/","word_class":"Liên từ","explanation":"Đứng giữa hai câu, câu trước biểu thị nguyên nhân/phương pháp, câu sau biểu thị kết quả/mục đích (\"từ đó\").","examples":[{"zh":"比赛前做好思想准备可以减少运动员的压力，从而取得比赛的成功。","pinyin":"Bǐsài qián zuò hǎo sīxiǎng zhǔnbèi kěyǐ jiǎnshǎo yùndòngyuán de yālì, cóng'ér qǔdé bǐsài de chénggōng.","vi":"Chuẩn bị tư tưởng tốt trước trận đấu có thể giảm áp lực cho vận động viên, từ đó đạt được thành công trong trận đấu."}]},{"id":"HSK5-016","title":"于/Yú/","word_class":"Giới từ","explanation":"Tương đương với “在、从、 对、向、比” (ở, từ, đối với, hướng về, so với).","examples":[{"zh":"这家公司成立于1997年。","pinyin":"Zhè jiā gōngsī chénglì yú yījiǔjiǔqī nián","vi":"Công ty này được thành lập từ năm 1997."},{"zh":"这种药主要用于感冒的治疗。","pinyin":"Zhè zhǒng yào zhǔyào yòng yú gǎnmào de zhìliáo","vi":"Loại thuốc này chủ yếu dùng trong việc điều trị cảm cúm"}]},{"id":"HSK5-017","title":"为/Wéi/","word_class":"Động từ","explanation":"Có nghĩa là “成、成为” (thành, trở thành) Có nghĩa là “作为、算作” (làm, coi như).","examples":[{"zh":"压力也可以变为动力。","pinyin":"Yālì yě kěyǐ biàn wéi dònglì.","vi":"Áp lực cũng có thể trở thành động lực"},{"zh":"找工作时，很多人会以收入多少为第一标准。","pinyin":"Zhǎo gōngzuò shí, hěn duō rén huì yǐ shōurù duōshǎo wéi dì yī biāozhǔn","vi":"Khi tìm việc, nhiều người lấy mức thu nhập làm tiêu chuẩn đầu tiên."}]},{"id":"HSK5-018","title":"起来 /Qǐlái/","word_class":"Động từ xu hướng","explanation":"Dùng sau động từ: Biểu thị từ phân tán đến tập trung lại Biểu thị từ lộ rõ đến ẩn nấp, ẩn náu.","examples":[{"zh":"他把散落一地的玩具都捡起来放回了箱子里。","pinyin":"Tā bǎ sànluò yī dì de wánjù dōu jiǎn qǐlái fàng huí le xiāngzi lǐ","vi":"Cậu bé nhặt tất cả đồ chơi rơi vãi dưới đất lên và cất lại vào trong hộp."},{"zh":"他把散落一地的玩具都捡起来放回了箱子里。","pinyin":"Tā bǎ sànluò yī dì de wánjù dōu jiǎn qǐlái fàng huí le xiāngzi lǐ","vi":"Cậu bé nhặt tất cả đồ chơi rơi vãi dưới đất lên và cất lại vào trong hộp."}]},{"id":"HSK5-019","title":"替/Tì/","word_class":"Động từ/Giới từ","explanation":"Là động từ: có nghĩa là \"thay thế\". Là giới từ: biểu thị “给、为” (cho ai, vì ai).","examples":[{"zh":"刘老师今天有点儿事来不了，你能替他吗？","pinyin":"Liú lǎoshī jīntiān yǒudiǎn er shì lái bù liǎo, nǐ néng tì tì tā ma","vi":"Thầy Lưu hôm nay có chút việc không đến được, cậu có thể thay thầy ấy được không?"},{"zh":"李阳要去留学了，我们都替他高兴。","pinyin":"Lǐ Yáng yào qù liúxué le, wǒmen dōu tì tā gāoxìng","vi":"Lý Dương sắp đi du học rồi, chúng tôi đều mừng cho cậu ấy."}]},{"id":"HSK5-020","title":"说不定 /Shuōbudìn g/","word_class":"Động từ/Phó từ","explanation":"Là động từ: có nghĩa là \"không thể nói rõ ràng, khẳng định\" Là phó từ: biểu thị ước tính, có khả năng lớn (\"biết đâu\").","examples":[{"zh":"这事儿经理已经同意了，只是出发的时间还说不定。","pinyin":"Zhè shì'er jīnglǐ yǐjīng tóngyìle, zhǐshì chūfā de shíjiān hái shuōbudìng","vi":"Việc này giám đốc đã đồng ý rồi, chỉ là thời gian xuất phát thì vẫn chưa thể nói rõ."},{"zh":"别随随便便就说放弃，说不定下次会成功了。","pinyin":"Bié suí suí biàn biàn jiù shuō fàngqì, shuōbudìng xià cì huì chénggōngle","vi":"Đừng tùy tiện nói từ bỏ, biết đâu lần sau sẽ thành công."}]},{"id":"HSK5-021","title":"似的 /Shìde/","word_class":"Trợ từ","explanation":"Trợ từ, đặt sau danh từ, biểu thị sự so sánh với một số sự vật, tình huống (thường dùng trong văn viết). Dùng trong cấu trúc “·····得+什么似的” mang ngữ khí khoa trương.","examples":[{"zh":"大雨过后，湖面平静得镜子似的，倒映着整个天空。","pinyin":"Dà yǔ guò hòu, húmiàn píngjìng de jìngzi shìde, dàoyìng zhe zhěnggè tiānkōng","vi":"Sau cơn mưa lớn, mặt hồ phẳng lặng như tấm gương vậy, in bóng cả bầu trời."},{"zh":"听说偶像要来，她激动得什么似的，一整晚都没睡好。","pinyin":"Tīng shuō ǒuxiàng yào lái, tā jīdòng de shénme shìde, yī zhěng wǎn dōu méi shuì hǎo","vi":"Nghe tin thần tượng sắp đến, cô ấy hào hứng đến mức không tả xiết, cả đêm không sao ngủ được."}]},{"id":"HSK5-022","title":"纷纷 /Fēnfēn/","word_class":"Tính từ/Phó từ","explanation":"Tính từ: Mô tả (ngôn luận, vật rơi, rụng xuống) nhiều mà hỗn loạn. Phó từ: Biểu thị (nhiều người hoặc sự vật) liên tục tiếp diễn (\"dồn dập, tới tấp, sôi nổi\").","examples":[{"zh":"秋风刮起，落叶纷纷。","pinyin":"Qiūfēng guā qǐ, luòyè fēnfēn","vi":"Gió thu thổi lên, lá rụng xôn xao"},{"zh":"要下雨了，路上的人纷纷往家里跑。","pinyin":"Yào xià yǔ le, lùshàng de rén fēnfēn wǎng jiā lǐ pǎo","vi":"Sắp mưa rồi, người đi đường dồn dập chạy về nhà."}]},{"id":"HSK5-023","title":"瞎/Xiā/","word_class":"Động từ/Phó từ","explanation":"Động từ: Nghĩa là \"mắt không nhìn thấy\" (mù). Phó từ: Biểu thị không có lí do, không có căn cứ hoặc khi làm một việc không có hiệu quả (\"nói bừa, làm bừa\").","examples":[{"zh":"你一定知道马的那只眼睛是瞎的。","pinyin":"Nǐ yīdìng zhīdào mǎ de nà zhǐ yǎnjīng shì xiā de.","vi":"Bạn nhất định biết con mắt nào của con ngựa đó bị mù."},{"zh":"别听他瞎说！不用害怕，我们不会这么倒霉的。","pinyin":"Bié tīng tā xiāshuō! Bú yòng hàipà, wǒmen bú huì zhème dǎoméi de","vi":"Đừng nghe anh ta nói bừa! Không cần sợ hãi, chúng ta sẽ không xui xẻo như thế đâu."}]},{"id":"HSK5-024","title":"分别 /Fēnbié/","word_class":"Động từ/Phó từ/Danh từ","explanation":"Động từ: nghĩa là ly biệt, chia tay, xa cách. Phó từ: biểu thị riêng biệt, mỗi cái một. Danh từ: nghĩa là phân biệt, bất đồng, khác nhau.","examples":[{"zh":"从毕业到现在我们已经分别20年了，一直都没有联系。","pinyin":"Cóng bìyè dào xiànzài wǒmen yǐjīng fēnbié èrshí nián le, yīzhí dōu méiyǒu liánxì","vi":"Từ khi tốt nghiệp đến nay chúng tôi đã chia tay 20 năm rồi, vẫn luôn không liên lạc."},{"zh":"老师分别找我们谈了话，了解了每个人的想法。","pinyin":"Lǎoshī fēnbié zhǎo wǒmen tán le huà, liǎojiě le měi gè rén de xiǎngfǎ","vi":"Giáo viên đã lần lượt gặp riêng chúng tôi nói chuyện, để hiểu suy nghĩ của từng người."},{"zh":"对消费者来说，这两个品牌的产品质量几乎没有什么分别。","pinyin":"Duì xiāofèizhě lái shuō, zhè liǎng gè pǐnpái de chǎnpǐn zhìliàng jīhū méiyǒu shénme fēnbié","vi":"Đối với người tiêu dùng, chất lượng sản phẩm của hai thương hiệu này hầu như không có sự khác biệt nào."}]},{"id":"HSK5-025","title":"根/Gēn/","word_class":"Danh từ/Lượng từ","explanation":"Danh từ: Chỉ bộ phận của thực vật sinh trưởng dưới lòng đất, hoặc nền móng, cơ sở, gốc rễ của sự vật. Lượng từ: Thường dùng cho vật dài và nhỏ.","examples":[{"zh":"1这件事还是得从根上解决，只理解表面问题是不行的。","pinyin":"Zhè jiàn shì háishì děi cóng gēn shang jiějué, zhǐ lǐjiě biǎomiàn wèntí shì bùxíng de","vi":"Việc này vẫn phải giải quyết từ gốc rễ, chỉ hiểu vấn đề bề mặt là không được."},{"zh":"摸到尾巴的盲人说大相像一根绳子。","pinyin":"Mō dào wěibā de mángrén shuō dàxiàng xiàng yī gēn shéngzi.","vi":"Người mù sờ thấy cái đuôi nói con voi giống như một sợi dây."}]},{"id":"HSK5-026","title":"便/Biàn/","word_class":"Phó từ","explanation":"Nghĩa là就(“thì, là, đã”), thường dùng trong văn viết.","examples":[{"zh":"仅仅是换一种心情，换一个角度，便可以从困境中走出来。","pinyin":"Jǐnjǐn shì huàn yī zhǒng xīnqíng, huàn yīgè jiǎodù, biàn kěyǐ cóng kùnjìng zhōng zǒu chūlái","vi":"Chỉ cần thay đổi một chút tâm trạng, thay đổi một góc độ, là có thể bước ra khỏi hoàn cảnh khó khăn."}]},{"id":"HSK5-027","title":"倒/Dào/","word_class":"Phó từ","explanation":"Biểu thị tương phản, trái ngược với tình huống thông thường. Biểu thị không nghĩ đến. Biểu thị sự nhượng bộ (khẳng định trước, sau đó nói các phương diện khác). Biểu thị không nhẫn nại, bình tĩnh (dùng để hỏi hoặc hối thúc).","examples":[{"zh":"怎么勇敢反倒成为缺点了？","pinyin":"Shàonián bù jiě de wèn: “Zěnme yǒnggǎn fǎn dào chéngwéi quēdiǎnle","vi":"Tại sao dũng cảm ngược lại lại trở thành khuyết điểm?"},{"zh":"小刘租的房子虽然很小，不过收拾得倒还干净。","pinyin":"Xiǎo Liú zū de fángzi suīrán hěn xiǎo, búguò shōushi dé dào hái gānjìng.","vi":"Căn nhà Tiểu Lưu thuê tuy rất nhỏ, nhưng dọn dẹp ngược lại vẫn còn sạch sẽ."}]},{"id":"HSK5-028","title":"······来 ······去 /Lái... Qù/","word_class":"Kết cấu","explanation":"Biểu thị sự lặp đi lặp lại nhiều lần của động tác, hai động từ đứng trước “来” và “去” thường là cùng một từ hoặc là từ gần nghĩa.","examples":[{"zh":"小狗追着自己的尾巴，在草地上跑来跑去。","pinyin":"Xiǎo gǒu zhuīzhe zìjǐ de wěibā, zài cǎodì shang pǎo lái pǎo qù","vi":"Chú chó nhỏ đuổi theo cái đuôi của mình, chạy đi chạy lại trên bãi cỏ."},{"zh":"他们研究来讨论去，还是没找出原因。","pinyin":"Tāmen yánjiū lái tǎolùn qù, háishì méi zhǎo chū yuányīn.","vi":"Bọn họ nghiên cứu tới thảo luận lui, vẫn không tìm ra nguyên nhân."}]},{"id":"HSK5-029","title":"要不 /Yàobù/","word_class":"Liên từ","explanation":"Giống với “要不然”, biểu thị nếu không như thế này, thì kết quả sẽ như dưới đây. Có nghĩa là vẫn còn một sự lựa chọn khác (\"hay là\").","examples":[{"zh":"还好碰见你了，要不然我今天肯定会迟到了。","pinyin":"Hái hǎo pèngjiàn nǐ le, yàoburán wǒ jīntiān kěndìng huì chídàole","vi":"May mà gặp được cậu, nếu không thì hôm nay tôi chắc chắn sẽ bị trễ rồi."},{"zh":"今天太晚了，要不你明天再走吧。","pinyin":"Jīntiān tài wǎnle, yàobù nǐ míngtiān zài zǒu ba","vi":"Hôm nay muộn quá rồi, hay là cậu ngày mai hãy đi."}]},{"id":"HSK5-030","title":"算/Suàn)/","word_class":"Động từ","explanation":"Có nghĩa là “认作，当做” (xem như, coi như). Đằng sau có thể đi với “了” biểu thị “作罢，不再计较” (bỏ đi, không tính toán nữa).","examples":[{"zh":"这钱就算我借给你的，将来你有了的时候再还我。","pinyin":"Zhè qián jiù suàn wǒ jiè gěi nǐ de, jiānglái nǐ yǒule de shíhou zài hái wǒ","vi":"Số tiền này cứ coi như tôi cho cậu mượn, sau này khi cậu có thì trả lại tôi."},{"zh":"算了吧，你跑得再快，也追不上会飞的鸟啊。","pinyin":"Suànle ba, nǐ pǎo dé zài kuài, yě zhuī bù shàng huì fēi de niǎo a","vi":"Thôi đi, cậu chạy nhanh đến mấy cũng không đuổi kịp con chim biết bay đâu."}]},{"id":"HSK5-031","title":"作为 /Zuòwéi/","word_class":"Động từ/Giới từ","explanation":"Động từ: Có nghĩa là “看做， 认为是·····” (xem là, coi là, cho rằng). Giới từ: Dùng để chỉ ra, dẫn ra thân phận của một người hoặc tính chất của sự vật (\"với tư cách là\").","examples":[{"zh":"北海公园离家最近，所以我把那儿作为每晚散步的去处。","pinyin":"Běihǎi Gōngyuán lí jiā zuì jìn, suǒyǐ wǒ bǎ nà'er zuòwéi měi wǎn sànbù de qùchù","vi":"Công viên Bắc Hải gần nhà nhất, nên tôi coi đó là nơi đi dạo mỗi tối."},{"zh":"作为大作家、大学问家，鲁迅对吃很讲究。","pinyin":"Zuòwéi dà zuòjiā, dà xuéwènjiā, Lǔ Xùn duì chī hěn jiǎngjiu.","vi":"Với tư cách là một đại văn hào, học giả lớn, Lỗ Tấn rất kỹ tính trong việc ăn uống."}]},{"id":"HSK5-032","title":"曾经 /Céngjīng/","word_class":"Phó từ","explanation":"Biểu thị hành động hoặc tình huống đã từng xảy ra hoặc từng phát sinh.","examples":[{"zh":"我曾经去过北京两次。","pinyin":"Wǒ céngjīng qù guò Běijīng liǎng cì","vi":"Tôi đã từng đi Bắc Kinh hai lần."},{"zh":"他曾经是一名老师，后来转行做了记者。","pinyin":"Tā céngjīng shì yī míng lǎoshī, hòulái zhuǎnháng zuò le jìzhě","vi":"Anh ấy từng là một giáo viên, sau đó chuyển ngành làm phóng viên."}]},{"id":"HSK5-033","title":"毕竟 /Bìjìng/","word_class":"Phó từ","explanation":"Có nghĩa là rốt cuộc, cuối cùng Dùng để chỉ phần quan trọng nhất hoặc chính xác nhất, thường dùng cùng câu biểu thị “cho dù thế nào thì kết quả chính là như thế này”.","examples":[{"zh":"虽然我们遇到了很多困难，但毕竟完成了任务。","pinyin":"Suīrán wǒmen yù dàole hěn duō kùnnan, dàn bìjìng wánchéngle rènwù.","vi":"Mặc dù chúng ta đã gặp rất nhiều khó khăn, nhưng rốt cuộc cũng đã hoàn thành nhiệm vụ."}]},{"id":"HSK5-034","title":"逐渐 /Zhújiàn/","word_class":"Phó từ","explanation":"Chỉ trình độ, số lượng tăng hoặc giảm một chút (\"dần dần\").","examples":[{"zh":"天色逐渐暗了下来，夜晚即将来临。","pinyin":"Tiānsè zhújiàn àn le xiàlái, yèwǎn jíjiāng láilín","vi":"Màu trời dần dần tối đi, đêm sắp đến."},{"zh":"进入秋季，气温逐渐降低，树叶也开始变黄。","pinyin":"Jìnrù qiūjì, qìwēn zhújiàn jiàngdī, shùyè yě kāishǐ biàn huáng","vi":"Bước vào mùa thu, nhiệt độ dần hạ thấp, lá cây cũng bắt đầu chuyển vàng."}]},{"id":"HSK5-035","title":"或许 /Huòxǔ/","word_class":"Phó từ","explanation":"Có nghĩa là có lẽ, có khả năng (\"có lẽ\").","examples":[{"zh":"虽然以前她不支持你，但或许这次会有变化。","pinyin":"Suīrán yǐqián tā bù zhīchí nǐ, dàn huòxǔ zhè cì huì yǒu biànhuà","vi":"Mặc dù trước đây cô ấy không ủng hộ bạn, nhưng có lẽ lần này sẽ có thay đổi."},{"zh":"或许正是因为这一点一滴的努力，你就会走在别人的前面。","pinyin":"Huòxǔ zhèng shì yīnwèi zhè yī diǎn yī dī de nǔlì, nǐ jiù huì zǒu zài biérén de qiánmiàn.","vi":"Có lẽ chính vì chút nỗ lực nhỏ nhoi này, bạn sẽ đi trước người khác."}]},{"id":"HSK5-036","title":"来/过来 /Lái/Guòlái /","word_class":"Động từ xu hướng","explanation":"Dùng sau động từ (ví dụ: \"醒 \") biểu thị chuyển tiếp từ lúc ngủ đến lúc tỉnh, hoặc quay về trạng thái lúc ban đầu/bình thường. Có thể dùng trong cấu trúc phủ định (动词+得/不+过来).","examples":[{"zh":"早晨醒来，我发现窗外正下着大雪。","pinyin":"Zǎochén xǐng lái, wǒ fāxiàn chuāng wài zhèng xiàzhe dà xuě","vi":"Buổi sáng thức dậy, tôi phát hiện bên ngoài cửa sổ đang tuyết rơi dày."},{"zh":"脑子才清醒过来。","pinyin":"Nǎozi cái qīngxǐng guòlái.","vi":"Đầu óc mới tỉnh táo trở lại."}]},{"id":"HSK5-037","title":"所/Suǒ/","word_class":"Trợ từ/Lượng từ","explanation":"Trợ từ: Đứng trước động từ, dùng để chỉ ra sự vật (thường làm định ngữ, chủ ngữ...). Dùng trong cấu trúc “有/无+ 所+ động từ” Lượng từ: Dùng với chỗ ở, nơi ở, cơ cấu (ví dụ: trường học).","examples":[{"zh":"这就是我所知道的全部情况。","pinyin":"Zhè jiùshì wǒ suǒ zhīdào de quánbù qíngkuàng","vi":"Đây chính là toàn bộ tình hình mà tôi biết."},{"zh":"这所房子","pinyin":"zhè suǒ fángzi","vi":"Căn nhà này."}]},{"id":"HSK5-038","title":"相当 /Xiāngdān g/","word_class":"Động từ/Phó từ","explanation":"Động từ: Biểu thị hai phương diện (số lượng, điều kiện...) tương đương, ngang bằng nhau. Phó từ: Biểu thị trình độ, mức độ tương đối cao (\"khá, tương đối\").","examples":[{"zh":"这种鸟一天所食的害虫相当于自己的体重。","pinyin":"Zhè zhǒng niǎo yī tiān suǒ shí de hàichóng xiāngdāng yú zìjǐ de tǐzhòng.","vi":"Loài chim này ăn số lượng côn trùng gây hại trong một ngày tương đương với trọng lượng cơ thể của nó."},{"zh":"菜的味道好极了，服务也挺周到，我相当满意。","pinyin":"Cài de wèidào hǎo jíle, fúwù yě tǐng zhōudao, wǒ xiāngdāng mǎnyì","vi":"Món ăn ngon tuyệt vời, phục vụ cũng rất chu đáo, tôi khá hài lòng."}]},{"id":"HSK5-039","title":"数 /Shǔ/Shù/","word_class":"Động từ/Số từ","explanation":"Động từ (shǔ): Biểu thị tra, đếm (số lượng). Dùng trong cấu trúc “数······（最）······” hoặc “（最）······的（要/就）数 ······” biểu thị so sánh (nhất). Số từ (shù): Có nghĩa là “几/ 几个” (vài, mấy), thường dùng trong văn viết.","examples":[{"zh":"先生，这是找您的钱58块6，您数数。","pinyin":"Xiānsheng, zhè shì zhǎo nín de qián wǔshíbā kuài liù, nín shǔ shǔ.","vi":"Thưa ngài, đây là tiền thối lại cho ngài 58 tệ 6, ngài đếm thử xem."},{"zh":"要数我们班跑得最快的，那就数李阳了。","pinyin":"Yào shuō wǒmen bān pǎo de zuì kuài de, nà jiù shǔ Lǐ Yáng le","vi":"Nếu nói về người chạy nhanh nhất lớp chúng ta, thì phải kể đến Lý Dương."}]},{"id":"HSK5-040","title":"以及/Yǐjí/","word_class":"Liên từ","explanation":"Dùng để nối cụm từ hoặc từ có quan hệ ngang bằng nhau, liên kết thành phần thường có sự phân biệt trước sau hoặc sự phân biệt chủ yếu và thứ yếu (\"cũng như\").","examples":[{"zh":"吃饭时不要用筷子敲打碗，盘子以及桌面。","pinyin":"Chīfàn shí bú yào yòng kuàizi qiāodǎ wǎn, pánzi yǐjí zhuōmiàn.","vi":"Khi ăn cơm không được dùng đũa gõ vào bát, đĩa cũng như mặt bàn."},{"zh":"学校的领导，教师以及一些学生代表观看了演出。","pinyin":"Xuéxiào de lǐngdǎo, jiàoshī yǐjí yīxiē xuésheng dàibiǎo guānkànle yǎnchū.","vi":"Lãnh đạo nhà trường, giáo viên và một số đại diện học sinh đã xem buổi biểu diễn."}]},{"id":"HSK5-041","title":"程度 (Chéngdù)","word_class":"Danh từ","explanation":"Chỉ trình độ, mức độ hoặc cấp độ mà ở một vài phương diện đã đạt được.","examples":[{"label":"1","zh":"问题已经发展到了十分严重的程度。","pinyin":"Wèntí yǐjīng fāzhǎn dào le shífēn yánzhòng de chéngdù.","vi":"Vấn đề đã phát triển đến mức độ vô cùng nghiêm trọng."},{"label":"2","zh":"在很大程度上，一个人的未来取决于他所受的教育。","pinyin":"Zài hěn dà chéngdù shang, yīgè rén de wèilái qǔjué yú tā suǒ shòu de jiàoyù.","vi":"Ở mức độ rất lớn, tương lai của một người phụ thuộc vào nền giáo dục mà anh ta nhận được."}]},{"id":"HSK5-042","title":"何况 /Hékuàng/","word_class":"Liên từ","explanation":"Dùng ngữ khí phản vấn, biểu thị cao hơn một mức hoặc làm cho kết luận ở câu sau càng rõ ràng hơn","examples":[{"zh":"连运动员都不满意，更何况看比赛的球迷呢。","pinyin":"Lián yùndòngyuán dōu bù mǎnyì, gèng hékuàng kàn bǐsài de qiúmí ne.","vi":"Ngay cả vận động viên cũng không hài lòng, huống hồ là người hâm mộ xem trận đấu."}]},{"id":"HSK5-043","title":"何必 /Hébì/","word_class":"Phó từ","explanation":"Dùng ngữ khí phản vấn để biểu thị không cần thiết, không bắt buộc (\"cần gì phải, hà tất\").","examples":[{"zh":"你何必亲自送一趟呢？叫个快递不就行了？","pinyin":"Nǐ hébì qīnzì sòng yī tàng ne? Jiào gè kuàidì bú jiù xíngle","vi":"Cậu cần gì phải tự mình đi một chuyến? Gọi một người chuyển phát nhanh chẳng phải là được rồi sao?."}]},{"id":"HSK5-044","title":"多亏 /Duōkuī/","word_class":"Động từ","explanation":"Do có sự giúp đỡ của người khác hoặc bởi vì một vài nhân tố có lợi, mà tránh được rủi ro hoặc đạt được lợi ích nào đó (\"may nhờ, nhờ có\").","examples":[{"zh":"今天搬家多亏有你在，你可帮我太忙了。","pinyin":"Jīntiān bānjiā duōkuī yǒu nǐ zài, nǐ kě bāng wǒ tài máng le","vi":"Hôm nay chuyển nhà may nhờ có cậu ở đây, cậu đã giúp tôi quá nhiều rồi."}]},{"id":"HSK5-045","title":"所谓 /Suǒwèi/","word_class":"Tính từ","explanation":"Biểu thị thường hay nói, dùng để đề ra từ ngữ cần giải thích (\"cái gọi là\"). Chỉ những điều do một vài người nói, thường biểu thị không đồng ý, không thừa nhận.","examples":[{"zh":"他所谓的“新闻“，其实我们早就知道了。","pinyin":"Tā suǒwèi de “xīnwén“, qíshí wǒmen zǎo jiù zhīdàole.","vi":"Cái gọi là “tin tức” của anh ấy, thực ra chúng tôi đã biết từ lâu rồi."}]},{"id":"HSK5-046","title":"则/Zé/","word_class":"Lượng từ/Liên từ","explanation":"Lượng từ: Thường dùng với văn bản ngắn thành đoạn hoặc thành bài (mẩu tin, câu chuyện) Liên từ: Thường gặp kết cấu “A·····，（而）B则······” biểu thị sự so sánh giữa câu trước và câu sau. Liên từ: Biểu thị mối quan hệ nhân quả (tương đương với “就” trong văn nói).","examples":[{"zh":"一则新闻","pinyin":"yī zé xīnwén","vi":": Một mẩu tin (trên báo/đài)."},{"zh":"北方气候干燥，而南方则潮湿多雨。","pinyin":"Běifāng qìhòu gānzào, ér nánfāng zé cháoshī duō yǔ","vi":"Khí hậu miền Bắc khô ráo, còn miền Nam thì ẩm ướt mưa nhiều."},{"zh":"物体受热，则体积膨胀。","pinyin":"Wùtǐ shòu rè, zé tǐjī péngzhàng","vi":"Vật thể khi nhận nhiệt, thì thể tích sẽ nở ra."}]},{"id":"HSK5-047","title":"为······所 ····· /Wéi... Suǒ../","word_class":"Kết cấu cố định","explanation":"Kết cấu cố định, thường dùng trong văn viết, trong đó “为” biểu thị ý nghĩa là “被” (bị/được).","examples":[{"zh":"大自然就可以更好地为人所用。","pinyin":"Dà zìrán jiù kěyǐ gèng hǎo de wéi rén suǒ yòng","vi":"Thiên nhiên có thể được con người sử dụng tốt hơn."}]},{"id":"HSK5-048","title":"起/Qǐ/","word_class":"Động từ","explanation":"Động từ (làm bổ ngữ), biểu thị sự liên tiếp, kết hợp và cố định.","examples":[{"zh":"最重要的是建立起一套行之有效的制度。","pinyin":"Zuì zhòngyào de shì jiànlì qǐ yī tào xíngzhīyǒuxiào de zhìdù","vi":"Điều quan trọng nhất là thiết lập một bộ chế độ có hiệu quả thực thi."}]},{"id":"HSK5-049","title":"动词+过 (Guò)","word_class":"Động từ xu hướng","explanation":"Dùng với cách thức “động từ +得/不+过” làm bổ ngữ, biểu thị ý nghĩa là quá, vượt qua, hơn (thường dùng trong so sánh năng lực, trình độ).","examples":[{"label":"1","zh":"跟别人谈论起军事来，没有人说得过他。","pinyin":"Gēn biérén tánlùn qǐ jūngshì lái, méiyǒu rén shuō de guò tā.","vi":"Khi bàn luận về quân sự với người khác, không ai nói hơn được anh ấy."},{"label":"2","zh":"产品在价格上肯定竞争不过他们。","pinyin":"Chǎnpǐn zài jiàgé shang kěndìng jìngzhēng bú guò tāmen.","vi":"Sản phẩm chắc chắn không thể cạnh tranh lại họ về giá cả."}]},{"id":"HSK5-050","title":"迟早 /Chízǎo/","word_class":"Phó từ","explanation":"Biểu thị một vài động tác hoặc sự việc sớm muộn cũng sẽ xảy ra.","examples":[{"zh":"随着网络技术的发展，这些问题迟早都会得到解决。","pinyin":"Suízhe wǎngluò jìshù de fāzhǎn, zhèxiē wèntí chízǎo dōu huì dédào jiějué","vi":"Cùng với sự phát triển của công nghệ mạng, những vấn đề này sớm muộn gì cũng sẽ được giải quyết."}]},{"id":"HSK5-051","title":"再三 /Zàisān/","word_class":"Phó từ","explanation":"Có nghĩa là “hết lần này đến lần khác”, thường đi với động từ.","examples":[{"zh":"他考虑再三，最后还是客气地拒绝了。","pinyin":"Tā kǎolǜ zàisān, zuìhòu háishì kèqi de jùjuéle","vi":"Anh ấy suy nghĩ hết lần này đến lần khác, cuối cùng vẫn lịch sự từ chối."}]},{"id":"HSK5-052","title":"即/Jí/","word_class":"Động từ/Phó từ","explanation":"Động từ: Dùng trong văn viết, nghĩa là “就是” (tức là). Phó từ: Có nghĩa là “就” “便” (thì, ngay).","examples":[{"zh":"“旦”是象形字，即太阳从地平线上升起。","pinyin":"“Dàn” shì xiàngxíngzì, jí tàiyáng cóng dìpíngxiàn shang shēng qǐ","vi":"Chữ “旦” là chữ tượng hình, tức là mặt trời mọc từ đường chân trời."},{"zh":"不懂即问是他最大的优点。","pinyin":"Bù dǒng jí wèn shì tā zuì dà de yōudiǎn","vi":"Không hiểu thì hỏi ngay là ưu điểm lớn nhất của anh ấy."}]},{"id":"HSK5-053","title":"个别 /Gèbié/","word_class":"Tính từ","explanation":"Có nghĩa là “单个，各个” (từng cái, mỗi cái). Biểu thị cực kỳ ít, hiếm có.","examples":[{"zh":"大部分同学都按时完成了作业，只有个别同学还需要一点时间。","pinyin":"Dà bùfèn tóngxué dōu ànshí wánchéng le zuòyè, zhǐyǒu gèbié tóngxué hái xūyào yīdiǎn shíjiān","vi":"Đa số các bạn học sinh đều hoàn thành bài tập đúng hạn, chỉ có một vài bạn cá biệt cần thêm chút thời gian."}]},{"id":"HSK5-054","title":"非/Fēi/","word_class":"Tiền tố/Động từ/Phó từ","explanation":"Tiền tố: Đứng trước cụm danh từ, biểu thị là không thuộc về phạm vi này. Động từ: Có nghĩa là “不是” (không phải). Phó từ: Biểu thị chủ quan cố ý, kiên trì làm một việc gì đó (thường dùng trong cấu trúc “非+ động từ +不可”).","examples":[{"zh":"非机动车","pinyin":"Fēi jīdòngchē","vi":"Phi cơ giới /Xe không có động cơ"},{"zh":"此物非彼物，不可混淆。","pinyin":"Cǐ wù fēi bǐ wù, bùkě hùnxiáo","vi":"Vật này không phải vật kia, không thể lẫn lộn.他下定决"},{"zh":"心，非要考上那所名牌大学不可。","pinyin":"Tā xià dìng juéxīn, fēi yào kǎo shàng nà suǒ míngpái dàxué bùkě","vi":"Anh ấy quyết tâm, nhất định phải thi đỗ vào ngôi trường đại học danh tiếng đó mới thôi."}]},{"id":"HSK5-055","title":"以/Yǐ/","word_class":"Giới từ/Liên từ","explanation":"Giới từ: Có nghĩa là “用、拿、 凭借” (dùng, lấy, dựa vào, nhờ vào). Liên từ: Biểu thị mục đích (\"để\").","examples":[{"zh":"我们应以客观的态度看待这个问题。","pinyin":"Wǒmen yīng yǐ kèguān de tàidù kàndài zhège wèntí","vi":"Chúng ta nên dùng/lấy thái độ khách quan để nhìn nhận vấn đề này."},{"zh":"公司决定扩大生产规模，以满足日益增长的市场需求。","pinyin":"Gōngsī juédìng kuòdà shēngchǎn guīmó, yǐ mǎnzú rìyì zēngzhǎng de shìchǎng xūqiú","vi":"Công ty quyết định mở rộng quy mô sản xuất, để đáp ứng nhu cầu thị trường ngày càng tăng."}]},{"id":"HSK5-056","title":"平常 /Píngcháng /","word_class":"Tính từ/Danh từ","explanation":"Tính từ: Biểu thị phổ thông, bình thường, không có gì đặc biệt Danh từ: Ý nghĩa là “平时” (ngày thường, lúc thường).","examples":[{"zh":"对小王来说，今天是一个不平常的日子。","pinyin":"Duì Xiǎo Wáng lái shuō, jīntiān shì yīgè bù píngcháng de rìzi","vi":"Đối với Tiểu Vương, hôm nay là một ngày không bình thường."},{"zh":"他平常总是来得很早，今天却迟到了。","pinyin":"Tā píngcháng zǒng shì lái de hěn zǎo, jīntiān què chídàole","vi":"Anh ấy ngày thường luôn đến rất sớm, nhưng hôm nay lại đến muộn."}]},{"id":"HSK5-057","title":"宁可 /Nìngkě/","word_class":"Phó từ","explanation":"Biểu thị sau khi so sánh, chọn lựa được 1 bên tương đối có lợi (\"thà rằng... còn hơn\").","examples":[{"label":"1","zh":"作为母亲，她宁可自己累一点儿，也不想委屈了孩子。","pinyin":"Zuòwéi mǔqīn, tā nìngkě zìjǐ lèi yīdiǎn er, yě bù xiǎng wěiqu le háizi","vi":"Với tư cách là một người mẹ, cô ấy thà rằng mình mệt một chút, cũng không muốn làm con cái phải chịu thiệt thòi"}]},{"id":"HSK5-058","title":"极其/Jíqí/","word_class":"Phó từ","explanation":"Có nghĩa là “非常” (rất, cực kỳ), thường dùng trong văn viết, chỉ có thể bổ sung cho tính từ song âm tiết hoặc đa âm tiết.","examples":[{"zh":"在中国，餐桌上放一把刀是极其少见的现象。","pinyin":"Zài Zhōngguó, cānzhuō shang fàng yī bǎ dāo shì jíqí shǎojiàn de xiànxiàng","vi":"Ở Trung Quốc, việc đặt dao trên bàn ăn là một hiện tượng cực kỳ hiếm thấy."}]},{"id":"HSK5-059","title":"其余 /Qíyú/","word_class":"Đại từ","explanation":"Biểu thị phần còn lại, bộ phận khác.","examples":[{"zh":"怎么只有你们两个人？其余的同学呢？","pinyin":"Zěnme zhǐyǒu nǐmen liǎng gè rén? Qíyú de tóngxué ne?","vi":"Sao chỉ có hai người các cậu? Những học sinh còn lại đâu?"}]},{"id":"HSK5-060","title":"可见 /Kějiàn/","word_class":"Liên từ","explanation":"Thường dùng cách thức “······，（由此）可见······”, biểu thị có thể dựa vào tình huống được nói đến trong văn bản mà đưa ra phán đoán, đánh giá.","examples":[{"label":"1","zh":"他已经住院好几天了，一直诊断不出是什么问题，可见情况不太好。","pinyin":"Tā yǐjīng zhùyuàn hǎo jǐ tiānle, yīzhí zhěnduàn bù chū shì shénme wèntí, kějiàn qíngkuàng bú tài hǎo","vi":"Anh ấy đã nhập viện mấy ngày rồi, vẫn không chẩn đoán ra vấn đề gì, có thể thấy tình hình không được tốt lắm."}]},{"id":"HSK5-061","title":"般/Bān/","word_class":"Trợ từ","explanation":"Có nghĩa là “一样” “似的” (tựa như, như), thường đứng sau danh từ, tạo thành một cụm từ làm định ngữ hoặc trạng ngữ.","examples":[{"zh":"望着爸爸远去的背景，我的眼泪雨点般不停地往下掉。","pinyin":"Wàngzhe bàba yuǎn qù de bèijǐng, wǒ de yǎnlèi yǔdiǎn bān bù tíng de wǎng xià diào","vi":"Nhìn bóng lưng bố đi xa, nước mắt tôi rơi xuống không ngừng như mưa."}]},{"id":"HSK5-062","title":"闻(Wén)","word_class":"Ngữ tố/Động từ","explanation":"Ngữ tố: Có nghĩa là \"nghe thấy hoặc tin tức, sự việc được nghe thấy\"/ Động từ: Biểu thị dùng mũi để cảm nhận, nhận biết mùi vị.","examples":[{"zh":"老话说：百闻不如一见。","pinyin":"Lǎo huà shuō: Bǎi wén bù rú yī jiàn.","vi":"Lời cổ nói: Trăm nghe không bằng một thấy."},{"zh":"等能闻到香味时，便可开锅了。","pinyin":"Wén dào xiāngwèi shí, biàn kě kāi guō le.","vi":"Khi ngửi thấy mùi thơm, thì có thể mở nồi."}]},{"id":"HSK5-063","title":"趁/Chèn/","word_class":"Giới từ","explanation":"Có nghĩa là lợi dụng (thời gian, cơ hội).","examples":[{"zh":"萝卜饼要趁热吃。","pinyin":"Luóbo bǐng yào chèn rè chī","vi":"Bánh củ cải phải ăn lúc còn nóng."}]},{"id":"HSK5-064","title":"动词+得/ 不+起 (De/Bù Qǐ)","word_class":"Kết cấu","explanation":"Biểu thị về mặt chủ quan có (không có) năng lực và điều kiện thực hiện (hoặc tiếp nhận) động tác nào đó.","examples":[{"zh":"只有经得起困难和时间考验的朋友才算是真正的朋友。","pinyin":"Zhǐyǒu jīng de qǐ kùnnan hé shíjiān kǎoyàn de péngyǒu cái suàn shì zhēnzhèng de péngyǒu","vi":"Chỉ những người bạn vượt qua được thử thách của khó khăn và thời gian mới được coi là bạn bè thực sự."}]},{"id":"HSK5-065","title":"支/Zhī/","word_class":"Động từ/Lượng từ","explanation":"Động từ: Biểu thị dùng đồ vật chống cho vật thể không bị đổ xuống Lượng từ: Dùng trong tác phẩm âm nhạc, đội ngũ, hoặc đồ vật có hình cán (cây, bản).","examples":[{"zh":"他的两只手放在桌上，支着脑袋，正在想事情。","pinyin":"Tā de liǎng zhī shǒu fàng zài zhuō shang, zhīzhe nǎodai, zhèngzài xiǎng shìqíng","vi":"Hai tay anh ấy đặt trên bàn, chống cằm, đang suy nghĩ việc gì đó."},{"zh":"他弹第二支曲子时引起了牛的注意。","pinyin":"Tā tán dì èr zhī qǔzi shí yǐnqǐle niú de zhùyì","vi":"Khi anh ấy chơi bản nhạc thứ hai đã thu hút sự chú ý của con bò."}]},{"id":"HSK5-066","title":"凭/Píng/","word_class":"Động từ/Giới từ","explanation":"Động từ: Có nghĩa là nhờ vào, dựa vào. Giới từ: Biểu thị căn cứ, dựa vào (thường dùng cách thức “凭+ tân ngữ + động từ”).","examples":[{"zh":"干工作不能光凭经验，还要有创新。","pinyin":"Gàn gōngzuò bù néng guāng píng jīngyàn, hái yào yǒu chuàngxīn","vi":"Làm việc không thể chỉ dựa vào kinh nghiệm, còn phải có sự đổi mới."},{"zh":"请旅客们准备好车票，凭票进站。","pinyin":"Qǐng lǚkèmen zhǔnbèi hǎo chēpiào, píng piào jìn zhàn","vi":"Xin hành khách hãy chuẩn bị sẵn vé tàu, dựa vào vé để vào ga."}]},{"id":"HSK5-067","title":"硬/Yìng/","word_class":"Phó từ","explanation":"Biểu thị kiên quyết hoặc cố chấp làm một việc gì đó. Biểu thị không đủ năng lực nhưng vẫn tiếp tục tận lực để làm một việc gì đó (\"cố gắng, cố chấp\").","examples":[{"zh":"医生让他休息，他硬要回去上班。","pinyin":"Yīshēng ràng tā xiūxi, tā yìng yào huíqù shàngbān","vi":"Bác sĩ bảo anh ấy nghỉ ngơi, anh ấy cứ đòi về đi làm."},{"zh":"为了治病，他还是硬把它喝下去了。","pinyin":"Wèile zhì bìng, tā háishì yìng bǎ tā hē xiàqùle.","vi":"Mặc dù thuốc bắc hơi đắng, nhưng vì chữa bệnh, anh ấy vẫn cố gắng uống hết."}]},{"id":"HSK5-068","title":"偶然 /Ǒurán/","word_class":"Tính từ/Phó từ","explanation":"Tính từ: Biểu thị sự việc phát sinh ngoài dự đoán hoặc dựa vào quy luật thông thường thì không có khả năng phát sinh (\"ngẫu nhiên, bất ngờ\"). Phó từ: Có nghĩa là “偶尔，有时候” (thỉnh thoảng/ có lúc).","examples":[{"zh":"这次相遇完全是一个偶然的事件，谁也没有料到。","pinyin":"Zhè cì xiāngyù wánquán shì yī gè ǒurán de shìjiàn, shéi yě méiyǒu liàodào","vi":"Lần gặp gỡ này hoàn toàn là một sự kiện ngẫu nhiên, không ai ngờ tới cả."},{"zh":"我昨天在超市偶然遇见了十年没见的老同学。","pinyin":"Wǒ zuótiān zài chāoshì ǒurán yùjiàn le shí nián méi jiàn de lǎo tóngxué","vi":"Hôm qua tôi tình cờ gặp một người bạn cũ đã mười năm không gặp ở siêu thị."}]},{"id":"HSK5-069","title":"尽快 (Jǐnkuài)","word_class":"Phó từ","explanation":"Có nghĩa là nhanh hết mức có thể (\"nhanh chóng\").","examples":[{"label":"1","zh":"我要抓紧时间尽快把《说文解字》电脑化。","pinyin":"Wǒ yào zhuājǐn shíjiān jǐnkuài bǎ《Shuōwén Jiězì》diànnǎo huà.","vi":"Tôi phải tranh thủ thời gian nhanh chóng máy tính hóa cuốn \"Thuyết văn giải tự\"."},{"label":"2","zh":"趁这两天天气好，您尽快把过季的衣服洗一洗，收起来。","pinyin":"Chèn zhè liǎng tiān tiānqì hǎo, nín jǐnkuài bǎ guò jì de yīfu xǐ yī xǐ, shōu qǐlái.","vi":"Tranh thủ hai hôm thời tiết đẹp này, bạn nhanh chóng giặt giũ và cất quần áo trái mùa đi."}]},{"id":"HSK5-070","title":"一旦 /Yīdàn/","word_class":"Phó từ","explanation":"Biểu thị thời gian không xác định, ngày đó bỗng nhiên tới hoặc giả dụ có ngày đó (\"một khi\").","examples":[{"zh":"一旦有人闯入这个空间，我们就会感觉不舒服、不自在。","pinyin":"Yīdàn yǒu rén chuǎng rù zhège kōngjiān, wǒmen jiù huì gǎnjué bù shūfú, bù zìzài","vi":"Một khi có người đột nhập vào không gian này, chúng ta sẽ cảm thấy không thoải mái, không tự nhiên."}]},{"id":"HSK5-071","title":"难免 /Nánmiǎn/","word_class":"Tính từ","explanation":"Có nghĩa là khó tránh khỏi, không thể tránh khỏi.","examples":[{"zh":"朋友间难免会发生矛盾、误会甚至是伤害。","pinyin":"Péngyǒu jiān nánmiǎn huì fāshēng máodùn, wùhuì shènzhì shì shānghài","vi":"Giữa bạn bè khó tránh khỏi việc xảy ra mâu thuẫn, hiểu lầm thậm chí là tổn thương."}]},{"id":"HSK5-072","title":"自从 /Zìcóng/","word_class":"Giới từ","explanation":"Biểu thị bắt đầu từ mốc thời gian nào đó trong quá khứ (\"kể từ khi\").","examples":[{"zh":"自从有了长大后成为作家这个理想之后，他每天都坚持写作。","pinyin":"Zìcóng yǒule zhǎng dà hòu chéngwéi zuòjiā zhège lǐxiǎng zhīhòu, tā měitiān dōu jiānchí xiězuò","vi":"Kể từ khi có lý tưởng lớn lên trở thành nhà văn, anh ấy mỗi ngày đều kiên trì viết lách."}]},{"id":"HSK5-073","title":"一致 /Yīzhì/","word_class":"Tính từ/Phó từ","explanation":"Tính từ: Biểu thị không có sự chia rẽ, bất đồng. Phó từ: Biểu thị cùng nhau, đồng lòng.","examples":[{"zh":"文文跟他们的意见不一致。","pinyin":"Wénwén gēn tāmen de yìjiàn bù yīzhì","vi":"Ý kiến của Văn Văn không thống nhất với họ."},{"zh":"双方一致表示将进一步发展友好合作关系。","pinyin":"Shuāngfāng yīzhì biǎoshì jiāng jìnyībù fāzhǎn yǒuhǎo hézuò guānxì","vi":"Hai bên nhất trí bày tỏ sẽ tiếp tục phát triển mối quan hệ hợp tác hữu nghị."}]},{"id":"HSK5-074","title":"某/Mǒu/","word_class":"Đại từ chỉ thị","explanation":"Chỉ một người hoặc một vật nhất định (thường dùng sau họ, biểu thị biết tên nhưng không nói ra). Chỉ người hoặc vật không xác định.","examples":[{"zh":"某些干部的工作作风存在问题。","pinyin":"Mǒu xiē gànbù de gōngzuò zuòfēng cúnzài wèntí","vi":"Tác phong làm việc của một số cán bộ nào đó tồn tại vấn đề."},{"zh":"在某种程度上，我同意你的观点。","pinyin":"Zài mǒu zhǒng chéngdù shàng, wǒ tóngyì nǐ de guāndiǎn","vi":"Ở một mức độ nào đó, tôi đồng ý với quan điểm của bạn."}]},{"id":"HSK5-075","title":"幸亏 /Xìngkuī/","word_class":"Phó từ","explanation":"Biểu thị do một vài nguyên nhân nào đó mà tránh được một số chuyện không hy vọng sẽ phát sinh (\"may mà\").","examples":[{"zh":"幸亏你提醒了我，我今天就去报名。","pinyin":"Xìngkuī nǐ tíxǐngle wǒ, wǒ jīntiān jiù qù bàomíng","vi":"May mà cậu nhắc tôi, hôm nay tôi sẽ đi đăng ký."}]},{"id":"HSK5-076","title":"行动 /Xíngdòng/","word_class":"Động từ/Danh từ","explanation":"Động từ: Biểu thị đi lại, hoạt động cơ thể. Cũng có thể biểu thị tiến hành hành động nào đó vì mục đích nào đó. Danh từ: Biểu thị hoạt động, hành vi.","examples":[{"zh":"他运动时受伤了，行动不便。","pinyin":"Tā yùndòng shí shòushāngle, xíngdòng bú biàn","vi":"Anh ấy bị thương khi tập thể thao, đi lại bất tiện."},{"zh":"我们应该勇敢面对困难，迅速采取行动。","pinyin":"Wǒmen yīnggāi yǒnggǎn miànduì kùnnan, xùnsù cǎiqǔ xíngdòng.","vi":"Chúng ta nên dũng cảm đối mặt với khó khăn, nhanh chóng hành động."}]},{"id":"HSK5-077","title":"义务 /Yìwù/","word_class":"Danh từ/Tính từ","explanation":"Danh từ: Biểu thị trách nhiệm về mặt pháp luật, đạo đức nên gánh vác, đảm nhiệm (\"nghĩa vụ\"). Tính từ: Biểu thị không nhận thù lao (mang tính nghĩa vụ).","examples":[{"zh":"中国有关于九年制义务教育的法律。","pinyin":"Zhōngguó yǒu guānyú jiǔ nián zhì yìwù jiàoyù de fǎlǜ","vi":"Trung Quốc có luật về giáo dục bắt buộc 9 năm"},{"zh":"参与社会事务和促进社会进步是每个人的权利，也是每个人的义务和责任。","pinyin":"Cānyù shèhuì shìwù hé cùjìn shèhuì jìnbù shì měi gèrén de quánlì, yě shì měi gèrén de yìwù hé zérèn","vi":"Tham gia công việc xã hội và thúc đẩy tiến bộ xã hội là quyền lợi của mỗi người, cũng là nghĩa vụ và trách nhiệm của mỗi người."}]},{"id":"HSK5-078","title":"朝/Cháo/","word_class":"Động từ/Giới từ","explanation":"Động từ: Biểu thị hướng về, đối mặt Giới từ: Biểu thị phương hướng của hành vi, động tác đã chỉ","examples":[{"zh":"我们学校的正门坐西朝东。","pinyin":"Wǒmen xuéxiào de zhèng mén zuò xī cháo dōng","vi":"Cổng chính của trường chúng tôi tọa lạc phía Tây, hướng về phía Đông."},{"zh":"使劲儿朝里面放水。","pinyin":"Shǐ jìnr cháo lǐmiàn fàng shuǐ","vi":"Dốc sức đổ nước vào bên trong."}]},{"id":"HSK5-079","title":"简直 /Jiǎnzhí/","word_class":"Phó từ","explanation":"Biểu thị gần như là vậy nhưng cũng không hẳn hoàn toàn là như vậy. Mang ngữ khí khoa trương, nhấn mạnh (\"quả là/thật là\").","examples":[{"zh":"与从前相比，简直像换了个人。","pinyin":"Yǔ cóngqián xiāng bǐ, jiǎnzhí xiàng huànle gè rén","vi":"So với trước đây, (cô ấy) quả là như đã thay đổi thành một người khác."}]},{"id":"HSK5-080","title":"来/Lái/","word_class":"Trợ từ","explanation":"Đứng sau các từ chỉ số “十、 百、千”... hoặc từ chỉ số lượng, biểu thị ước lượng (\"khoảng hơn\"). Dùng sau các từ chỉ số như “一、二、三” tạo thành kết cấu “一来······，二来······” biểu thị liệt kê lí do (\"một là... hai là...\").","examples":[{"zh":"他雇了20来个当地人为他带路和搬运行李。","pinyin":"Tā gùle èrshí lái gè dāngdì rén wèi tā dàilù hé bānyùn xíngli.","vi":"Anh ấy đã thuê khoảng hơn 20 người địa phương dẫn đường và khuân vác hành lý cho anh ấy."},{"zh":"一来是给大家送水果，二来是看看大家过节还有什么难处。","pinyin":"Yī lái shì gěi dàjiā sòng shuǐguǒ, èr lái shì kàn kàn dàjiā guòjié hái yǒu shénme nán chu","vi":"Một là để mang trái cây đến cho mọi người, hai là để xem mọi người đón lễ còn khó khăn gì không."}]},{"id":"HSK5-081","title":"至于 /Zhìyú/","word_class":"Động từ/Giới từ","explanation":"Động từ: Biểu thị đạt đến một loại trình độ nào đó (thường dùng trong câu phản vấn với ý \"đến mức\"). Giới từ: Dùng trong kết cấu “（A）·····，至于（B）······” biểu thị nhắc đến một việc khác nữa (\"còn về\").","examples":[{"zh":"我只是和你开个玩笑，你至于生那么大的气吗？","pinyin":"Wǒ zhǐshì hé nǐ kāi gè wánxiào, nǐ zhìyú shēng nàme dà de qì ma","vi":"Tôi chỉ đùa với cậu thôi, cậu đến mức phải tức giận lớn như vậy sao?"},{"zh":"我只知道他是六班的学生，至于住在哪儿，我就不清楚了。","pinyin":"Wǒ zhǐ zhīdào tā shì liù bān de xuésheng, zhìyú zhù zài nǎ'er, wǒ jiù bù qīngchǔle","vi":"Tôi chỉ biết anh ấy là học sinh lớp 6, còn về việc anh ấy sống ở đâu, thì tôi không rõ."}]},{"id":"HSK5-082","title":"总算 /Zǒngsuàn/","word_class":"Phó từ","explanation":"Biểu thị nguyện vọng cuối cùng cũng đã được thực hiện sau khi trải qua một khoảng thời gian dài (\"cuối cùng cũng\"). Biểu thị về mặt cơ bản vẫn vượt qua được (\"dù sao cũng\").","examples":[{"zh":"经过沟通，大导演总算搞明白了。","pinyin":"Jīngguò gōutōng, dà dǎoyǎn zǒngsuàn gǎo míngbáile","vi":"Sau khi trao đổi, đạo diễn lớn cuối cùng cũng đã hiểu ra."},{"zh":"虽然我对这家宾馆不太满意，但总算有个睡觉的地方了。","pinyin":"Suīrán wǒ duì zhè jiā bīngguǎn bú tài mǎnyì, dàn zǒngsuàn yǒu gè shuìjiào de dìfāngle","vi":"Mặc dù tôi không hài lòng lắm với khách sạn này, nhưng dù sao cũng có chỗ để ngủ rồi."}]},{"id":"HSK5-083","title":"下来 /Xiàlái/","word_class":"Bổ ngữ xu hướng","explanation":"Biểu thị hoàn thành (một hành động, một sự việc)","examples":[{"zh":"你的论文大概什么时候发表？定下来了吗？","pinyin":"Nǐ de lùnwén dàgài shénme shíhou fābiǎo? Dìng xiàláile ma?","vi":"Luận văn của bạn khoảng khi nào công bố? Đã định xong chưa?"}]},{"id":"HSK5-084","title":"舍不得 /Shěbudé/","word_class":"Động từ","explanation":"Biểu thị không muốn từ bỏ, tiêu phí hoặc sử dụng.","examples":[{"zh":"把你最喜欢的玩具送给小朋友，你舍得吗 ？","pinyin":"Bǎ nǐ zuì xǐhuān de wánjù sòng gěi xiǎopéngyǒu, nǐ shědé ma?","vi":"Tặng món đồ chơi yêu thích nhất của bạn cho em bé, bạn có nỡ không?"}]},{"id":"HSK5-085","title":"从此 /Cóngcǐ/","word_class":"Phó từ","explanation":"Biểu thị từ thời điểm này hoặc từ thời điểm nói trở đi (\"từ đó về sau\").","examples":[{"zh":"因为那场严重的误会，他们大吵了一架，从此两人的关系就疏远了。","pinyin":"Yīnwèi nà chǎng yánzhòng de wùhuì, tāmen dà chǎo le yī jià, cóngcǐ liǎng rén de guānxì jiù shūyuǎn le","vi":"Vì sự hiểu lầm nghiêm trọng đó, họ đã cãi nhau to, kể từ đó mối quan hệ của hai người trở nên xa cách."}]},{"id":"HSK5-086","title":"假设 /Jiǎshè/","word_class":"Động từ/Danh từ","explanation":"Động từ: Biểu thị coi một số tình huống là thật (\"giả sử\"). Danh từ: Biểu thị tình huống giả thiết, tưởng tượng (\"giả thiết\").","examples":[{"zh":"假设我要从国贸到鼓楼大街，该怎么乘车？","pinyin":"Jiǎshè wǒ yào cóng Guómào dào Gǔlóu Dàjiē, gāi zěnme chéngchē?","vi":"Giả sử tôi muốn đi từ Quốc Mậu đến phố Cổ Lâu, nên đi xe như thế nào?"},{"zh":"你当年的假设已经被证明是对的。","pinyin":"Nǐ dāngnián de jiǎshè yǐjīng bèi zhèngmíng shì duì de","vi":"Giả thiết năm đó của bạn đã được chứng minh là đúng."}]},{"id":"HSK5-087","title":"堆/Duī/","word_class":"Lượng từ/Động từ/Danh từ","explanation":"Lượng từ: Dùng cho đám người hoặc đống đồ vật. Động từ: Biểu thị dùng tay hoặc dụng cụ để xếp, chất lên nhau. Danh từ: Biểu thị đồ vật xếp cùng nhau.","examples":[{"zh":"门口放着好几堆刚送来的货物，还没整理。","pinyin":"Ménkǒu fàng zhe hǎo jǐ duī gāng sòng lái de huòwù, hái méi zhěnglǐ.","vi":"Ở cửa đặt mấy đống hàng hóa vừa mới gửi đến, vẫn chưa được sắp xếp."},{"zh":"快把房间里的玩具堆到一起，太乱了。","pinyin":"Kuài bǎ fángjiān lǐ de wánjù duī dào yīqǐ, tài luàn le","vi":"Mau chất/xếp đồ chơi trong phòng lại thành một đống đi, bừa bộn quá."},{"zh":"墙角有一堆废弃的纸箱。","pinyin":"Qiángjiǎo yǒu yī duī fèiqì de zhǐxiāng","vi":"Ở góc tường có một đống thùng carton bỏ đi."}]},{"id":"HSK5-088","title":"不如 /Bùrú/","word_class":"Động từ","explanation":"Biểu thị không thể sánh bằng.","examples":[{"zh":"三家的营业额加起来还不如他一家高。","pinyin":"Sān jiā de yíngyè'é jiā qǐlái hái bù rú tā yī jiā gāo","vi":"Doanh thu của ba cửa hàng cộng lại còn không cao bằng doanh thu của một mình cửa hàng anh ấy."}]},{"id":"HSK5-089","title":"干脆 /Gāncuì/","word_class":"Tính từ/Phó từ","explanation":"Tính từ: Dứt khoát Phó từ: Biểu thị đơn giản, quyết đoán","examples":[{"zh":"我求他帮忙，他答应得很干脆。","pinyin":"Wǒ qiú tā bāngmáng, tā dāyìng de hěn gāncuì","vi":"Tôi nhờ anh ấy giúp đỡ, anh ấy đồng ý rất dứt khoát."},{"zh":"我看我干脆放弃好了。","pinyin":"Wǒ kàn wǒ gāncuì fàngqì hǎo le.","vi":"Tôi nghĩ tôi cứ từ bỏ đi thôi."}]},{"id":"HSK5-090","title":"万一 /Wànyī/","word_class":"Liên từ/Danh từ","explanation":"Liên từ: Biểu thị khả năng rất nhỏ, thường dùng với trường hợp không ngờ đến hoặc bất lợi Danh từ: Biểu thị tình huống bất ngờ có khả năng rất nhỏ (thường dùng trong cách thức cố định “就怕万一”).","examples":[{"zh":"你带上伞吧，万一回来的时候下雨呢。","pinyin":"Nǐ dài shàng sǎn ba, wànyī huílái de shíhòu xià yǔ ne","vi":"Cậu mang theo ô đi, nhỡ đâu lúc về trời mưa thì sao."},{"zh":"我们考虑了所有可能性，连最坏的万一也都想到了。","pinyin":"Wǒmen kǎolǜ le suǒyǒu kěnéngxìng, lián zuì huài de wànyī yě dōu xiǎngdào le","vi":"Chúng tôi đã cân nhắc mọi khả năng, ngay cả trường hợp xấu nhất cũng đã nghĩ tới."}]},{"id":"HSK5-091","title":"无意 /Wúyì/","word_class":"Động từ","explanation":"Động từ: Có nghĩa là không muốn, không có ý định..","examples":[{"zh":"我无意打扰您，不过我可以跟您谈一会儿吗？","pinyin":"Wǒ wúyì dǎrǎo nín, búguò wǒ kěyǐ gēn nín tán yīhuǐ'er ma?","vi":"Tôi không có ý định làm phiền ngài, nhưng tôi có thể nói chuyện với ngài một lát được không?."}]},{"id":"HSK5-092","title":"有利 /Yǒulì/","word_class":"Tính từ","explanation":"Có nghĩa là có lợi, có ích (thường dùng “有利于” để biểu thị có lợi cho người hoặc vật nào đó).","examples":[{"zh":"高高的个子，漂亮的外表，都是他的有利条件。","pinyin":"Gāo gāo de gèzi, piàoliang de wàibiǎo, dōu shì tā de yǒulì tiáojiàn.","vi":"Chiều cao nổi bật, vẻ ngoài xinh đẹp, đều là những điều kiện có lợi của anh ấy."}]},{"id":"HSK5-093","title":"的确 /Díquè/","word_class":"Phó từ","explanation":"Ý nghĩa là hoàn toàn chính xác, chân thực (\"quả thực, đích thực\").","examples":[{"zh":"他的确我所教过的学生中最聪明的。","pinyin":"Tā díquè wǒ suǒ jiāoguò de xuésheng zhōng zuì cōngming de","vi":"Anh ấy quả thực là người thông minh nhất trong số những học sinh mà tôi từng dạy."}]},{"id":"HSK5-094","title":"嗯(Ńg/Ǹg)","word_class":"Thán từ","explanation":"Biểu thị nghi vấn. Biểu thị đáp ứng hoặc chấp thuận.","examples":[{"zh":"嗯？不是28号，难道是我记错了？","pinyin":"Ńg? Bú shì èrshíbā hào, nándào shì wǒ jì cuòle?","vi":"Hả? Không phải ngày 28, chẳng lẽ tôi nhớ nhầm rồi?."},{"zh":"嗯，如果您心情好，我就说件事。","pinyin":"Ǹg, rúguǒ nín xīnqíng hǎo, wǒ jiù shuō jiàn shì","vi":"Ừm, nếu ngài đang có tâm trạng tốt, tôi sẽ nói một việc."}]},{"id":"HSK5-095","title":"轻易 /Qīngyì/","word_class":"Tính từ/Phó từ","explanation":"Tính từ: đơn giản, dễ dàng Phó từ: Biểu thị thái độ khi xử lí công việc không cẩn thận, rất tùy tiện. Thường dùng trong câu phủ định (“轻易不·····” nghĩa là “rất ít làm”).","examples":[{"zh":"1假，就这样轻易地请好了。","pinyin":"Jiǎ, jiù zhèyàng qīngyì de qǐng hǎole.","vi":"Xin nghỉ phép cứ thế dễ dàng được chấp thuận"},{"zh":"他为人好强，轻易不求人。","pinyin":"Tā wéirén hàoqiáng, qīngyì bù qiú rén","vi":"Anh ấy là người tự cường, không dễ dàng nhờ vả người khác."}]},{"id":"HSK5-096","title":"密切 /Mìqiè/","word_class":"Tính từ/Động từ","explanation":"Tính từ: Biểu thị quan hệ gần gũi, mật thiết. Động từ: Có nghĩa làm cho quan hệ trở nên gần gũi mật thiết hơn.","examples":[{"zh":"多年来，两国一直保持着密切的友好关系。","pinyin":"Duō nián lái, liǎng guó yīzhí bǎochí zhe mìqiè de yǒuhǎo guānxì","vi":"Trong nhiều năm qua, hai nước vẫn luôn duy trì mối quan hệ hữu nghị mật thiết."},{"zh":"双方领导人同意密切各领域的合作。","pinyin":"Shuāngfāng lǐngdǎo rén tóngyì mìqiè gè lǐngyù de hézuò","vi":"Lãnh đạo hai bên đồng ý tăng cường/thắt chặt hợp tác trên các lĩnh vực."}]},{"id":"HSK5-097","title":"尽量 /Jǐnliàng/","word_class":"Phó từ","explanation":"Biểu thị trong một phạm vi nhất định nỗ lực đạt đến mức độ cao nhất (\"cố gắng hết sức\").","examples":[{"zh":"老年人要尽量少吃油炸食品。","pinyin":"Lǎonián rén yào jǐnliàng shǎo chī yóu zhá shí pǐn","vi":"Người già cần cố gắng hạn chế ăn đồ chiên rán."}]},{"id":"HSK5-098","title":"逐步 /Zhúbù/","word_class":"Phó từ","explanation":"Biểu thị từng bước từng bước một (thường dùng trong những tình huống do con người làm ra).","examples":[{"zh":"调整能源消费结构，逐步向可再生能源转变。","pinyin":"Tiáozhěng néngyuán xiāofèi jiégòu, zhúbù xiàng kě zàishēng néngyuán zhuǎnbiàn.","vi":"Điều chỉnh cơ cấu tiêu thụ năng lượng, từng bước chuyển đổi sang năng lượng tái tạo."}]},{"id":"HSK5-099","title":"照常 /Zhàochán g/","word_class":"Động từ/Phó từ","explanation":"Động từ: Có nghĩa là giống như bình thường Phó từ: Biểu thị tình huống tiếp tục không thay đổi (\"như thường lệ\").","examples":[{"zh":"这里的日常生活，一切照常。","pinyin":"Zhèlǐ de rìcháng shēnghuó, yīqiè zhàocháng","vi":"Cuộc sống hàng ngày ở đây, mọi thứ vẫn như thường lệ."},{"zh":"在东方广场的迎新活动照常举行。","pinyin":"Zài Dōngfāng Guǎngchǎng de yíngxīn huódòng zhàocháng jǔxíng","vi":"Hoạt động đón năm mới tại quảng trường Đông Phương vẫn được tổ chức như thường lệ."}]},{"id":"HSK5-100","title":"难怪 /Nánguài/","word_class":"Động từ/Phó từ","explanation":"Động từ: không nên phê bình, oán trách), mang ngữ khí thông cảm, tha thứ. Phó từ: Biểu thị đã rõ nguyên nhân, không còn cảm thấy lạ lùng với tình huống nào đó nữa (\"thảo nào, hèn chi\").","examples":[{"zh":"这也难怪","pinyin":"Zhè yě nánguài","vi":"Điều này cũng không trách được."},{"zh":"你的抽屉真乱，难怪总是找不到东西。","pinyin":"Nǐ de chōuti zhēn luàn, nánguài zǒng shì zhǎo bù dào dōngxi","vi":"Ngăn kéo của cậu thật bừa bộn, thảo nào luôn không tìm thấy đồ."}]},{"id":"HSK5-101","title":"与其 /Yǔqí/","word_class":"Liên từ","explanation":"Dùng khi so sánh 2 tình huống cần phải lựa chọn, “与其” sử dụng về mặt từ bỏ, đằng sau có thể kết hợp dùng\nvới “不如” hoặc “宁可” (\"thà rằng... còn hơn\").","examples":[{"zh":"与其在这儿干着急，不如我们主动打电话去问问情况。","pinyin":"Yǔqí zài zhèr gān zháojí, bùrú wǒmen zhǔdòng dǎ diànhuà qù wèn wen qíngkuàng","vi":"Thà rằng cứ ngồi đây lo sốt vó, chi bằng chúng ta chủ động gọi điện hỏi tình hình."}]},{"id":"HSK5-102","title":"过/Guò/","word_class":"Bổ ngữ xu hướng","explanation":"Biểu thị người hoặc vật thể thông qua động tác để thay đổi phương hướng hoặc di chuyển vị trí.","examples":[{"zh":"他转过身，一句话也不说。","pinyin":"Tā zhuǎn guò shēn, yī jù huà yě bù shuō","vi":"Anh ấy quay người lại, không nói một lời nào."}]},{"id":"HSK5-103","title":"开/Kāi/","word_class":"Bổ ngữ xu hướng","explanation":"Biểu thị mở ra, giãn ra.","examples":[{"zh":"请你让开一下，我要过去。","pinyin":"Qǐng nǐ ràng kāi yīxià, wǒ yào guòqù","vi":"Làm ơn tránh/tránh ra một chút, tôi cần đi qua."}]},{"id":"HSK5-104","title":"赶快 /Gǎnkuài/","word_class":"Phó từ","explanation":"Ý nghĩa là bắt kịp thời gian, gia tăng tốc độ).","examples":[{"zh":"我下个月要搬家，得赶快找房子。","pinyin":"Wǒ xià gè yuè yào bānjiā, děi gǎnkuài zhǎo fángzi","vi":"Tháng sau tôi phải chuyển nhà, phải nhanh chóng tìm nhà."}]},{"id":"HSK5-105","title":"片/Piàn/","word_class":"Danh từ/Lượng từ","explanation":"Danh từ: Đồ vật có bề mặt phẳng, mỏng, thường không quá lớn Lượng từ: Dùng để chỉ những đồ vật thành phiến, cũng có thể dùng với âm thanh, cảnh sắc.","examples":[{"zh":"瓶子里装着满满的石头、玻璃碎片和沙子。","pinyin":"Píngzi lǐ zhuāngzhe mǎnmǎn de shítou, bōli suìpiàn hé shāzi","vi":"Trong chai đựng đầy đá, mảnh thủy tinh và cát."},{"zh":"同学们听了，发出一片热烈的欢呼声。","pinyin":"Tóngxuémen tīngle, fā chū yī piàn rèliè de huānhū shēng","vi":"Các bạn học sinh nghe xong, phát ra một tràng tiếng reo hò nhiệt liệt."}]},{"id":"HSK5-106","title":"根本 /Gēnběn/","word_class":"Danh từ/Tính từ/Phó từ","explanation":"Danh từ: Bộ phận quan trọng nhất của sự vật. Tính từ: Ý nghĩa là “chủ yếu, quan trọng nhất” Phó từ: Biểu thị từ đầu đến cuối, trước sau như một","examples":[{"zh":"想学好汉语，单词是根本。","pinyin":"Xiǎng xué hǎo Hànyǔ, dāncí shì gēnběn","vi":"Muốn học tốt tiếng Hán, từ vựng là gốc rễ/nền tảng."},{"zh":"我们的根本目的是帮助大家学好中文。","pinyin":"Wǒmen de gēnběn mùdì shì bāngzhù dàjiā xué hǎo Zhōngwén","vi":"Mục đích cốt lõi/chính của chúng tôi là giúp mọi người học tốt tiếng Trung."},{"zh":"他根本没听你说话。","pinyin":"Tā gēnběn méi tīng nǐ shuōhuà","vi":"Anh ta hoàn toàn không nghe bạn nói."}]},{"id":"HSK5-107","title":"除非 /Chúfēi/","word_class":"Liên từ/Giới từ","explanation":"Liên từ: Biểu thị điều kiện duy nhất, giống với “只有”, đằng sau thường đi với “才、 否则、不然” (\"trừ phi\")..Giới từ: ngoại trừ","examples":[{"zh":"除非明天下大雨，否则比赛照常进行。","pinyin":"Chúfēi míngtiān xià dàyǔ, fǒuzé bǐsài zhàocháng jìnxíng","vi":"Trừ phi ngày mai trời mưa to, nếu không thì trận đấu vẫn diễn ra như thường lệ."},{"zh":"这种机器，除非李阳，没人修得好。","pinyin":"Zhè zhǒng jīqì, chúfēi Lǐ Yáng, méi rén xiū de hǎo","vi":"Loại máy này, trừ Lý Dương ra, không ai sửa được."}]},{"id":"HSK5-108","title":"直/Zhí/","word_class":"Phó từ","explanation":"Dùng để diễn tả hành động diễn ra liên tục, không bị gián đoạn, thường đứng trước động từ đơn âm tiết.\nNhấn mạnh một hành động kéo dài, lặp đi lặp lại hoặc làm hoài không nghỉ.","examples":[{"zh":"这趟车可以直达北京，非常方便。","pinyin":"Zhè tàng chē kěyǐ zhídá Běijīng, fēicháng fāngbiàn","vi":"Chuyến xe này có thể đi thẳng đến Bắc Kinh, rất tiện lợi."}]},{"id":"HSK5-109","title":"反正 /Fǎnzhèng/","word_class":"Phó từ","explanation":"Biểu thị tình huống tuy không giống nhưng kết quả lại như nhau (\"dù sao thì\").\nBiểu thị ngữ khí kiên quyết khẳng định.","examples":[{"zh":"不管你们谁去，反正我不会去。","pinyin":"Bùguǎn nǐmen shuí qù, fǎnzhèng wǒ bú huì qù","vi":"Bất kể ai trong các cậu đi, dù sao thì tôi cũng sẽ không đi."},{"zh":"你别再说了，反正我是会考虑的。","pinyin":"Nǐ bié zài shuōle, fǎnzhèng wǒ shì huì kǎolǜ de.","vi":"Cậu đừng nói nữa, dù sao thì tôi cũng sẽ xem xét."}]}],"exam_focus":[]},{"level":6,"name":"HSK 6","grammar_count":70,"grammar":[{"id":"HSK6-001","title":"巴不得/bā bù dé/","explanation":"Động từ biểu thị ý rất mong muốn hoặc cực kỳ hy vọng điều gì đó xảy ra, thường dùng trong khẩu ngữ.","examples":[{"zh":"在这种竞争激烈的环境中，他巴不得能找到一份安稳的工作，养家糊口.","pinyin":"Zài zhè zhǒng jìng zhēng jī liè de huán jìng zhōng, tā bā bù dé néng zhǎo dào yī fèn ān wěn de gōng zuò, yǎng jiā hú kǒu","vi":"Trong môi trường cạnh tranh khốc liệt này, anh ấy chỉ mong tìm được một công việc ổn định để nuôi sống gia đình."}]},{"id":"HSK6-002","title":"别提多……了 /bié tí duō...le/","explanation":"Cụm từ biểu thị mức độ rất cao của tính chất nào đó, thường mang sắc thái cường điệu hoặc phóng đại.","examples":[{"zh":"看到公司在国际市场上的影响力日益扩大，我们别提多高兴了.","pinyin":"Kàn dào gōng sī zài guó jì shì chǎng shàng de yǐng xiǎng lì rì yì kuò dà, wǒ men bié tí duō gāo xìng le","vi":"Thấy sức ảnh hưởng của công ty trên thị trường quốc tế ngày càng mở rộng, chúng tôi vui không thể tả."}]},{"id":"HSK6-003","title":"顿/dùn/","explanation":"Phó từ biểu thị hành động xảy ra trong thời gian ngắn hoặc số lần lặp lại của hành động.","examples":[{"zh":"由于他在研发方面做出了突出贡献，公司决定给他的年终奖翻了顿.","pinyin":"Yóu yú tā zài yán fā fāng miàn zuò chū le tū chū gòng xiàn, gōng sī jué dìng gěi tā de nián zhōng jiǎng fān le dùn","vi":"Do anh ấy có đóng góp nổi bật, công ty quyết định tăng gấp đôi tiền thưởng cuối năm cho anh ấy."}]},{"id":"HSK6-004","title":"过于/guò yú/","explanation":"Phó từ biểu thị vượt quá một mức độ nhất định hoặc quá mức, thường dùng để bổ nghĩa cho tính từ hoặc động từ/cụm động từ.","examples":[{"zh":"投资决策过于草率，最终给公司带来了不可挽回的损失.","pinyin":"Tóu zī jué cè guò yú cǎo shuài, zuì zhōng gěi gōng sī dài lái le bù kě wǎn huí de sǔn shī","vi":"Quyết định đầu tư quá hấp tấp, cuối cùng đã mang lại thiệt hại không thể cứu vãn cho công ty."}]},{"id":"HSK6-005","title":"着呢/zhe ne/","explanation":"Trợ từ ngữ khí, biểu thị mức độ sâu, mang sắc thái khoa trương/cường điệu.","examples":[{"zh":"别看这项技术看似简单，其实背后的理论知识复杂着呢.","pinyin":"Bié kàn zhè xiàng jì shù kàn sì jiǎn dān, qí shí bèi hòu de lǐ lùn zhī shí fù zá zhe ne","vi":"Đừng thấy kỹ thuật này tưởng chừng đơn giản, thực ra kiến thức lý luận đằng sau phức tạp lắm đấy."}]},{"id":"HSK6-006","title":"说A就A /shuō A jiù A/","explanation":"Cấu trúc dùng trong khẩu ngữ, biểu thị hành động xảy ra hoặc tiến triển rất nhanh khi có sự việc phát sinh. \"A\" là động từ hoặc cụm động từ/tính từ ngắn.","examples":[{"zh":"市场竞争激烈，很多新兴企业说倒闭就倒闭，让人防不胜防.","pinyin":"Shì chǎng jìng zhēng jī liè, hěn duō xīn xīng qǐ yè shuō dǎo bì jiù dǎo bì, ràng rén fáng bù shèng fáng","vi":"Cạnh tranh thị trường khốc liệt, nhiều doanh nghiệp mới nói phá sản là phá sản, khiến người ta không kịp trở tay."}]},{"id":"HSK6-007","title":"形容词/动词+ 得+要命/xíng róng cí/dòng cí + de + yào mìng/","explanation":"Cấu trúc bổ ngữ mức độ, biểu thị mức độ đạt đến cực điểm hoặc rất cao.","examples":[{"zh":"公司的改革方案遭到了许多老员工的反对，让他们头疼得要命.","pinyin":"Gōng sī de gǎi gé fāng àn zāo dào le xǔ duō lǎo yuán gōng de fǎn duì, ràng tā men tóu téng de yào mìng","vi":"Kế hoạch cải cách của công ty bị nhiều nhân viên cũ phản đối, khiến họ đau đầu kinh khủng."}]},{"id":"HSK6-008","title":"乘机/chéng jī/","explanation":"Động từ/Phó từ, nghĩa là tận dụng cơ hội để làm một việc gì đó.","examples":[{"zh":"他乘机向听众普及了相关的金融知识，赢得了大家的赞许.","pinyin":"Tā chéng jī xiàng tīng zhòng pǔ jí le xiāng guān de jīn róng zhī shí, yíng dé le dà jiā de zàn xǔ","vi":"Anh ấy nhân cơ hội phổ biến kiến thức tài chính liên quan cho khán giả, giành được sự tán dương của mọi người."}]},{"id":"HSK6-009","title":"不料/bù liào/","explanation":"Liên từ, biểu thị bất ngờ, không ngờ đến, thường đi kèm với các phó từ như却,竟,果然,倒,还.","examples":[{"zh":"我们为这次项目做了充分的准备，不料市场需求突然发生了巨大的变化.","pinyin":"Wǒ men wèi zhè cì xiàng mù zuò le chōng fèn de zhǔn bèi, bù liào shì chǎng xū qiú tū rán fā shēng le jù dà de biàn huà","vi":"Chúng tôi đã chuẩn bị đầy đủ cho dự án này, không ngờ nhu cầu thị trường lại đột ngột thay đổi lớn."}]},{"id":"HSK6-010","title":"未免/wèi miǎn/","explanation":"Phó từ, biểu thị không tránh khỏi việc đạt đến một mức độ nào đó (thường là tiêu cực), nói rằng điều gì đó là không phù hợp hoặc quá mức.","examples":[{"zh":"他的言辞未免有些偏激，很容易引起听众的反感.","pinyin":"Tā de yán cí wèi miǎn yǒu xiē piān jī, hěn róng yì yǐn qǐ tīng zhòng de fǎn gǎn","vi":"Lời lẽ của anh ấy quả thực hơi cực đoan, rất dễ gây ác cảm cho người nghe."}]},{"id":"HSK6-011","title":"而已/ér yǐ/","explanation":"Trợ từ, dùng ở cuối câu hoặc sau cụm từ, biểu thị chỉ vậy mà thôi, không gì hơn.","examples":[{"zh":"我们之所以能取得今天的成就，靠的不过是日复一日的坚持而已.","pinyin":"Wǒ men zhī suǒ yǐ néng qǔ dé jīn tiān de chéng jiù, kào de bú guò shi rì fù yī rì de jiān chí ér yǐ","vi":"Sở dĩ chúng ta đạt được thành tựu hôm nay, chẳng qua chỉ là nhờ sự kiên trì ngày qua ngày mà thôi."}]},{"id":"HSK6-012","title":"固然/gù rán/","explanation":"Liên từ, biểu thị thừa nhận một sự thật hoặc một khía cạnh, câu sau thường dùng但是,可是, 不过để chuyển ý hoặc đưa ra ý kiến phản đối.","examples":[{"zh":"创新固然重要，但是我们必须在遵守法律法规的前提下进行.","pinyin":"Chuàng xīn gù rán zhòng yào, dàn shi wǒ men bì xū zài zūn shǒu fǎ lǜ fǎ guī de qián tí xià jìn xíng","vi":"Đổi mới tất nhiên quan trọng, nhưng chúng ta phải tiến hành trên cơ sở tuân thủ pháp luật."}]},{"id":"HSK6-013","title":"并非/bìng fēi/","explanation":"Phó từ/Động từ, biểu thị phủ định hoàn toàn, nghĩa là \"không phải\", thường dùng trong văn viết.","examples":[{"zh":"他的成功并非一蹴而就，而是经过了无数次失败和挫折.","pinyin":"Tā de chéng gōng bìng fēi yī cù ér jiù, ér shi jīng guò le wú shù cì shī bài hé cuò zhé","vi":"Thành công của anh ấy không hề đạt được một sớm một chiều, mà là qua vô số lần thất bại và vấp ngã."}]},{"id":"HSK6-014","title":"唯独/wéi dú/","explanation":"Phó từ, biểu thị chỉ một người/vật/sự việc là ngoại lệ, thường dùng để nhấn mạnh sự so sánh hoặc đối lập.","examples":[{"zh":"参加会议的成员都对提案表示赞同，唯独他提出了反对意见.","pinyin":"Cān jiā huì yì de chéng yuán dōu duì tí àn biǎo shì zàn tóng, wéi dú tā tí chū le fǎn duì yì jiàn","vi":"Các thành viên tham dự cuộc họp đều đồng ý với đề xuất, chỉ riêng anh ấy đưa ra ý kiến phản đối."}]},{"id":"HSK6-015","title":"明明/míng míng/","explanation":"Phó từ, biểu thị rõ ràng là như vậy nhưng thực tế lại khác, thường dùng để nhấn mạnh sự nghi vấn, không hài lòng, hoặc kinh ngạc.","examples":[{"zh":"这项工程明明预算充足，怎么会出现资金短缺的问题呢.","pinyin":"Zhè xiàng gōng chéng míng míng yù suàn chōng zú, zěn me huì chū xiàn zī jīn duǎn quē de wèn tí ne","vi":"Dự án này rõ ràng có ngân sách đầy đủ, tại sao lại xuất hiện vấn đề thiếu vốn?"}]},{"id":"HSK6-016","title":"大不了/dà bù liǎo/","explanation":"Phó từ, dùng trong khẩu ngữ, biểu thị điều tồi tệ nhất có thể xảy ra, thường mang sắc thái không quan trọng, hoặc thể hiện sự dứt khoát.","examples":[{"zh":"如果谈判无法达成一致，大不了我们放弃合作，寻找新的伙伴.","pinyin":"Rú guǒ tán pàn wú fǎ dá chéng yī zhì, dà bù liǎo wǒ men fàng qì hé zuò, xún zhǎo xīn de huǒ bàn","vi":"Nếu đàm phán không đạt được thỏa thuận, cùng lắm chúng ta từ bỏ hợp tác, tìm kiếm đối tác mới."}]},{"id":"HSK6-017","title":"对……而言 /duì...ér yán/","explanation":"Cấu trúc, biểu thị đối với ai đó/phương diện nào đó mà nói, dùng để xác định phạm vi hoặc góc độ nhận định.","examples":[{"zh":"对一个有着远大抱负的年轻人而言，稳定和安逸并非人生的终极目标.","pinyin":"Duì yī gè yǒu zhe yuǎn dà bào fù de nián qīng rén ér yán, wěn dìng hé ān yì bìng fēi rén shēng de zhōng jí mù biāo","vi":"Đối với một người trẻ có hoài bão lớn, ổn định và an nhàn không phải là mục tiêu cuối cùng của cuộc đời."}]},{"id":"HSK6-018","title":"有关/yǒu guān/","explanation":"Động từ/Tính từ/Giới từ, biểu thị có liên quan.","examples":[{"zh":"我们正在收集所有有关这次事故的详细资料和证人证词.","pinyin":"Wǒ men zhèng zài shōu jí suǒ yǒu yǒu guān zhè cì shì gù de xiáng xì zī liào hé zhèng rén zhèng cí","vi":"Chúng tôi đang thu thập tất cả tài liệu chi tiết và lời khai nhân chứng liên quan đến vụ tai nạn này."}]},{"id":"HSK6-019","title":"不瞒你说/bù mán nǐ shuō/","explanation":"Cụm từ dùng để mở đầu câu nói, biểu thị sự thật, chân thành (thường là một lời khuyên hoặc ý kiến chủ quan).","examples":[{"zh":"不瞒你说，我对他处理这件事的方式并不完全认同，认为过于冲动.","pinyin":"Bù mán nǐ shuō, wǒ duì tā chǔ lǐ zhè jiàn shì de fāng shì bìng bù wán quán rèn tóng, rèn wéi guò yú chōng dòng","vi":"Thật lòng mà nói, tôi không hoàn toàn đồng tình với cách anh ấy xử lý chuyện này, cho rằng quá bốc đồng."}]},{"id":"HSK6-020","title":"于/yú/","explanation":"Giới từ, biểu thị thời điểm, nơi chốn, hoặc đối tượng/phương diện. Thường dùng trong văn viết.","examples":[{"zh":"他决定在工作了三年的公司离职，开始人生的新一页.","pinyin":"Tā jué dìng zài gōng zuò le sān nián de gōng sī lí zhí, kāi shǐ rén shēng de xīn yī yè","vi":"Anh ấy quyết định nghỉ việc ở công ty đã làm ba năm, bắt đầu một trang mới cho cuộc đời."}]},{"id":"HSK6-021","title":"致使/zhì shǐ/","explanation":"Động từ, biểu thị gây ra một kết quả nào đó (thường là tiêu cực). Câu trước chỉ nguyên nhân, câu sau là kết quả.","examples":[{"label":"1","zh":"管理层的重大失误直接致使公司陷入了前所未有的财务危机.","pinyin":"Guǎn lǐ céng de zhòng dà shī wù zhí jiē zhì shǐ gōng sī xiàn rù le qián suǒ wèi yǒu de cái wù wēi jī","vi":"Sai lầm lớn của ban quản lý đã trực tiếp gây ra cuộc khủng hoảng tài chính chưa từng có cho công ty."}]},{"id":"HSK6-022","title":"日益/rì yì/ 越来越/yuè lái yuè/","explanation":"Phó từ, 日益biểu thị mức độ tăng lên theo thời gian (ngày càng), dùng để tu sức cho động từ hoặc tính từ/cụm động từ. 越来越cũng biểu thị mức độ tăng dần.","examples":[{"zh":"随着技术的日益成熟，自动驾驶汽车将很快普及到日常生活中.","pinyin":"Suí zhe jì shù de rì yì chéng shú, zì dòng jià shǐ qì chē jiāng hěn kuài pǔ jí dào rì cháng shēng huó zhōng","vi":"Cùng với sự trưởng thành ngày càng cao của công nghệ, ô tô tự lái sẽ sớm phổ biến trong đời sống hàng ngày."},{"zh":"国际贸易形势越来越复杂，企业必须积极调整策略才能应对挑战.","pinyin":"Guó jì mào yì xíng shì yuè lái yuè fù zá, qǐ yè bì xū jī jí tiáo zhěng cè lüè cái néng yìng duì tiǎo zhàn","vi":"Tình hình thương mại quốc tế ngày càng phức tạp, doanh nghiệp phải tích cực điều chỉnh chiến lược mới có thể ứng phó với thách thức."}]},{"id":"HSK6-023","title":"时而/shí ér/","explanation":"Phó từ, biểu thị lúc thì... lúc thì..., chỉ sự việc lặp lại không theo quy luật, thường đi kèm với nhau.","examples":[{"zh":"在高海拔地区，天气变化无常，时而艳阳高照，时而风雪交加.","pinyin":"Zài gāo hǎi bá dì qū, tiān qì biàn huà wú cháng, shí ér yàn yáng gāo zhào, shí ér fēng xuě jiāo jiā","vi":"Ở vùng cao, thời tiết thất thường, lúc trời nắng chang chang, lúc lại mưa tuyết xen kẽ."}]},{"id":"HSK6-024","title":"不禁/bù jīn/","explanation":"Phó từ, biểu thị không kìm được, không thể ngăn chặn (hành động hoặc cảm xúc).","examples":[{"zh":"面对如此精湛绝伦的艺术品，他不禁发出由衷的赞叹.","pinyin":"Miàn duì rú cǐ jīng zhàn jué lún de yì shù pǐn, tā bù jīn fā chū yóu zhōng de zàn tàn","vi":"Trước tác phẩm nghệ thuật tuyệt vời đến thế, anh ấy không kìm được mà thốt lên lời tán thưởng chân thành."}]},{"id":"HSK6-025","title":"无不/wú bù/","explanation":"Phó từ, biểu thị không gì là không, tất cả đều (phủ định kép mang ý khẳng định tuyệt đối).","examples":[{"zh":"博物馆里展出的每一件文物，无不凝聚着古代劳动人民的智慧和心血.","pinyin":"Bó wù guǎn lǐ zhǎn chū de měi yī jiàn wén wù, wú bù níng jù zhe gǔ dài láo dòng rén mín de zhì huì hé xīn xuè.","vi":"Mỗi hiện vật được trưng bày trong bảo tàng đều cô đọng trí tuệ và tâm huyết của người lao động thời cổ đại."}]},{"id":"HSK6-026","title":"即便/jí biàn/","explanation":"Liên từ, biểu thị dù cho, cho dù (nhượng bộ giả định), thường đi kèm với 也hoặc还ở mệnh đề sau.","examples":[{"zh":"即便这项挑战难度极大，我们也要全力以赴，争取最好的结果.","pinyin":"Jí biàn zhè xiàng tiǎo zhàn nán dù jí dà, wǒ men yě yào quán lì yǐ fù, zhēng qǔ zuì hǎo de jié guǒ","vi":"Cho dù thử thách này cực kỳ khó khăn, chúng ta vẫn phải dốc toàn lực để đạt được kết quả tốt nhất."}]},{"id":"HSK6-027","title":"统统/tǒng tǒng/","explanation":"Phó từ, biểu thị tất cả, hoàn toàn (không có ngoại lệ nào).","examples":[{"zh":"经过这次彻底的清查，公司内部的腐败分子被统统清除出局.","pinyin":"Jīng guò zhè cì chè dǐ de qīng chá, gōng sī nèi bù de fǔ bài fèn zi bèi tǒng tǒng qīng chú chū jú.","vi":"Sau đợt thanh tra triệt để này, những phần tử tham nhũng trong công ty tất cả đã bị loại bỏ."}]},{"id":"HSK6-028","title":"以……为…… /yǐ...wéi.../","explanation":"Cấu trúc giới từ, biểu thị lấy cái gì đó làm cái gì đó (làm căn cứ, mục tiêu, hoặc tiêu chuẩn).","examples":[{"zh":"这家企业一直以科技创新为核心竞争力，不断引领行业发展.","pinyin":"Zhè jiā qǐ yè yī zhí yǐ kē jì chuàng xīn wéi hé xīn jìng zhēng lì, bú duàn yǐn lǐng háng yè fā zhǎn","vi":"Doanh nghiệp này luôn lấy đổi mới công nghệ làm năng lực cạnh tranh cốt lõi, không ngừng dẫn dắt sự phát triển của ngành."}]},{"id":"HSK6-029","title":"不妨/bù fáng/","explanation":"Phó từ, đưa ra lời khuyên hoặc đề nghị), thường có nghĩa nhẹ nhàng, hàm ý thử một lần.","examples":[{"zh":"如果你在研究过程中遇到瓶颈，不妨换个角度思考问题，也许会有新的发现.","pinyin":"Rú guǒ nǐ zài yán jiū guò chéng zhōng yù dào píng jǐng, bù fáng huàn gè jiǎo dù sī kǎo wèn tí, yě xǔ huì yǒu xīn de fā xiàn","vi":"Nếu bạn gặp bế tắc trong quá trình nghiên cứu, hãy thử thay đổi góc độ suy nghĩ, biết đâu sẽ có phát hiện mới."}]},{"id":"HSK6-030","title":"务必/wù bì/","explanation":"Phó từ, biểu thị nhất định phải, cần phải (nhấn mạnh sự kiên quyết hoặc cần thiết).","examples":[{"zh":"既然要参加这次高规格的国际会议，代表团成员务必提前做好充分准备.","pinyin":"Jì rán yào cān jiā zhè cì gāo guī gé de guó jì huì yì, dài biǎo tuán chéng yuán wù bì tí qián zuò hǎo chōng fèn zhǔn bèi","vi":"Vì phải tham dự hội nghị quốc tế quy mô lớn này, các thành viên phái đoàn tuyệt đối phải chuẩn bị đầy đủ từ trước."}]},{"id":"HSK6-031","title":"鉴于/jiàn yú/","explanation":"Giới từ: dựa trên một tình hình hoặc sự kiện nào đó), thường dùng trong văn viết.","examples":[{"zh":"鉴于他在公司的突出贡献，董事会决定给予他丰厚的奖励.","pinyin":"Jiàn yú tā zài gōng sī de tū chū gòng xiàn, dǒng shì huì jué dìng gěi yǔ tā fēng hòu de jiǎng lì","vi":"Căn cứ vào những đóng góp nổi bật của anh ấy cho công ty, hội đồng quản trị quyết định trao cho anh ấy phần thưởng hậu hĩnh."}]},{"id":"HSK6-032","title":"不得已/ bù dé yǐ/ 不得不/bù dé bù/","explanation":"Cặp phó từ. 不得已biểu thị không còn cách nào khác. 不得不biểu thị không thể không, nhấn mạnh sự bị động buộc phải làm điều gì đó.","examples":[{"zh":"不得已:由于资金链断裂，公司不得已采取裁员措施，以维持运营.","pinyin":"Yóu yú zī jīn liàn duàn liè, gōng sī bù dé yǐ cǎi qǔ cái yuán cuò shī, yǐ wéi chí yùn yíng","vi":"Do đứt gãy chuỗi vốn, công ty buộc lòng phải áp dụng biện pháp cắt giảm nhân sự để duy trì hoạt động."},{"zh":"不得不:为了避免事态扩大，他不得不主动出面，向公众澄清事实.","pinyin":"Wèi le bì miǎn shì tài kuò dà, tā bù dé bù zhǔ dòng chū miàn, xiàng gōng zhòng chéng qīng shì shí","vi":"Để tránh tình hình mở rộng, anh ấy không thể không đứng ra chủ động làm rõ sự thật với công chúng."}]},{"id":"HSK6-033","title":"以免/yǐ miǎn/","explanation":"Liên từ, biểu thị để tránh điều gì đó (thường là kết quả không mong muốn), thường dùng ở mệnh đề sau.","examples":[{"zh":"请在提交文件前再次核对信息，以免因疏漏而影响审批进度.","pinyin":"Qǐng zài tí jiāo wén jiàn qián zài cì hé duì xìn xī, yǐ miǎn yīn shū lòu ér yǐng xiǎng shěn pī jìn dù","vi":"Vui lòng kiểm tra lại thông tin trước khi nộp tài liệu, để tránh việc bỏ sót làm ảnh hưởng đến tiến độ phê duyệt."}]},{"id":"HSK6-034","title":"嫌/xián/","explanation":"Động từ, biểu thị không thích, không vừa lòng, chê. Thường đi với嫌+ Danh từ/Tính từ/Hình dung từ.","examples":[{"zh":"这家企业改革步伐缓慢，被许多年轻的求职者嫌弃，认为缺乏创新活力.","pinyin":"Zhè jiā qǐ yè gǎi gé bù fá huǎn màn, bèi xǔ duō nián qīng de qiú zhí zhě xián qì, rèn wéi quē fá chuàng xīn huó lì","vi":"Doanh nghiệp này cải cách chậm, bị nhiều người tìm việc trẻ tuổi chê bai vì thiếu sức sống đổi mới."}]},{"id":"HSK6-035","title":"动不动/dòng bú dòng/","explanation":"Phó từ, biểu thị hành động xảy ra liên tục, thường xuyên mà không có lý do rõ ràng, mang sắc thái phê phán/không hài lòng.","examples":[{"zh":"这位经理处理问题非常情绪化，动不动就对下属发脾气，令人难以忍受.","pinyin":"Zhè wèi jīng lǐ chǔ lǐ wèn tí fēi cháng qíng xù huà, dòng bú dòng jiù duì xià shǔ fā pí qì, lìng rén nán yǐ rěn shòu","vi":"Vị quản lý này xử lý vấn đề rất cảm tính, hễ tí là nổi nóng với cấp dưới, khó mà chịu đựng được."}]},{"id":"HSK6-036","title":"甲乙丙丁…… /jiǎ yǐ bǐng dīng.../","explanation":"Cấu trúc dùng để liệt kê, sắp xếp sự việc theo thứ tự hoặc phân chia nhóm, thường dùng trong văn viết/các bài tập mang tính chất liệt kê.","examples":[{"zh":"这份调研报告主要包括甲乙丙丁四个部分，详细分析了市场前景.","pinyin":"Zhè fèn diào yán bào gào zhǔ yào bāo kuò jiǎ yǐ bǐng dīng sì gè bù fèn, xiáng xì fēn xī le shì chǎng qián jǐng","vi":"Báo cáo khảo sát này chủ yếu bao gồm bốn phần A, B, C, D, phân tích chi tiết triển vọng thị trường."}]},{"id":"HSK6-037","title":"加以/jiā yǐ/","explanation":"Động từ, biểu thị thực hiện hoặc tiến hành một phương pháp/thái độ nào đó với sự vật/sự việc nêu ra ở câu trước. Sau加以 là một động từ hai âm tiết.","examples":[{"zh":"针对报告中提出的问题，管理层表示将认真研究并加以改进.","pinyin":"Zhēn duì bào gào zhōng tí chū de wèn tí, guǎn lǐ céng biǎo shì jiāng rèn zhēn yán jiū bìng jiā yǐ gǎi jìn","vi":"Đối với các vấn đề được nêu trong báo cáo, ban quản lý cho biết sẽ nghiên cứu kỹ lưỡng và tiến hành cải tiến."}]},{"id":"HSK6-038","title":"大大、远远(dà dà, yuǎn yuǎn)","explanation":"Phó từ,大大biểu thị mức độ rất sâu hoặc số lượng lớn.远远biểu thị rất xa hoặc rất nhiều (vượt xa mức dự tính).","examples":[{"zh":"大大:新政策的实施大大提高了生产效率，为公司节省了大量的成本.","pinyin":"Xīn zhèng cè de shí shī dà dà tí gāo le shēng chǎn xiào lǜ, wèi gōng sī jié shěng le dà liàng de chéng běn","vi":"Việc thực hiện chính sách mới đã nâng cao đáng kể hiệu quả sản xuất, tiết kiệm rất nhiều chi phí cho công ty."},{"zh":"远远:事实证明，他的能力远远超出了我们的预期，足以胜任这项艰巨的任务.","pinyin":"Shì shí zhèng míng, tā de néng lì yuǎn yuǎn chāo chū le wǒ men de yù qī, zú yǐ shèng rèn zhè xiàng jiān jù de rèn wù","vi":"Sự thật chứng minh năng lực của anh ấy vượt xa kỳ vọng của chúng tôi, đủ sức đảm nhận nhiệm vụ khó khăn này."}]},{"id":"HSK6-039","title":"紧缩句/jǐn suō jù/","explanation":"Biện pháp tu từ, là hình thức rút gọn nội dung của câu, làm cho câu trở nên ngắn gọn và súc tích hơn.","examples":[{"zh":"我宁愿失去一切，也不愿放弃原则.","pinyin":"Wǒ níng yuàn shī qù yī qiè, (yě) bú yuàn fàng qì yuán zé","vi":"Tôi thà mất tất cả, cũng không muốn từ bỏ nguyên tắc."}]},{"id":"HSK6-040","title":"特意/tè yì/","explanation":"Phó từ, biểu thị cố ý, chủ tâm làm một việc gì đó.","examples":[{"zh":"为了表达对这位专家的敬意，主办方特意为他准备了隆重的欢迎仪式.","pinyin":"Wèi le biǎo dá duì zhè wèi zhuān jiā de jìng yì, zhǔ bàn fāng tè yì wèi tā zhǔn bèi le lóng zhòng de huān yíng yí shì","vi":"Để bày tỏ sự tôn kính đối với chuyên gia này, ban tổ chức đã đặc biệt chuẩn bị một buổi lễ chào mừng long trọng cho ông."}]},{"id":"HSK6-041","title":"即将/jí jiāng/","explanation":"Phó từ, biểu thị điều gì đó ắp xảy ra. Thường dùng trong văn viết.","examples":[{"zh":"经过几个月的紧张筹备，这项大型国际项目即将进入实施阶段.","pinyin":"Jīng guò jǐ gè yuè de jǐn zhāng chóu bèi, zhè xiàng dà xíng guó jì xiàng mù jí jiāng jìn rù shí shī jiē duàn","vi":"Sau vài tháng chuẩn bị gấp rút, dự án quốc tế quy mô lớn này sắp sửa bước vào giai đoạn thực hiện."}]},{"id":"HSK6-042","title":"能A就A /néng A jiù A/","explanation":"Cấu trúc dùng trong khẩu ngữ, biểu thị tận lực hoặc hết sức (A là động từ/tính từ).","examples":[{"zh":"既然领导给了我们充分的授权，我们就应该能解决就解决，不要事事都请示.","pinyin":"Jì rán lǐng dǎo gěi le wǒ men chōng fèn de shòu quán, wǒ men jiù yīng gāi néng jiě jué jiù jiě jué, bú yào shì shì dōu qǐng shì","vi":"Vì lãnh đạo đã ủy quyền đầy đủ, chúng ta giải quyết được thì cứ giải quyết, đừng việc gì cũng xin ý kiến."}]},{"id":"HSK6-043","title":"别说/bié shuō/","explanation":"Động từ, biểu thị nhường bộ, thường nhấn mạnh một người hoặc sự vật khác (thường là một điều ít quan trọng hơn) để làm nổi bật điều quan trọng hơn.","examples":[{"zh":"他这个人向来心胸宽广，别说是受到批评，就算是遇到更大的挫折也不会轻易放弃.","pinyin":"Tā zhè gè rén xiàng lái xīn xiōng kuān guǎng, bié shuō shi shòu dào pī píng, jiù suàn shi yù dào gèng dà de cuò zhé yě bú huì qīng yì fàng qì","vi":"Người anh ấy vốn rất rộng lượng, đừng nói là bị chỉ trích, ngay cả khi gặp thất bại lớn hơn cũng sẽ không dễ dàng bỏ cuộc."}]},{"id":"HSK6-044","title":"来来回回","explanation":"Lặp lại động từ, biểu thị hành động lặp đi lặp lại (dạng AABB).","examples":[{"zh":"她为了研究这个复杂的图案，来来回回地翻阅了大量的古代文献资料.","pinyin":"Tā wèi le yán jiū zhè gè fù zá de tú àn, lái lái huí huí dì fān yuè le dà liàng de gǔ dài wén xiàn zī liào","vi":"Để nghiên cứu hoa văn phức tạp này, cô ấy đã lật đi lật lại rất nhiều tài liệu cổ."}]},{"id":"HSK6-045","title":"左……右…… /zuǒ...yòu.../","explanation":"Cấu trúc dùng để nhấn mạnh một hành vi/tình huống lặp lại nhiều lần, A và B thường là động\ntừ hoặc cụm động từ tương tự.","examples":[{"zh":"整个团队都围绕着这个方案左修改右调整，力求达到最完美的效果.","pinyin":"Zhěng gè tuán duì dōu wéi rào zhe zhè gè fāng àn zuǒ xiū gǎi yòu tiáo zhěng, lì qiú dá dào zuì wán měi de xiào guǒ","vi":"Cả đội hết chỉnh sửa lại điều chỉnh xoay quanh đề án này, nhằm đạt được hiệu quả hoàn hảo nhất."}]},{"id":"HSK6-046","title":"不成/bù chéng/","explanation":"Trợ từ, dùng ở cuối câu, biểu thị suy đoán hoặc ngữ khí phản vấn (chẳng lẽ, không được sao). Phía trước câu thường có 难道hoặc莫非.","examples":[{"zh":"大家都认为这是一个可行的方案，难道只有你觉得有问题不成?","pinyin":"Dà jiā dōu rèn wéi zhè shi yī gè kě xíng de fāng àn, nán dào zhǐ yǒu nǐ jué de yǒu wèn tí bù chéng","vi":"Mọi người đều cho rằng đây là một phương án khả thi, chẳng lẽ chỉ có mình bạn thấy có vấn đề sao?"}]},{"id":"HSK6-047","title":"Cấu trúc Động từ/Tính từ +了 +个+ Danh từ/Tính từ có chứa个","explanation":"Biểu thị hành động xảy ra nhanh chóng, đột ngột hoặc số lượng tăng lên.","examples":[{"zh":"听到这个突如其来的好消息，我心里咯噔了一个，久久不能平静.","pinyin":"Tīng dào zhè gè tū rú qí lái de hǎo xiāo xi, wǒ xīn lǐ gē dēng le yī gè, jiǔ jiǔ bù néng píng jìng","vi":"Nghe tin vui bất ngờ này, lòng tôi nảy lên một cái, mãi không thể bình tĩnh lại."}]},{"id":"HSK6-048","title":"向来/xiàng lái/","explanation":"Phó từ, biểu thị từ trước đến nay vẫn luôn như vậy.","examples":[{"zh":"他向来以严谨细致著称，在科研领域从不马虎.","pinyin":"Tā xiàng lái yǐ yán jǐn xì zhì zhù chēng, zài kē yán lǐng yù cóng bù mǎ hǔ","vi":"Anh ấy trước nay nổi tiếng là nghiêm túc và tỉ mỉ, không bao giờ qua loa trong lĩnh vực nghiên cứu khoa học."}]},{"id":"HSK6-049","title":"预先/yù xiān/","explanation":"Phó từ, biểu thị hành động hoặc sự việc xảy ra trước khi sự việc chính thức diễn ra","examples":[{"zh":"为了确保活动顺利进行，我们预先制定了多套应急预案.","pinyin":"Wèi le qùn bǎo huó dòng shùn lì jìn xíng, wǒ men yù xiān zhì dìng le duō tào yìng jí yù àn","vi":"Để đảm bảo hoạt động diễn ra suôn sẻ, chúng tôi đã chuẩn bị trước nhiều bộ kế hoạch khẩn cấp."}]},{"id":"HSK6-050","title":"……也好, ……也罢(...yě hǎo,...yě bà)","explanation":"Cấu trúc liệt kê, biểu thị trong bất kỳ tình huống nào (dù A hay B), kết quả vẫn như vậy. Thường đi với都/总ở vế sau.","examples":[{"zh":"无论是经济发展也好，环境保护也罢，我们都应该坚持可持续发展的原则.","pinyin":"Wú lùn shi jīng jì fā zhǎn yě hǎo, huán jìng bǎo hù yě bà, wǒ men dōu yīng gāi jiān chí kě chí xù fā zhǎn de yuán zé","vi":"Bất kể là phát triển kinh tế hay bảo vệ môi trường, chúng ta đều phải tuân thủ nguyên tắc phát triển bền vững."}]},{"id":"HSK6-051","title":"不时/bù shí/","explanation":"Phó từ, biểu thị sự thỉnh thoảng (không cố định).","examples":[{"zh":"尽管已经离开了家乡多年，但她不时会想起童年的美好回忆.","pinyin":"Jǐn guǎn yǐ jīng lí kāi le jiā xiāng duō nián, dàn tā bù shí huì xiǎng qǐ tóng nián de měi hǎo huí yì","vi":"Mặc dù đã rời xa quê hương nhiều năm, nhưng cô ấy thỉnh thoảng vẫn nhớ lại những ký ức tuổi thơ tươi đẹp."}]},{"id":"HSK6-052","title":"多多少少/duō duō shǎo shǎo/","explanation":"Phó từ/Tính từ lặp lại, biểu thị ít nhiều, ở một mức độ nào đó.","examples":[{"zh":"经过这次挫折，他对自己的能力多多少少产生了一些怀疑.","pinyin":"Jīng guò zhè cì cuò zhé, tā duì zì jǐ de néng lì duō duō shǎo shǎo chǎn shēng le yī xiē huái yí","vi":"Sau thất bại lần này, anh ấy ít nhiều đã nảy sinh nghi ngờ về năng lực của bản thân."}]},{"id":"HSK6-053","title":"逐/zhú/","explanation":"Giới từ/Phó từ, biểu thị sự lần lượt, từng bước.","examples":[{"zh":"随着全球经济一体化进程加快，各国之间的贸易壁垒正被逐渐打破.","pinyin":"Suí zhe quán qiú jīng jì yī tǐ huà jìn chéng jiā kuài, gè guó zhī jiān de mào yì bì lěi zhèng bèi zhú jiàn dǎ pò","vi":"Cùng với quá trình toàn cầu hóa kinh tế tăng tốc, rào cản thương mại giữa các quốc gia đang dần dần bị phá vỡ."}]},{"id":"HSK6-054","title":"归根到底/guī gēn dào dǐ/","explanation":"Nói tóm lại, chung quy lại (đi đến bản chất vấn đề).","examples":[{"zh":"无论这项技术如何先进，归根到底，它只是人类实现目标的工具.","pinyin":"Wú lùn zhè xiàng jì shù rú hé xiān jìn, guī gēn dào dǐ, tā zhǐ shi rén lèi shí xiàn mù biāo de gōng jù","vi":"Bất kể công nghệ này tiên tiến đến đâu, chung quy lại, nó chỉ là công cụ để con người đạt được mục tiêu."}]},{"id":"HSK6-055","title":"哪怕/nǎ pà/","explanation":"Liên từ, biểu thị dù cho, ngay cả (giả định cực đoan), thường đi kèm với也hoặc都ở vế sau.","examples":[{"zh":"哪怕只剩下微弱的希望，我们也要坚持不懈地努力下去.","pinyin":"Nǎ pà zhǐ shèng xià wēi ruò de xī wàng, wǒ men yě yào jiān chí bú xiè dì nǔ lì xià qù","vi":"Ngay cả khi chỉ còn lại tia hy vọng mong manh, chúng ta vẫn phải kiên trì nỗ lực không ngừng."}]},{"id":"HSK6-056","title":"反之/fǎn zhī/","explanation":"Liên từ, biểu thị sự ngược lại. Thường dùng để chuyển ý, đưa ra điều kiện hoặc kết quả đối lập.","examples":[{"zh":"采取积极的应对策略有助于化解危机；反之，消极逃避只会使局势更加恶化.","pinyin":"Cǎi qǔ jī jí de yìng duì cè lüè yǒu zhù yú huà jiě wēi jī; fǎn zhī, xiāo jí táo bì zhǐ huì shǐ jú shì gèng jiā è huà","vi":"Áp dụng chiến lược ứng phó tích cực sẽ giúp hóa giải khủng hoảng; ngược lại, trốn tránh tiêu cực chỉ làm tình hình thêm tồi tệ."}]},{"id":"HSK6-057","title":"A的A, B的B (A de A, B de B)","explanation":"Cấu trúc liệt kê, biểu thị sự liệt kê của một số tình huống hoặc sự vật, thường dùng trong khẩu ngữ.","examples":[{"zh":"晚会上，人们唱歌的唱歌，跳舞的跳舞，尽情享受欢乐的时光.","pinyin":"Wǎn huì shàng, rén men chàng gē de chàng gē, tiào wǔ de tiào wǔ, jìn qíng xiǎng shòu huān lè de shí guāng","vi":"Trong buổi tiệc tối, mọi người người hát thì hát, người nhảy thì nhảy, tận hưởng thời gian vui vẻ."}]},{"id":"HSK6-058","title":"一时/yī shí/","explanation":"Phó từ, biểu thị tạm thời, đột ngột (xảy ra trong thời gian ngắn). Cũng có thể dùng để biểu thị sự lặp lại.","examples":[{"zh":"面对媒体的追问，发言人一时语塞，不知如何回应.","pinyin":"Miàn duì méi tǐ de zhuī wèn, fā yán rén yī shí yǔ sè, bù zhī rú hé huí yìng","vi":"Trước sự truy vấn của truyền thông, người phát ngôn bất chợt nghẹn lời, không biết trả lời thế nào."}]},{"id":"HSK6-059","title":"尚且/shàng qiě/","explanation":"Liên từ, biểu thị vẫn còn, còn (một sự vật/tình huống ở mức độ thấp đã xảy ra), vế sau thường dùng何况/更để nhấn mạnh điều ở mức độ cao hơn.","examples":[{"zh":"像他这样精明能干的人尚且犯错，何况是我们这些缺乏经验的新手.","pinyin":"Xiàng tā zhè yàng jīng míng néng gàn de rén shàng qiě fàn cuò, hé kuàng shi wǒ men zhè xiē quē fá jīng yàn de xīn shǒu","vi":"Người tài giỏi như anh ấy còn mắc sai lầm, huống chi là những người mới thiếu kinh nghiệm như chúng ta."}]},{"id":"HSK6-060","title":"当/dāng/","explanation":"Giới từ, biểu thị đang ở thời điểm hoặc địa điểm nào đó","examples":[{"label":"1","zh":"他当时正在国外出差，错过了公司重要的年度会议.","pinyin":"Tā dāng shí zhèng zài guó wài chū chāi, cuò guò le gōng sī zhòng yào de nián dù huì yì","vi":"Anh ấy khi đó đang đi công tác nước ngoài, nên đã bỏ lỡ cuộc họp thường niên quan trọng của công ty."}]},{"id":"HSK6-061","title":"终究/zhōng jiū/","explanation":"Phó từ, biểu thị rốt cuộc, cuối cùng (nhấn mạnh kết quả hoặc bản chất).","examples":[{"zh":"经过多方的努力，这件悬而未决的法律纠纷终究得到了公正的解决.","pinyin":"Jīng guò duō fāng de nǔ lì, zhè jiàn xuán ér wèi jué de fǎ lǜ jiū fēn zhōng jiū dé dào le gōng zhèng de jiě jué","vi":"Sau nỗ lực của nhiều bên, tranh chấp pháp lý còn bỏ ngỏ này rốt cuộc đã được giải quyết công bằng."}]},{"id":"HSK6-062","title":"愈……愈…… /yù...yù.../","explanation":"Cấu trúc liên từ, biểu thị càng...càng... (mức độ tăng tiến song song).","examples":[{"zh":"随着学习的深入，我们愈发愈认识到汉语文化的博大精深.","pinyin":"Suí zhe xué xí de shēn rù, wǒ men yù fā yù rèn shí dào Hàn yǔ wén huà de bó dà jīng shēn","vi":"Học càng sâu, chúng ta càng nhận thức được sự uyên thâm của văn hóa Hán ngữ."}]},{"id":"HSK6-063","title":"一经/yī jīng/","explanation":"Phó từ, dùng cho câu trên, biểu thị chỉ cần qua một hành động/bước nào đó, sẽ có kết quả tương ứng xảy ra.","examples":[{"zh":"这项新政策一经宣布，立即引起了社会各界的广泛关注.","pinyin":"Zhè xiàng xīn zhèng cè yī jīng xuān bù, lì jí yǐn qǐ le shè huì gè jiè de guǎng fàn guān zhù","vi":"Chính sách mới này vừa được công bố, lập tức đã thu hút sự quan tâm rộng rãi từ mọi tầng lớp xã hội"}]},{"id":"HSK6-064","title":"本着+名词 /běn zhe + míng cí/","explanation":"Cấu trúc giới từ, biểu thị dựa trên một nguyên tắc, tinh thần, thái độ nào đó.","examples":[{"zh":"我们始终本着互利共赢的原则，与合作伙伴共同发展.","pinyin":"Wǒ men shǐ zhōng běn zhe hù lì gòng yíng de yuán zé, yǔ hé zuò huǒ bàn gòng tóng fā zhǎn","vi":"Chúng tôi luôn dựa trên nguyên tắc cùng có lợi, cùng phát triển với đối tác."}]},{"id":"HSK6-065","title":"为……起见 /wèi...qǐ jiàn/","explanation":"Cấu trúc giới từ, biểu thị vì lợi ích của, vì mục đích nào đó.","examples":[{"zh":"为保障施工质量起见，工程团队对原材料进行了严格的筛选.","pinyin":"Wèi bǎo zhàng shī gōng zhì liàng qǐ jiàn, gōng chéng tuán duì duì yuán cái liào jìn xíng le yán gé de shāi xuǎn","vi":"Vì mục đích đảm bảo chất lượng thi công, đội ngũ kỹ thuật đã tiến hành sàng lọc nghiêm ngặt đối với nguyên vật liệu."}]},{"id":"HSK6-066","title":"暂且/zàn qiě/","explanation":"Phó từ, biểu thị sự tạm thời, tạm gác lại.","examples":[{"zh":"既然现在无法达成共识，我们暂且搁置争议，以后再议.","pinyin":"Jì rán xiàn zài wú fǎ dá chéng gòng shí, wǒ men zàn qiě gē zhì zhēng yì, yǐ hòu zài yì","vi":"Vì hiện tại không thể đạt được sự đồng thuận, chúng ta tạm thời gác lại tranh cãi, bàn sau."}]},{"id":"HSK6-067","title":"屡次/lǚ cì/","explanation":"Phó từ, biểu thị nhiều lần, lặp đi lặp lại (xảy ra một lần, một lần nữa).","examples":[{"zh":"他屡次违背合同条款，我们不得不考虑终止与他的合作关系.","pinyin":"Tā lǚ cì wéi bèi hé tóng tiáo kuǎn, wǒ men bù dé bù kǎo lǜ zhōng zhǐ yǔ tā de hé zuò guān xi","vi":"Anh ta nhiều lần vi phạm các điều khoản hợp đồng, chúng tôi buộc phải xem xét chấm dứt quan hệ hợp tác với anh ta."}]},{"id":"HSK6-068","title":"依据/yī jù/","explanation":"Động từ/Danh từ/Giới từ, biểu thị căn cứ, cơ sở để lập luận hoặc hành động","examples":[{"zh":"这项决策是依据最新的市场调研数据和专家意见做出的.","pinyin":"Zhè xiàng jué cè shi yī jù zuì xīn de shì chǎng diào yán shù jù hé zhuān jiā yì jiàn zuò chū de","vi":"Quyết định này được đưa ra dựa trên dữ liệu khảo sát thị trường và ý kiến chuyên gia mới nhất."}]},{"id":"HSK6-069","title":"任意/rèn yì/","explanation":"Phó từ, biểu thị tùy ý, thoải mái, không có sự ràng buộc hay hạn chế.","examples":[{"zh":"在民主社会中，公民可以任意表达自己的观点，但需对言论负责.","pinyin":"Zài mín zhǔ shè huì zhōng, gōng mín kě yǐ rèn yì biǎo dá zì jǐ de guān diǎn, dàn xū duì yán lùn fù zé","vi":"Trong xã hội dân chủ, công dân có thể tự do bày tỏ quan điểm của mình, nhưng phải chịu trách nhiệm về lời nói."}]},{"id":"HSK6-070","title":"尚末/shàng wèi/","explanation":"Phó từ, biểu thị vẫn chưa.","examples":[{"zh":"尽管我们已经取得了初步进展，但距离最终成功尚末可知.","pinyin":"Jǐn guǎn wǒ men yǐ jīng qǔ dé le chū bù jìn zhǎn,

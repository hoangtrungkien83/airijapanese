<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Học HSK theo giáo trình mới</title>
<style>
:root{--bg:#faf6ee;--card:#fff;--tx:#2a2420;--mu:#7a6f66;--ac:#c8312b;--ac2:#f3e3d3;--ok:#2f8f4e;--bad:#c8312b;--bd:#e6dccd;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1715;--card:#26201d;--tx:#f1e9e0;--mu:#a99d92;--ac:#ff6b5e;--ac2:#3a2c27;--ok:#5fd186;--bad:#ff6b5e;--bd:#3b322d}}
:root[data-theme="dark"]{--bg:#1b1715;--card:#26201d;--tx:#f1e9e0;--mu:#a99d92;--ac:#ff6b5e;--ac2:#3a2c27;--ok:#5fd186;--bad:#ff6b5e;--bd:#3b322d}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.zh{font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif}
header{padding:20px 16px 8px;max-width:860px;margin:auto}
h1{margin:0;font-size:1.5rem}h1 span{color:var(--ac)}
header p{margin:4px 0 0;color:var(--mu);font-size:.9rem}
nav{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5;display:flex;gap:6px;overflow-x:auto;padding:10px 16px;max-width:860px;margin:auto}
nav button{flex:none;border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:8px 14px;border-radius:999px;font:inherit;font-size:.9rem;cursor:pointer}
nav button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
main{max-width:860px;margin:auto;padding:8px 16px 48px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin:12px 0}
h2{font-size:1.2rem;margin:4px 0 8px}h3{font-size:1rem;margin:14px 0 6px;color:var(--ac)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.chip{background:var(--ac2);border-radius:10px;padding:8px 10px;font-size:.9rem}
.big{font-size:2rem;line-height:1.2}
.mu{color:var(--mu)}.py{color:var(--ac);font-weight:600}
.btn{border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:8px 14px;border-radius:10px;font:inherit;cursor:pointer}
.btn.p{background:var(--ac);color:#fff;border-color:var(--ac)}
.btn.ok{background:var(--ok);color:#fff;border-color:var(--ok)}
select,input{font:inherit;padding:8px 10px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%}td,th{padding:7px 8px;border-bottom:1px solid var(--bd);text-align:left;vertical-align:top}
.fc{perspective:900px;margin:14px 0}
.fc .face{min-height:220px;border:2px solid var(--bd);background:var(--card);border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;cursor:pointer}
.fc .face .big{font-size:3.4rem}
.opt{display:block;width:100%;text-align:left;margin:8px 0}
.opt.right{background:var(--ok);color:#fff;border-color:var(--ok)}.opt.wrong{background:var(--bad);color:#fff;border-color:var(--bad)}
.bar{height:8px;background:var(--ac2);border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac)}
.ex{border-left:3px solid var(--ac);padding:2px 10px;margin:8px 0}
.t1{color:#d64545}.t2{color:#d98a1d}.t3{color:#2f8f4e}.t4{color:#3b7bd6}
.qc{perspective:1400px;margin:12px 0}.qi{position:relative;height:360px;transition:transform .5s cubic-bezier(.4,.2,.2,1);transform-style:preserve-3d;cursor:pointer}.qi.fl{transform:rotateY(180deg)}.qf{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--card);border:1px solid var(--bd);border-radius:18px;box-shadow:0 4px 16px rgba(0,0,0,.1);display:flex;overflow:auto;padding:48px 20px 20px;text-align:center}.qb{transform:rotateY(180deg)}.qf .in{margin:auto;width:100%}.qt{position:absolute;top:10px;left:10px;right:10px;display:flex;justify-content:space-between}.ib{border:0;background:transparent;color:var(--mu);font-size:1.3rem;cursor:pointer;padding:4px 8px;border-radius:8px}.ib:hover{background:var(--ac2)}.pill{padding:3px 12px;border-radius:99px;font-size:.85rem;font-weight:600}.lr{background:#fbe3c8;color:#a35a0a}.kn{background:#d3f0dc;color:#1f6b3a}
</style>
</head>

<script>
const TABS=[["home","Tổng quan"],["vocab","Từ vựng"],["gram","Ngữ pháp"],["flash","Flashcard"],["quiz","Kiểm tra"]];
/* hanzi|pinyin|nghĩa|cấp (cấp mang tính tham khảo – bạn có thể thêm từ vào đây) */
const D=[[1,"爱",1,"ài","ái","yêu, thích","我爱我的家。","Wǒ ài wǒ de jiā.","Tôi yêu gia đình của tôi."],[2,"爱好",1,"àihào","ái hảo","sở thích","你的爱好是什么？","Nǐ de àihào shì shénme?","Sở thích của bạn là gì?"],[3,"八",1,"bā","bát","số 8","他今年八岁了。","Tā jīnnián bā suì le.","Năm nay nó 8 tuổi rồi."],[4,"爸爸",1,"bàba","ba ba","bố, ba, cha","我爸爸是老师。","Wǒ bàba shì lǎoshī.","Bố tôi là giáo viên."],[5,"吧",1,"ba","ba","nào, nhé, chứ, đi (trợ từ)","我们走吧。","Wǒmen zǒu ba.","Chúng ta đi thôi nào."],[6,"白",1,"bái","bạch","trắng","我喜欢白色的衣服。","Wǒ xǐhuān báisè de yīfu.","Tôi thích quần áo màu trắng."],[7,"白天",1,"báitiān","bạch thiên","ban ngày","他白天不在家。","Tā báitiān bú zàijiā.","Ban ngày anh ấy không có nhà."],[8,"百",1,"bǎi","bách","một trăm","这本书一百块钱。","Zhè běn shū yìbǎi kuài qián.","Cuốn sách này một trăm tệ."],[9,"班",1,"bān","ban","lớp","我们在一个班学习。","Wǒmen zài yí gè bān xuéxí.","Chúng tôi học cùng một lớp."],[10,"半",1,"bàn","bán","một nửa","现在是三点半。","Xiànzài shì sān diǎn bàn.","Bây giờ là ba giờ rưỡi."],[11,"半年",1,"bàn nián","bán niên","nửa năm","他去中国半年了。","Tā qù Zhōngguó bàn nián le.","Anh ấy đi Trung Quốc nửa năm rồi."],[12,"半天",1,"bàn tiān","bán thiên","nửa ngày","我等了你半天。","Wǒ děngle nǐ bàntiān.","Tôi đã đợi bạn nửa ngày trời."],[13,"帮",1,"bāng","bang","giúp đỡ","你能帮我一个忙吗？","Nǐ néng bāng wǒ yí gè máng ma?","Bạn có thể giúp tôi một tay không?"],[14,"帮忙",1,"bāngmáng","bang mang","giúp đỡ","谢谢你帮我的忙。","Xièxie nǐ bāng wǒ de máng.","Cảm ơn bạn đã giúp đỡ tôi."],[15,"包",1,"bāo","bao","bao, cái túi; gói, bọc","桌子上有一个包。","Zhuōzi shàng yǒu yí gè bāo.","Trên bàn có một cái túi."],[16,"包子",1,"bāozi","bao tử","bánh bao","我想吃包子。","Wǒ xiǎng chī bāozi.","Tôi muốn ăn bánh bao."],[17,"杯",1,"bēi","bôi","cốc, ly (lượng từ)","请给我一杯水。","Qǐng gěi wǒ yì bēi shuǐ.","Xin cho tôi một cốc nước."],[18,"杯子",1,"bēizi","bôi tử","cốc, chén, ly","这个杯子是谁的？","Zhè gè bēizi shì shéi de?","Cái cốc này là của ai?"],[19,"北",1,"běi","bắc","bắc","火车站往北走。","Huǒchēzhàn wǎng běi zǒu.","Ga tàu hỏa đi về phía bắc."],[20,"北边",1,"běibiān","bắc biên","phía Bắc","学校的北边是一个商场。","Xuéxiào de běibiān shì yí gè shāngchǎng.","Phía bắc của trường học là một trung tâm thương mại."],[21,"北京",1,"Běijīng","Bắc Kinh","Bắc Kinh","我在北京工作。","Wǒ zài Běijīng gōngzuò.","Tôi làm việc ở Bắc Kinh."],[22,"本",1,"běn","bản","cuốn, quyển, tập","这里有三本书。","Zhèlǐ yǒu sān běn shū.","Ở đây có ba quyển sách."],[23,"本子",1,"běnzi","bản tử","vở, cuốn vở","我在本子上写字。","Wǒ zài běnzi shàng xiězì.","Tôi viết chữ vào vở."],[24,"比",1,"bǐ","tỷ","so, so với","今天比昨天冷。","Jīntiān bǐ zuótiān lěng.","Hôm nay lạnh hơn hôm qua."],[25,"别",1,"bié","biệt","đừng, không được","别看电视 electron 了。","Bié kàn diànshì le.","Đừng xem tivi nữa."],[26,"别的",1,"biéde","biệt đích","cái khác","你还要别的吗？","Nǐ hái yào biéde ma?","Bạn còn cần cái khác không?"],[27,"别人",1,"biérén","biệt nhân","người khác, người ta","我们要多帮助别人。","Wǒmen yào duō bāngzhù biérén.","Chúng ta phải giúp đỡ người khác nhiều hơn."],[28,"病",1,"bìng","bệnh","bệnh","他生病了，没来上课。","Tā shēngbìng le, méi lái shàngkè.","Anh ấy bị bệnh rồi, không đến lên lớp."],[29,"病人",1,"bìngrén","bệnh nhân","bệnh nhân","医院里有很多病人。","Yīyuàn lǐ yǒu hěn duō bìngrén.","Trong bệnh viện có rất nhiều bệnh nhân."],[30,"不大",1,"bú dà","bất đại","nhỏ, không lớn","这个房间不大。","Zhè gè fángjiān bú dà.","Căn phòng này không lớn."],[31,"不对",1,"búduì","bất đối","không đúng","你说得不对。","Nǐ shuō de búduì.","Bạn nói không đúng rồi."],[32,"不客气",1,"bú kèqi","bất khách khí","không có gì","谢谢你的帮助。- 不客气！","Xièxie nǐ de bāngzhù. - Bú kèqi!","Cảm ơn sự giúp đỡ của bạn. - Không có gì!"],[33,"不用",1,"búyòng","bất dụng","không cần","你不用去了。","Nǐ búyòng qù le.","Bạn không cần đi nữa đâu."],[34,"不",1,"bù","bất","không","我不认识他。","Wǒ bù rènshi tā.","Tôi không quen biết anh ấy."],[35,"菜",1,"cài","thái","đồ ăn, món ăn","妈妈做的菜很好吃。","Māma zuò de cài hěn hǎochī.","Món ăn mẹ nấu rất ngon."],[36,"差",1,"chà","sai","thiếu, kém","现在差五分一点。","Xiànzài chà wǔ fēn yì diǎn.","Bây giờ là một giờ kém năm phút."],[37,"茶",1,"chá","trà","trà","请喝茶。","Qǐng hē chá.","Xin mời uống trà."],[38,"常",1,"cháng","thường","thường","我常去图书馆看书。","Wǒ cháng qù túshūguǎn kànshū.","Tôi thường đến thư viện đọc sách."],[39,"常常",1,"chángcháng","thường thường","thường thường","我们常常一起吃午饭。","Wǒmen chángcháng yìqǐ chī wǔfàn.","Chúng tôi thường thường cùng nhau ăn trưa."],[40,"唱",1,"chàng","xướng","hát","她唱歌唱得很好听。","Tā chànggē chàng de hěn hǎotīng.","Cô ấy hát rất hay."],[41,"唱歌",1,"chànggē","xướng ca","hát, ca hát","你不喜欢唱歌吗？","Nǐ bù xǐhuān chànggē ma?","Bạn không thích ca hát à?"],[42,"车",1,"chē","xa","xe","这是谁的车？","Zhè shì shéi de chē?","Đây là xe của ai?"],[43,"车票",1,"chēpiào","xa phiếu","vé xe","我的车票在哪儿？","Wǒ de chēpiào zài nǎr?","Vé xe của tôi ở đâu vậy?"],[44,"车上",1,"chē shang","xa thượng","trên xe","车上有很多学生。","Chē shang yǒu hěn duō xuéshēng.","Trên xe có rất nhiều học sinh."],[45,"车站",1,"chēzhàn","xa trạm","bến xe","我在车站等你。","Wǒ zài chēzhàn děng nǐ.","Tôi đợi bạn ở bến xe."],[46,"吃",1,"chī","ngật","ăn","你喜欢吃什么？","Nǐ xǐhuān chī shénme?","Bạn thích ăn cái gì?"],[47,"吃饭",1,"chīfàn","ngật phản","ăn cơm","我们去吃饭吧。","Wǒmen qù chīfàn ba.","Chúng ta đi ăn cơm đi."],[48,"出",1,"chū","xuất","ra, xuất","他已经出去了。","Tā yǐjīng chūqù le.","Anh ấy đã ra ngoài rồi."],[49,"出来",1,"chūlái","xuất lai","xuất hiện, đi ra","请你出来一下。","Qǐng nǐ chūlái yíxià.","Xin mời bạn đi ra đây một lát."],[50,"出去",1,"chūqù","xuất khứ","ra, ra ngoài","外面下雨了，别出去。","Wàimiàn xiàyǔ le, bié chūqù.","Bên ngoài mưa rồi, đừng ra ngoài."],[51,"穿",1,"chuān","xuyên","mặc","今天很冷，多穿点衣服。","Jīntiān hěn lěng, duō chuān diǎn yīfu.","Hôm nay rất lạnh, mặc nhiều áo vào một chút."],[52,"床",1,"chuáng","sàng","giường, đệm","房间里有一张床。","Fángjiān lǐ yǒu yì zhāng chuáng.","Trong phòng có một chiếc giường."],[53,"次",1,"cì","thứ","lần","我去过一次北京。","Wǒ qùguo yí cì Běijīng.","Tôi đã từng đi Bắc Kinh một lần."],[54,"从",1,"cóng","tùng","từ, qua, theo","我从越南来。","Wǒ cóng Yuènán lái.","Tôi đến từ Việt Nam."],[55,"错",1,"cuò","thác","sai","对不起，我错了。","Duìbuqǐ, wǒ cuò le.","Xin lỗi, tôi sai rồi."],[56,"打",1,"dǎ","đả","đánh, bắt","他在打球呢。","Tā zài dǎqiú ne.","Anh ấy đang đánh bóng kìa."],[57,"打车",1,"dǎchē","đả xa","bắt xe, đón taxi","我们打车去学校吧。","Wǒmen dǎchē qù xuéxiào ba.","Chúng mình bắt taxi đến trường đi."],[58,"打电话",1,"dǎ diànhuà","đả điện thoại","gọi điện","我给妈妈打电话。","Wǒ gěi māma dǎ diànhuà.","Tôi gọi điện thoại cho mẹ."],[59,"打开",1,"dǎkāi","đả khai","mở, mở ra","请打开书。","Qǐng dǎkāi shū.","Mời mở sách ra."],[60,"打球",1,"dǎ qiú","đả cầu","chơi bóng","下午我们去打球好吗？","Xiàwǔ wǒmen qù dǎqiú hǎo ma?","Chiều nay chúng mình đi chơi bóng nhé?"],[61,"大",1,"dà","đại","to, lớn","这个苹果很大。","Zhè gè píngguǒ hěn dà.","Quả táo này rất lớn."],[62,"大学",1,"dàxué","đại học","đại học","他在北京大学学习。","Tā zài Běijīng Dàxué xuéxí.","Anh ấy học ở trường Đại học Bắc Kinh."],[63,"大学生",1,"dàxuéshēng","đại học sinh","sinh viên đại học","我是大学一年级的学生。","Wǒ shì dàxué yī niánjí de xuéshēng.","Tôi là sinh viên đại học năm thứ nhất."],[64,"到",1,"dào","đáo","đến, tới","我到家了。","Wǒ dào jiā le.","Tôi đến nhà rồi."],[65,"得到",1,"dédào","đắc đáo","đạt được, nhận được","我得到了大家的帮助。","Wǒ dédàole dàjiā de bāngzhù.","Tôi đã nhận được sự giúp đỡ của mọi người."],[66,"地",1,"de","địa","biểu thị từ trước nó là trạng ngữ","他高兴地笑了。","Tā gāoxìng de xiào le.","Anh ấy cười một cách vui vẻ."],[67,"的",1,"de","đích","(biểu thị sự sở hữu) của","这是 my 电脑。","Zhè shì wǒ de diànnǎo.","Đây là máy tính của tôi."],[68,"等",1,"děng","đẳng","đợi, chờ","请等我一下。","Qǐng děng wǒ yíxià.","Xin hãy đợi tôi một lát."],[69,"地",1,"dì","địa","đất, lục địa; trái đất","地上有水。","Dìshàng yǒu shuǐ.","Trên mặt đất có nước."],[70,"地点",1,"dìdiǎn","địa điểm","địa điểm, nơi chốn","开会的地点在哪里？","Kāihuì de dìdiǎn zài nǎlǐ?","Địa điểm họp ở nơi nào thế?"],[71,"地方",1,"dìfang","địa phương","nơi, địa phương","这是什么地方？","Zhè shì shénme dìfang?","Đây là nơi nào?"],[72,"地上",1,"dìshang","địa thượng","trên mặt đất","别坐在地上。","Bié zuò zài dìshang.","Đừng ngồi trên mặt đất."],[73,"地图",1,"dìtú","địa đồ","bản đồ","中国地图在墙上。","Zhōngguó dìtú zài qiáng shàng.","Bản đồ Trung Quốc ở trên tường."],[74,"弟弟",1,"dìdi","đệ đệ","em trai","我弟 g tôi tiếng Trung."],[176,"叫",1,"jiào","khiếu","gọi, tên là","你叫什么名字？","Nǐ jiào shénme míngzi?","Bạn tên là gì?"],[177,"教学楼",1,"jiàoxuélóu","giáo học lâu","khu nhà dạy học, tòa nhà học đường","教学楼在学校大门的北边。","Jiàoxuélóu zài xuéxiào dàmén de běibiān.","Tòa nhà học đường nằm ở phía bắc cổng lớn của trường."],[178,"姐姐",1,"jiějie","tỷ tỷ","chị gái","我姐姐是一个医生。","Wǒ jiějie shì yí gè yīshēng.","Chị gái tôi là một bác sĩ."],[179,"介绍",1,"jièshào","giới thiệu","giới thiệu","我来介绍一下，这是王老师。","Wǒ lái jièshào yíxià, zhè shì Wáng lǎoshī.","Tôi xin giới thiệu một chút, đây là thầy Vương."],[180,"今年",1,"jīnnián","kim niên","năm nay","我今年二十岁了。","Wǒ jīnnián èrshí suì le.","Năm nay tôi hai mươi tuổi rồi."],[181,"今天",1,"jīntiān","kim thiên","ngày hôm nay","今天星期日。","Jīntiān xīngqīrì.","Hôm nay là chủ nhật."],[182,"进",1,"jìn","tiến","vào","请进，请坐。","Qǐng jìn, qǐng zuò.","Mời vào, mời ngồi."],[183,"进来",1,"jìnlái","tiến lai","bước vào (lại gần)","你在门外干什么？快进来吧。","Nǐ zài mén wài gàn shénme? Kuài jìnlái ba.","Bạn làm gì ngoài cửa thế? Mau vào đi thôi."],[184,"进去",1,"jìnqù","tiến khứ","bước vào (ra xa)","老师在房间里，我们进去吧。","Lǎoshī zài fángjiān lǐ, wǒmen jìnqù ba.","Thầy giáo ở trong phòng, chúng mình đi vào đi."],[185,"九",1,"jiǔ","cửu","số 9","家里有九个苹果。","Jiālǐ yǒu jiǔ gè píngguǒ.","Trong nhà có chín quả táo."],[186,"就",1,"jiù","tựu","đã; lập tức, ngay, chính là","他就是我们的汉字老师。","Tā jiùshì wǒmen de Hànzì lǎoshī.","Anh ấy chính là thầy giáo dạy chữ Hán của chúng tôi."],[187,"觉得",1,"juéde","giác đắc","cảm thấy, cho rằng","你觉得汉语难吗？","Nǐ juéde Hànyǔ nán ma?","Bạn cảm thấy tiếng Trung có khó không?"],[188,"开",1,"kāi","khai","mở, lái (xe)","请开门。","Qǐng kāi mén.","Xin hãy mở cửa."],[189,"开车",1,"kāi chē","khai xa","lái xe","我爸爸每天开车去工作。","Wǒ bàba měitiān kāichē qù gōngzuò.","Bố tôi lái xe đi làm mỗi ngày."],[190,"开会",1,"kāi huì","khai hội","mở họp, họp","老师们正在开会。","Lǎoshīmen zhèngzài kāihuì.","Các thầy cô giáo đang họp."],[191,"开玩笑",1,"kāi wánxiào","khai ngoạn tiếu","nói đùa","别生气，我是在开玩笑。","Bié shēngqì, wǒ shì zài kāi wánxiào.","Đừng giận mà, tôi chỉ đang nói đùa thôi."],[192,"看",1,"kàn","khán","nhìn, xem, ngắm, đọc (bằng mắt)","我喜欢看中国电影。","Wǒ xǐhuān kàn Zhōngguó diànyǐng.","Tôi thích xem phim Trung Quốc."],[193,"看病",1,"kàn bìng","khán bệnh","khám bệnh, đi khám bác sĩ","他身体不好，去医院看病了。","Tā shēntǐ bù hǎo, qù yīyuàn kànbìng le.","Sức khỏe anh ấy không tốt, đã đi bệnh viện khám bệnh rồi."],[194,"看到",1,"kàndào","khán đáo","nhìn thấy","我今天在学校看到他了。","Wǒ jīntiān zài xuéxiào kàndào tā le.","Hôm nay tôi nhìn thấy anh ấy ở trường rồi."],[195,"看见",1,"kànjiàn","khán kiến","nhìn thấy","你看见我的车票了吗？","Nǐ kànjiàn wǒ de chēpiào le ma?","Bạn có nhìn thấy vé xe của tôi không?"],[196,"考",1,"kǎo","khảo","thi, kiểm tra","我们下个星期考汉语。","Wǒmen xià gè xīngqī kǎo Hànyǔ.","Tuần sau chúng tôi thi tiếng Trung."],[197,"考试",1,"kǎoshì","khảo thí","kì thi, kiểm tra","明天的考试不难。","Míngtiān de kǎoshì bù nán.","Kỳ thi ngày mai không khó."],[198,"渴",1,"kě","khát","khát","我很渴，想喝杯茶。","Wǒ hěn kě, xiǎng hē bēi chá.","Tôi rất khát, muốn uống một cốc trà."],[199,"课",1,"kè","khóa","tiết học, bài học","今天上午我们有三节课。","Jīntiān shàngwǔ wǒmen yǒu sān jié kè.","Sáng nay chúng tôi có ba tiết học."],[200,"课本",1,"kèběn","khóa bản","sách giáo khoa","请把课本打开。","Qǐng bǎ kèběn dǎkāi.","Xin vui lòng mở sách giáo khoa ra."],[201,"课文",1,"kèwén","khóa văn","bài khóa, bài đọc","我们要读今天的课文。","Wǒmen yào dú jīntiān de kèwén.","Chúng ta phải đọc bài khóa của ngày hôm nay."],[202,"口",1,"kǒu","khẩu","miệng, lượng từ chỉ thành viên gia đình","我家有四口人。","Wǒ jiā yǒu sì kǒu rén.","Nhà tôi có bốn người."],[203,"块",1,"kuài","khối","tệ (đơn vị tiền), miếng, cục","这件衣服五十块钱。","Zhè jiàn yīfu wǔshí kuài qián.","Bộ quần áo này giá năm mươi tệ."],[204,"快",1,"kuài","khoái","nhanh","他跑得很快。","Tā pǎo de hěn kuài.","Anh ấy chạy rất nhanh."],[205,"来",1,"lái","lai","đến, tới","他是从中国来的。","Tā shì cóng Zhōngguó lái de.","Anh ấy đến từ Trung Quốc."],[206,"来到",1,"láidào","lai đáo","đến, đặt chân tới","欢迎来到越南。","Huānyíng láidào Yuènán.","Chào mừng bạn đặt chân đến Việt Nam."],[207,"老",1,"lǎo","lão","già, cũ, cổ","这个手机太老了。","Zhè gè shǒujī tài lǎo le.","Chiếc điện thoại này cũ quá rồi."],[208,"老人",1,"lǎorén","lão nhân","người già","我们在马路上要帮助老人。","Wǒmen zài mǎlù shàng yào bāngzhù lǎorén.","Chúng ta phải giúp đỡ người già khi ở trên đường cái."],[209,"老师",1,"lǎoshī","lão sư","thầy, cô giáo","他是我们的汉语老师。","Tā shì wǒmen de Hànyǔ lǎoshī.","Thầy ấy là giáo viên tiếng Trung của chúng tôi."],[210,"了",1,"le","liễu","trợ từ biểu thị sự thay đổi hoặc đã hoàn thành","下雨了，我们别出去。","Xiàyǔ le, wǒmen bié chūqù.","Mưa rồi, chúng mình đừng ra ngoài."],[211,"累",1,"lèi","lụy","mệt mỏi","工作了一天，他很累。","Gōngzuòle yì tiān, tā hěn lèi.","Làm việc cả ngày, anh ấy rất mệt."],[212,"冷",1,"lěng","lãnh","lạnh","今天太冷了。","Jīntiān tài lěng le.","Hôm nay lạnh quá rồi."],[213,"里",1,"lǐ","lý","trong, bên trong","书包里有很多书。","Shūbāo lǐ yǒu hěn duō shū.","Trong cặp sách có rất nhiều sách."],[214,"里边",1,"lǐbian","lý biên","phía trong, bên trong","房间里边没有人。","Fángjiān lǐbian méiyǒu rén.","Bên trong phòng không có ai."],[215,"两",1,"liǎng","lưỡng","hai (dùng trước lượng từ)","我有两个哥哥。","Wǒ yǒu liǎng gè gēge.","Tôi có hai người anh trai."],[216,"零",1,"líng","linh","số 0","这个房间号是二零一。","Zhè gè fángjiānhào shì èr líng yī.","Số phòng này là hai không một (201)."],[217,"六",1,"liù","lục","số 6","一个星期有六天去学校。","Yí gè xīngqī yǒu liù tiān qù xuéxiào.","Một tuần có sáu ngày phải đến trường."],[218,"楼",1,"lóu","lâu","tầng, lầu, tòa nhà","我家在三楼。","Wǒ jiā zài sān lóu.","Nhà tôi ở tầng ba."],[219,"楼上",1,"lóu shàng","lâu thượng","tầng trên, gác trên","哥哥在楼上睡觉呢。","Gēge zài lóu shàng shuìjiào ne.","Anh trai đang ngủ ở trên lầu kìa."],[220,"楼下",1,"lóu xià","lâu hạ","tầng dưới, nhà dưới","楼下有很多车。","Lóu xià yǒu hěn duō chē.","Dưới lầu có rất nhiều xe cộ."],[221,"路",1,"lù","lộ","đường sá, tuyến đường","我去学校的路不远。","Wǒ qù xuéxiào de lù bù yuǎn.","Con đường tôi đến trường không xa lắm."],[222,"路口",1,"lùkǒu","lộ khẩu","giao lộ, ngã ba, ngã tư","请在前面的路口停一下。","Qǐng zài qiánmian de lùkǒu tíng yíxià.","Xin hãy dừng lại một chút ở giao lộ phía trước."],[223,"路上",1,"lùshang","lộ thượng","trên đường","我在来学校的路上。","Wǒ zài lái xuéxiào de lùshang.","Tôi đang trên đường đến trường học."],[224,"妈妈",1,"māma","ma ma","mẹ","我阿妈是一个医生。","Wǒ māma shì yí gè yīshēng.","Mẹ tôi là một bác sĩ."],[225,"马路",1,"mǎlù","mã lộ","đường cái, đường quốc lộ","马路上有很多公共汽车。","Mǎlù shàng yǒu hěn duō gōnggòng qìchē.","Trên đường cái có rất nhiều xe buýt."],[226,"马上",1,"mǎshàng","mã thượng","lập tức, ngay","你等我一下，我马上到。","Nǐ děng wǒ yíxià, wǒ mǎshàng dào.","Bạn đợi tôi một lát, tôi đến ngay đây."],[227,"吗",1,"ma","ma","không (trợ từ để hỏi)","你是大学一年级的学生吗？","Nǐ shì dàxué yī niánjí de xuéshēng ma?","Bạn có phải là sinh viên đại học năm nhất không?"],[228,"买",1,"mǎi","mãi","mua","我想买一本新书。","Wǒ xiǎng mǎi yì běn xīn shū.","Tôi muốn mua một cuốn sách mới."],[229,"慢",1,"màn","mạn","chậm, từ từ","请说得慢一点。","Qǐng shuō de màn yì diǎn.","Xin hãy nói chậm lại một chút."],[230,"忙",1,"máng","mang","bận, bận rộn","你今天忙不忙？","Nǐ jīntiān máng bù máng?","Hôm nay bạn có bận không?"],[231,"毛",1,"máo","mao","hào (đơn vị tiền tệ, bằng 1/10 tệ)","这个苹果三块五毛钱。","Zhè gè píngguǒ sān kuài wǔ máo qián.","Quả táo này giá ba tệ năm hào."],[232,"没",1,"méi","một","không, chưa có","我今天没去上课。","Wǒ jīntiān méi qù shàngkè.","Hôm nay tôi không đi học."],[233,"没关系",1,"méi guānxi","một quan hệ","không sao, không có gì","对不起！- 没关系！","Duìbuqǐ! - Méi guānxi!","Xin lỗi! - Không sao đâu!"],[234,"没什么",1,"méi shénme","một thập ma","không có gì, không sao","别担心，这件事没什么大问题。","Bié dānxīn, zhè jiàn shì méi shénme dà wèntí.","Đừng lo lắng, chuyện này không có vấn đề gì lớn đâu."],[235,"没事儿",1,"méi shìr","một sự nhi","không có việc gì, rảnh rỗi","我今天没事儿，我们可以一起去玩。","Wǒ jīntiān méi shìr, wǒmen kěyǐ yìqǐ qù wán.","Hôm nay tôi không có việc gì bận, chúng mình có thể cùng đi chơi."],[236,"没有",1,"méiyǒu","một hữu","không có, chưa","我没有新电脑。","Wǒ méiyǒu xīn diànnǎo.","Tôi không có máy tính mới."],[237,"妹妹",1,"mèimei","muội muội","em gái","我妹妹今年十岁了。","Wǒ mèimei jīnnián shí suì le.","Em gái tôi năm nay mười tuổi rồi."],[238,"门",1,"mén","môn","cửa, cổng, môn học","请帮我开门。","Qǐng bāng wǒ kāi mén.","Xin hãy giúp tôi mở cửa."],[239,"门口",1,"ménkǒu","môn khẩu","cửa, cổng, lối vào","学校门口有很多小商店。","Xuéxiào ménkǒu yǒu hěn duō xiǎo shāngdiàn.","Trước cổng trường có rất nhiều cửa hàng nhỏ."],[240,"门票",1,"ménpiào","môn phiếu","vé vào cửa","去这个电影院不要门票。","Qù zhè gè diànyǐngyuàn búyào ménpiào.","Đến rạp chiếu phim này không cần mua vé vào cửa."],[241,"们",1,"men","môn","từ chỉ số nhiều (đi sau đại từ hoặc danh từ chỉ người)","朋友们都来我家玩了。","Péngyoumen dōu lái wǒ jiā wán le.","Các bạn đều đã đến nhà tôi chơi rồi."],[242,"米饭",1,"mǐfàn","mễ phản","cơm","中国人很喜欢吃米饭。","Zhōngguórén hěn xǐhuān chī mǐfàn.","Người Trung Quốc rất thích ăn cơm."],[243,"面包",1,"miànbāo","miến bao","bánh mì","我早饭喜欢吃面包和喝牛奶。","Wǒ zǎofàn xǐhuān chī miànbāo hé hē niúnǎi.","Bữa sáng tôi thích ăn bánh mì và uống sữa bò."],[244,"面条儿",1,"miàntiáor","miến điều nhi","mì sợi","这儿的鸡蛋面条儿很好吃。","Zhèr de jīdàn miàntiáor hěn hǎochī.","Mì sợi trứng gà ở chỗ này ăn rất ngon."],[245,"名字",1,"míngzi","danh tự","tên","请写一下你的名字。","Qǐng xiě yíxià nǐ de míngzi.","Vui lòng viết tên của bạn ra đây."],[246,"明白",1,"míngbai","minh bạch","biết, hiểu, rõ ràng","老师说的话我都明白了。","Lǎoshī shuō de huà wǒ dōu míngbai le.","Lời thầy cô giáo nói tôi đều đã hiểu rõ rồi."],[247,"明年",1,"míngnián","minh niên","năm sau, năm tới","明年我想去中国旅游。","Míngnián wǒ xiǎng qù Zhōngguó lǚyóu.","Năm sau tôi muốn đi Trung Quốc du lịch."],[248,"明天",1,"míngtiān","minh thiên","ngày mai","明天你来我家吃晚饭吧。","Míngtiān nǐ lái wǒ jiā chī wǎnfàn ba.","Ngày mai bạn đến nhà tôi ăn cơm tối nhé."],[249,"拿",1,"ná","nã","lấy, cầm","请帮我拿那本书。","Qǐng bāng wǒ ná nà běn shū.","Xin hãy giúp tôi cầm quyển sách kia."],[250,"哪",1,"nǎ","nả","nào (đại từ nghi vấn)","你是哪国人？","Nǐ shì nǎ guó rén?","Bạn là người nước nào?"],[251,"哪里",1,"nǎlǐ","nả lý","đâu, ở đâu, đâu có (khiêm tốn)","你的学校在哪里？","Nǐ de xuéxiào zài nǎlǐ?","Trường học của bạn ở đâu?"],[252,"哪儿",1,"nǎr","nả nhi","đâu, ở đâu","你想去哪儿买东西？","Nǐ xiǎng qù nǎr mǎi dōngxi?","Bạn muốn đi đâu mua đồ vậy?"],[253,"哪些",1,"nǎxiē","nả tá","những … nào","这些书里面哪些是你的？","Zhēxiē shū lǐmiàn nǎxiē shì nǐ de?","Trong những quyển sách này, những quyển nào là của bạn?"],[254,"那",1,"nà","na","kia, ấy, vậy thì","那个人是我的老师。","Nà gè rén shì wǒ de lǎoshī.","Người kia là thầy giáo của tôi."],[255,"那边",1,"nàbiān","na biên","bên kia, phía bên kia","我们去那边开会吧。","Wǒmen qù nàbiān kāihuì ba.","Chúng mình sang bên kia họp đi."],[256,"那里",1,"nàlǐ","na lý","ở đó, nơi đó","我很喜欢北京，那里很漂亮。","Wǒ hěn xǐhuān Běijīng, nàlǐ hěn piàoliang.","Tôi rất thích Bắc Kinh, nơi đó rất đẹp."],[257,"那儿",1,"nàr","na nhi","ở đó, nơi đó","桌子上有两本书，那儿还有一个包。","Zhuōzi shàng yǒu liǎng běn shū, nàr hái yǒu yí gè bāo.","Trên bàn có hai quyển sách, ở đó còn có một cái túi xách nữa."],[258,"那些",1,"nàxiē","na tá","những … ấy, những cái kia","那些学生都是我的同学。","Nàxiē xuéshēng dōu shì wǒ de tóngxué.","Những học sinh kia đều là bạn học của tôi."],[259,"奶",1,"nǎi","nãi","sữa","你想喝杯热奶吗？","Nǐ xiǎng hē bēi rè nǎi ma?","Bạn có muốn uống một cốc sữa nóng không?"],[260,"奶奶",1,"nǎinai","nãi nãi","bà nội","我奶奶今年七十岁了。","Wǒ nǎinai jīnnián qīshí suì le.","Bà nội tôi năm nay bảy mươi tuổi rồi."],[261,"男",1,"nán","nam","nam (giới tính)","这个学校有很多男学生。","Zhè gè xuéxiào yǒu hěn duō nán xuéshēng.","Trường học này có rất nhiều nam sinh."],[262,"男孩儿",1,"ánháir","nam hài nhi","bạn nhỏ (nam), cậu bé","那个男孩儿是谁的儿子？","Nà gè nánháir shì shéi de érzi?","Cậu bé kia là con trai của ai thế?"],[263,"男朋友",1,"nánpéngyou","nam bằng hữu","bạn trai","她的男朋友是日本人。","Tā de nánpéngyou shì Rìběnrén.","Bạn trai của cô ấy là người Nhật Bản."],[264,"男人",1,"nánrén","nam nhân","đàn ông, con trai","房间里的那个男人是我爸爸。","Fángjiān lǐ de nà gè nánrén shì wǒ bàba.","Người đàn ông trong phòng đó chính là bố tôi."],[265,"男生",1,"nánshēng","nam sinh","nam sinh, học sinh nam","我们班有十二个男生。","Wǒmen bān yǒu shí'èr gè nánshēng.","Lớp của chúng tôi có mười hai học sinh nam."],[266,"南",1,"nán","nam","phía nam","火车站往南走一公里就到了。","Huǒchēzhàn wǎng nán zǒu yì gōnglǐ jiù dào le.","Ga tàu hỏa đi về phía nam một km nữa là đến."],[267,"南边",1,"nánbian","nam biên","phía nam","学校的南边是一条大马路。","Xuéxiào de nánbian shì yì tiáo dà mǎlù.","Phía nam của trường học là một con đường cái lớn."],[268,"难",1,"nán","nan","khó","你觉得汉字难不难？","Nǐ juéde Hànzì nán bù nán?","Bạn thấy chữ Hán có khó hay không?"],[269,"呢",1,"ne","ni","đâu, thế, nhỉ, vậy (trợ từ ngữ khí cuối câu)","我的新电脑呢？","Wǒ de xīn diànnǎo ne?","Máy tính mới của tôi đâu rồi nhỉ?"],[270,"能",1,"néng","năng","có thể","下午你能来我家玩吗？","Xiàwǔ nǐ néng lái wǒ jiā wán ma?","Chiều nay bạn có thể đến nhà tôi chơi không?"],[271,"你",1,"nǐ","nhĩ","bạn, anh, chị (ngôi thứ hai số ít)","你喜欢吃什么中国菜？","Nǐ xǐhuān chī shénme Zhōngguó cài?","Bạn thích ăn món ăn Trung Quốc nào?"],[272,"你们",1,"nǐmen","nhĩ môn","các bạn, các anh, các chị","你们都是高中的学生吗？","Nǐmen dōu shì gāozhōng de xuéshēng ma?","Các bạn đều là học sinh trung học phổ thông phải không?"],[273,"年",1,"nián","niên","năm","他在这个大学学习了四年。","Tā zài zhè gè dàxué xuéxíle sì nián.","Anh ấy đã học ở trường đại học này bốn năm."],[274,"您",1,"nín","nhâm","ngài, ông, bà (thể hiện sự kính trọng)","老师，您请坐。","Lǎoshī, nín qǐng zuò.","Thầy/Cô ơi, xin mời thầy/cô ngồi ạ."],[275,"牛奶",1,"niúnǎi","ngưu nã","sữa bò","杯子里有热牛奶。","Bēizi lǐ yǒu rè niúnǎi.","Trong cốc có sữa bò nóng."],[276,"女",1,"nǚ","nữ","nữ, con gái (giới tính)","我们班有许多女学生。","Wǒmen bān yǒu xǔduō nǚ xuéshēng.","Lớp chúng tôi có rất nhiều học sinh nữ."],[277,"女儿",1,"nǚ'ér","nữ nhi","con gái (mối quan hệ ruột thịt)","王老师有一个漂亮的女儿。","Wáng lǎoshī yǒu yí gè piàoliang de nǚ'ér.","Thầy Vương có một người con gái rất xinh đẹp."],[278,"女孩儿",1,"nǚháir","nữ hài nhi","bạn nhỏ (nữ), cô bé","那个女孩儿很喜欢唱歌。","Nà gè nǚháir hěn xǐhuān chànggē.","Cô bé kia rất thích ca hát."],[279,"女朋友",1,"nǚpéngyou","nữ bằng hữu","bạn gái","我的女朋友是一个大学生。","Wǒ de nǚpéngyou shì yí gè dàxuéshēng.","Bạn gái tôi là một sinh viên đại học."],[280,"女人",1,"nǚrén","nữ nhân","phụ nữ, con gái","门口的那位女人是我的医生。","Ménkǒu de nà wèi nǚrén shì wǒ de yīshēng.","Người phụ nữ ở ngoài cửa chính là bác sĩ của tôi."],[281,"女生",1,"nǚshēng","nữ sinh","nữ sinh, học sinh nữ","这个大学里有很多女生。","Zhè gè dàxué lǐ yǒu hěn duō nǚshēng.","Trong trường đại học này có rất nhiều nữ sinh."],[282,"旁边",1,"pángbiān","bàng biên","bên cạnh","我坐在他的旁边。","Wǒ zuò zài tā de pángbiān.","Tôi ngồi ở bên cạnh anh ấy."],[283,"跑",1,"pǎo","bào","chạy","他们每天早上在路上面跑。","Tāmen měitiān zǎoshàng zài lù shàngmian pǎo.","Họ chạy bộ trên đường mỗi buổi sáng."],[284,"朋友",1,"péngyou","bằng hữu","bạn, bạn bè","我和他是好朋友。","Wǒ hé tā shì hǎo péngyou.","Tôi và cậu ấy là bạn tốt của nhau."],[285,"票",1,"piào","phiếu","vé, phiếu","请把车票给我看一下。","Qǐng bǎ chēpiào gěi wǒ kàn yíxià.","Xin vui lòng cho tôi xem vé xe một lát."],[286,"七",1,"qī","thất","số 7","现在是早上七点钟。","Xiànzài shì zǎoshàng qī diǎn zhōng.","Bây giờ là bảy giờ đúng buổi sáng."],[287,"起",1,"qǐ","khởi","dậy, nâng lên, bắt đầu","请大家站起来。","Qǐng dàjiā zhàn qǐlái.","Mời mọi người đứng dậy."],[288,"起床",1,"qǐ chuáng","khởi sàng","thức dậy, ngủ dậy","我每天早上六点起床。","Wǒ měitiān zǎoshàng liù diǎn qǐchuáng.","Tôi thức dậy vào lúc sáu giờ mỗi sáng."],[289,"起来",1,"qǐlái","khởi lai","ngồi dậy, đứng dậy, thức dậy","你快起来吧，我们要去上课了。","Nǐ kuài qǐlái ba, wǒmen yào qù shàngkè le.","Bạn mau dậy đi thôi, chúng mình phải đi lên lớp rồi."],[290,"汽车",1,"qìchē","khí xa","ô tô, xe hơi","学校门口停着很多汽车。","Xuéxiào ménkǒu tíngzhe hěn duō qìchē.","Trước cổng trường đang đỗ rất nhiều xe ô tô."],[291,"前",1,"qián","tiền","trước, phía trước","三天前他在北京学习。","Sān tiān qián tā zài Běijīng xuéxí.","Ba ngày trước anh ấy đang học ở Bắc Kinh."],[292,"前边",1,"qiánbian","tiền biên","phía trước","火车站就在前边。","Huǒchēzhàn jiù zài qiánbian.","Ga tàu hỏa ở ngay phía trước kìa."],[293,"前天",1,"qiántiān","tiền thiên","hôm kia, hôm trước","前天下午没有课，我在家读书。","Qiántiān xiàwǔ méiyǒu kè, wǒ zài jiā dúshū.","Chiều hôm kia không có tiết học, tôi ở nhà đọc sách."],[294,"钱",1,"qián","tiền","tiền","这本书多少钱？","Zhè běn shū duōshao qián?","Cuốn sách này bao nhiêu tiền vậy?"],[295,"钱包",1,"qiánbāo","tiền bao","ví tiền","我的钱包在桌子上。","Wǒ de qiánbāo zài zhuōzi shàng.","Cái ví tiền của tôi ở trên bàn."],[296,"请",1,"qǐng","thỉnh","mời, xin vui lòng","请进，请喝茶。","Qǐng jìn, qǐng hē chá.","Xin mời vào, mời uống trà."],[297,"请假",1,"qǐng jià","thỉnh giả","xin nghỉ phép","他今天生病了，要向老师请假。","Tā jīntiān蓋生病了，yào xiàng lǎoshī qǐngjià.","Hôm nay anh ấy bị bệnh nên phải xin thầy cô nghỉ học."],[298,"请进",1,"qǐng jìn","thỉnh tiến","mời vào","听到有人敲门，老师说：“请进！”","Tīngdào yǒurén qiāo mén, lǎoshī shuō: \"Qǐng jìn!\"","Nghe thấy có người gõ cửa, thầy giáo nói: \"Mời vào!\""],[299,"请问",1,"qǐngwèn","thỉnh vấn","xin hỏi","请问，去火车站怎么走？","Qǐngwèn, qù huǒchēzhàn zěnme zǒu?","Xin hỏi, đường đến ga tàu hỏa đi thế nào ạ?"],[300,"请坐",1,"qǐng zuò","thỉnh tọa","mời ngồi","王老师，请坐这儿。","Wáng lǎoshī, qǐng zuò zhèr.","Thầy Vương ơi, xin mời ngồi ở đây ạ."],[301,"球",1,"qiú","cầu","quả bóng","地上面有一个红色的球。","Dì shàngmian yǒu yí gè hóngsè de qiú.","Trên mặt đất có một quả bóng màu đỏ."],[302,"去",1,"qù","khứ","đi","我想去北京大学读书。","Wǒ xiǎng qù Běijīng Dàxué dúshū.","Tôi muốn đến trường Đại học Bắc Kinh học tập."],[303,"去年",1,"qùnián","khứ niên","năm ngoái, năm vừa rồi","去年八月他在中国旅游。","Qùnián bā yuè tā zài Zhōngguó lǚyóu.","Tháng tám năm ngoái anh ấy đang đi du lịch ở Trung Quốc."],[304,"热",1,"rè","nhiệt","nóng","今天天气非常热。","Jīntiān tiānqì fēicháng rè.","Thời tiết ngày hôm nay vô cùng nóng."],[305,"人",1,"rén","nhân","người","商店里有很多买东西的人。","Shāngdiàn lǐ yǒu hěn duō mǎi dōngxi de rén.","Trong cửa hàng có rất nhiều người mua đồ."],[306,"认识",1,"rènshi","nhận thức","biết, quen biết","认识你我很高兴。","Rènshi nǐ wǒ hěn gāoxìng.","Quen biết bạn tôi rất vui."],[307,"认真",1,"rènzhēn","nhận chân","nghiêm túc, chăm chỉ","同学们都在认真地写汉字。","Tóngxuémen dōu zài rènzhēn de xiě Hànzì.","Các bạn học sinh đều đang chăm chỉ viết chữ Hán."],[308,"日",1,"rì","nhật","ngày, mặt trời","今天是五月十七日。","Jīntiān shì wǔ yuè shíqī rì.","Hôm nay là ngày 17 tháng 5."],[309,"日期",1,"rìqī","nhật kỳ","ngày (xác định), ngày tháng","请在这儿写上今天的日期。","Qǐng zài zhèr xiě shàng jīntiān de rìqī.","Xin vui lòng viết ngày tháng hôm nay vào đây."],[310,"肉",1,"ròu","nhục","thịt","我不喜欢吃牛肉。","Wǒ bù xǐhuān chī niúròu.","Tôi không thích ăn thịt bò."],[311,"三",1,"sān","tam","số 3","家里有三本汉语书。","Jiālǐ yǒu sān běn Hànyǔ shū.","Trong nhà có ba quyển sách tiếng Trung."],[312,"山",1,"shān","sơn","núi","那座山很高、很漂亮。","Nà zuò shān hěn gāo, hěn piàoliang.","Ngọn núi kia rất cao và rất đẹp."],[313,"商场",1,"shāngchǎng","thương trường","trung tâm thương mại, bách hóa lớn","下午我去商场买新衣服。","Xiàwǔ wǒ qù shāngchǎng mǎi xīn yīfu.","Chiều nay tôi đến trung tâm thương mại mua quần áo mới."],[314,"商店",1,"shāngdiàn","thương điếm","tiệm tạp hóa, cửa hàng","这家商店的东西很不贵。","Zhè jiā shāngdiàn de dōngxi bù guì.","Đồ đạc ở cửa hàng này không đắt lắm."],[315,"上",1,"shàng","thượng","trên, lên, phía trên","请把电脑放在桌子上。","Qǐng bǎ diànnǎo fàng zài zhuōzi shàng.","Xin hãy để máy tính ở trên bàn."],[316,"上班",1,"shàng bān","thượng ban","đi làm","爸爸每天早上八点去上班。","Bàba měitiān zǎoshàng bā diǎn qù shàngbān.","Bố đi làm vào lúc tám giờ sáng mỗi ngày."],[317,"上边",1,"shàngbian","thượng biên","bên trên, phía trên","本子上边有一支笔。","Běnzi shàngbian yǒu yì zhī bǐ.","Phía bên trên cuốn vở có một chiếc bút."],[318,"上车",1,"shàng chē","thượng xa","lên xe","公共汽车到了，大家快上车吧。","Gōnggòng qìchē dào le, dàjiā kuài shàngchē ba.","Xe buýt đến rồi, mọi người mau lên xe đi thôi."],[319,"上次",1,"shàngcì","thượng thứ","lần trước","上次考试我做错了一道题。","Shàngcì kǎoshì wǒ zuòcuòle yídào tí.","Kỳ thi lần trước tôi đã làm sai một câu hỏi."],[320,"上课",1,"shàng kè","thượng khóa","vào lớp, đi học, giảng bài","我们要上课了，请别看电视了。","Wǒmen yào shàngkè le, qǐng bié kàn diànshì le.","Chúng mình phải vào lớp học rồi, xin đừng xem tivi nữa."],[321,"上网",1,"shàng wǎng","thượng võng","lên mạng, lướt internet","他常常用电脑上网看电影。","Tā chángcháng yòng diànnǎo shàngwǎng kàn diànyǐng.","Anh ấy thường dùng máy tính lên mạng xem phim."],[322,"上午",1,"shàngwǔ","thượng ngọ","buổi sáng (khoảng 8h - 11h)","今天上午天气很好，不大冷。","Jīntiān shàngwǔ tiānqì hěn hǎo, bú dà lěng.","Sáng nay thời tiết rất tốt, không lạnh lắm."],[323,"上学",1,"shàng xué","thượng học","đi học, đến trường học","我妹妹今年七岁，开始上学了。","Wǒ mèimei jīnnián qī suì, kāishǐ shàngxué le.","Em gái tôi năm nay bảy tuổi, đã bắt đầu đi học rồi."],[324,"少",1,"shǎo","thiểu","ít, thiếu","杯子里的水很少。","Bēizi lǐ de shuǐ hěn shǎo.","Nước ở trong cốc còn rất ít."],[325,"谁",1,"shéi","thùy","ai (đại từ nghi vấn)","请问，那个人是谁？","Qǐngwèn, nà gè rén shì shéi?","Xin hỏi, người kia là ai thế?"],[326,"身上",1,"shēnshang","thân thượng","trên người, trên thân mình","他身上没有钱。","Tā shēnshang méiyǒu qián.","Trên người anh ấy không mang theo tiền."],[327,"身体",1,"shēntǐ","thân thể","cơ thể, sức khỏe","我奶奶的身体很好。","Wǒ nǎinai de shēntǐ hěn hǎo.","Sức khỏe của bà nội tôi rất tốt."],[328,"什么",1,"shénme","thập ma","cái gì, gì","你想喝点什么东西？","Nǐ xiǎng hē diǎn shénme dōngxi?","Bạn muốn uống chút đồ gì không?"],[329,"生病",1,"shēng bìng","sinh bệnh","đổ bệnh, bị ốm","他生病了，下午没去上班。","Tā shēngbìng le, xiàwǔ méi qù shàngbān.","Anh ấy bị ốm rồi, chiều nay không đi làm."],[330,"生气",1,"shēng qì","sinh khí","tức giận, giận dỗi","别生气了，是我不对。","Bié shēngqì le, shì wǒ búduì.","Đừng giận nữa mà, là tôi không đúng."],[331,"生日",1,"shēngrì","sinh nhật","ngày sinh nhật","祝你生日快乐！","Zhù nǐ shēngrì kuàilè!","Chúc bạn sinh nhật vui vẻ!"],[332,"十",1,"shí","thập","số 10","现在是早上十点钟。","Xiànzài shì zǎoshàng shí diǎn zhōng.","Bây giờ là mười giờ đúng buổi sáng."],[333,"时候",1,"shíhou","thời hậu","thời gian, lúc, khi","你什么时候去北京？","Nǐ shénme shíhou qù Běijīng?","Khi nào bạn đi Bắc Kinh vậy?"],[334,"时间",1,"shíjiān","thời gian","thời gian","我没有时间去看电影。","Wǒ méiyǒu shíjiān qù kàn diànyǐng.","Tôi không có thời gian để đi xem phim."],[335,"事",1,"shì","sự","chuyện, việc, công việc","你今天下午有什么事吗？","Nǐ jīntiān xiàwǔ yǒu shénme shì ma?","Chiều nay bạn có việc gì bận không?"],[336,"试",1,"shì","thí","thử, thi cử","这件新衣服我可以试一下吗？","Zhè jiàn xīn yīfu wǒ kěyǐ shì yíxià ma?","Bộ quần áo mới này tôi có thể mặc thử một lát không?"],[337,"是",1,"shì","thị","thì, là, đúng vậy","我是越南人，不是中国人。","Wǒ shì Yuènánrén, bú shì Zhōngguórén.","Tôi là người Việt Nam, không phải người Trung Quốc."],[338,"是不是",1,"shì bú shì","thị bất thị","có phải hay không","你是不是我们学校的学生？","Nǐ shì bú shì wǒmen xuéxiào de xuéshēng?","Bạn có phải là học sinh trường chúng tôi không?"],[339,"手",1,"shǒu","thủ","tay, bàn tay","吃米饭前要洗手。","Chī mǐfàn qián yào xǐshǒu.","Trước khi ăn cơm phải rửa tay."],[340,"手机",1,"shǒujī","thủ cơ","điện thoại di động","我的手机在包里边。","Wǒ de shǒujī zài bāo lǐbian.","Điện thoại di động của tôi ở trong túi xách."],[341,"书",1,"shū","thư","sách","我很喜欢看汉语书。","Wǒ hěn xǐhuān kàn Hànyǔ shū.","Tôi rất thích đọc sách tiếng Trung."],[342,"书包",1,"shūbāo","thư bao","cặp sách","我的书包在哪儿？","Wǒ de shūbāo zài nǎr?","Cặp sách của tôi ở đâu vậy?"],[343,"书店",1,"shūdiàn","thư điếm","cửa hàng sách, tiệm sách","我去学校旁边的书店买书。","Wǒ qù xuéxiào pángbiān de shūdiàn mǎi shū.","Tôi đến tiệm sách bên cạnh trường để mua sách."],[344,"树",1,"shù","thụ","cây","我家门口有一棵大树。","Wǒ jiā ménkǒu yǒu yì kē dà shù.","Trước cửa nhà tôi có một cái cây lớn."],[345,"水",1,"shuǐ","thủy","nước","请给我一杯水，谢谢。","Qǐng gěi wǒ yì bēi shuǐ, xièxie.","Xin cho tôi một cốc nước, cảm ơn."],[346,"水果",1,"shuǐguǒ","thủy quả","trái cây, hoa quả","多吃点水果对身体很好。","Duō chī diǎn shuǐguǒ duì shēntǐ hěn hǎo.","Ăn nhiều hoa quả một chút rất tốt cho cơ thể."],[347,"睡",1,"shuì","thụy","ngủ","太晚了，快去睡吧。","Tài wǎn le, kuài qù shuì ba.","Muộn quá rồi, mau đi ngủ đi thôi."],[348,"睡觉",1,"shuì jiào","thụy giác","ngủ","我每天晚上十一点睡觉。","Wǒ měitiān wǎnshang shíyī diǎn shuìjiào.","Tôi đi ngủ vào lúc mười một giờ mỗi tối."],[349,"说",1,"shuō","thuyết","nói","请听我说，这件事不对。","Qǐng tīng wǒ shuō, zhè jiàn shì búduì.","Xin hãy nghe tôi nói, chuyện này không đúng."],[350,"说话",1,"shuō huà","thuyết thoại","nói, trò chuyện, phát biểu","老师在说话，请大家别看电脑了。","Lǎoshī zài shuōhuà, qǐng dàjiā bié kàn diànnǎo le.","Thầy cô đang nói chuyện, mời mọi người đừng nhìn vào máy tính nữa."],[351,"四",1,"sì","tứ","số 4","一年有四个季节。","Yì nián yǒu sì gè jìjié.","Một năm có bốn mùa."],[352,"送",1,"sòng","tống","tặng, đưa tiễn, giao hàng","我今天去机场送我的朋友。","Wǒ jīntiān qù jīchǎng sòng wǒ de péngyou.","Hôm nay tôi đến sân bay để tiễn bạn của mình."],[353,"岁",1,"suì","tuế","tuổi","他儿子今年三岁了。","Tā érzi jīntián sān suì le.","Con trai anh ấy năm nay ba tuổi rồi."],[354,"他",1,"tā","tha","anh ấy, ông ấy (ngôi thứ ba chỉ nam)","他是我们班的男学生。","Tā shì wǒmen bān de nán xuéshēng.","Cậu ấy là học sinh nam của lớp chúng tôi."],[355,"他们",1,"tāmen","tha môn","các anh ấy, bọn họ (có nam)","ish 问，他们都是哪国人？","Qǐngwèn, tāmen dōu shì nǎ guó rén?","Xin hỏi, họ đều là người nước nào vậy?"],[356,"她",1,"tā","tha","cô ấy, bà ấy (ngôi thứ ba chỉ nữ)","她是我哥哥的女朋友。","Tā shì wǒ gēge de nǚpéngyou.","Cô ấy là bạn gái của anh trai tôi."],[357,"她们",1,"tāmen","tha môn","các cô ấy, bọn họ (toàn bộ là nữ)","她们班有很多漂亮的女生。","Tămen bān yǒu hěn duō piàoliang de nǚshēng.","Lớp của các cô ấy có rất nhiều nữ sinh xinh đẹp."],[358,"太",1,"tài","thái","quá, lắm","今天天气太热了。","Jīntiān tiānqì tài rè le.","Thời tiết hôm nay nóng quá rồi."],[359,"天",1,"tiān","thiên","trời, ngày","他在北京住了五天。","Tā zài Běijīng zhùle wǔ tiān.","Anh ấy đã ở Bắc Kinh năm ngày."],[360,"天气",1,"tiānqì","thiên khí","thời tiết","北京冬天的天气很冷。","Běijīng dōngtiān de tiānqì hěn lěng.","Thời tiết mùa đông ở Bắc Kinh rất lạnh."],[361,"听",1,"tīng","thính","nghe","请听我说，不要生气。","Qǐng tīng wǒ shuō, búyào shēngqì.","Xin hãy nghe tôi nói, đừng tức giận."],[362,"听到",1,"tīngdào","thính đáo","nghe thấy","我听到他在房间里唱歌。","Wǒ tīngdào tā zài fángjiān lǐ chànggē.","Tôi nghe thấy anh ấy đang hát ở trong phòng."],[363,"听见",1,"tīngjiàn","thính kiến","nghe thấy","你听见老师说的话了吗？","Nǐ tīngjiàn lǎoshī shuō de huà le ma?","Bạn có nghe thấy lời thầy cô giáo nói không?"],[364,"听写",1,"tīngxiě","thính tả","nghe viết, chính tả","今天上汉语课我们要听写汉字。","Jīntiān shàng Hànyǔ kè wǒmen yào tīngxiě Hànzì.","Hôm nay trong tiết học tiếng Trung chúng tôi phải nghe viết chữ Hán."],[365,"同学",1,"tóngxué","đồng học","bạn học, bạn cùng trường","他们都是我的大学同学。","Tāmen dōu shì wǒ de dàxué tóngxué.","Họ đều là bạn học đại học của tôi."],[366,"图书馆",1,"túshūguǎn","thư đồ quán","thư viện","下午我想去图书馆看书。","Xiàwǔ wǒ xiǎng qù túshūguǎn kànshū.","Chiều nay tôi muốn đến thư viện đọc sách."],[367,"外",1,"wài","ngoại","ngoài, bên ngoài","有很多人在门外等老师。","Yǒu hěn duō rén zài mén wài děng lǎoshī.","Có rất nhiều người đang ở ngoài cửa đợi thầy giáo."],[368,"外边",1,"wàibian","ngoại biên","bên ngoài, phía ngoài","外边下雨了，多穿点衣服吧。","Wàibian xiàyǔ le, duō chuān diǎn yīfu ba.","Bên ngoài trời mưa rồi, mặc thêm áo vào đi nhé."],[369,"外国",1,"wàiguó","ngoại quốc","nước ngoài","我们班有很多外国学生。","Wǒmen bān yǒu hěn duō wàiguó xuéshēng.","Lớp của chúng tôi có rất nhiều học sinh nước ngoài."],[370,"外语",1,"wàiyǔ","ngoại ngữ","tiếng nước ngoài, ngoại ngữ","在大学里，我们要学一门外语。","Zài dàxué lǐ, wǒmen yào xué yì mén wàiyǔ.","Ở trường đại học, chúng tôi phải học một môn ngoại ngữ."],[371,"玩儿",1,"wánr","ngoạn nhi","chơi, vui chơi","星期日你想去哪儿玩儿？","Xīngqīrì nǐ xiǎng qù nǎr wánr？","Chủ nhật bạn muốn đi đâu chơi thế?"],[372,"晚",1,"wǎn","vãn","buổi tối, muộn","对不起，我今天来晚了。","Duìbuqǐ, wǒ jīntiān lái wǎn le.","Xin lỗi, hôm nay tôi đến muộn mất rồi."],[373,"晚饭",1,"wǎnfàn","vãn phản","cơm tối, bữa tối","我们一起去吃晚饭吧。","Wǒmen yìqǐ qù chī wǎnfàn ba.","Chúng mình cùng nhau đi ăn cơm tối đi."],[374,"晚上",1,"wǎnshang","vãn thượng","buổi tối","今天晚上没有课。","Jīntiān wǎnshang méiyǒu kè.","Tối ngày hôm nay không có tiết học."],[375,"网上",1,"wǎngshang","võng thượng","trên mạng, trực tuyến","我喜欢在网上买衣服。","Wǒ xǐhuān zài wǎngshang mǎi yīfu.","Tôi thích mua quần áo ở trên mạng."],[376,"网友",1,"wǎngyǒu","võng hữu","bạn trên mạng, bạn qua mạng","他是我的中国网友。","Tā shì wǒ de Zhōngguó wǎngyǒu.","Cậu ấy là người bạn mạng Trung Quốc của tôi."],[377,"忘",1,"wàng","vong","quên","我忘了他的名字了。","Wǒ wàngle tā de míngzi le.","Tôi quên mất tên của anh ấy rồi."],[378,"忘记",1,"wàngjì","vong ký","quên, quên mất","请别忘记明天的考试。","Qǐng bié wàngjì míngtiān de kǎoshì.","Xin đừng quên kỳ thi ngày mai nhé."],[379,"问",1,"wèn","vấn","hỏi","我想问老师一个问题。","Wǒ xiǎng wèn lǎoshī yí gè wèntí.","Tôi muốn hỏi thầy cô giáo một câu hỏi."],[380,"我",1,"wǒ","ngã","tôi, tớ, mình (ngôi thứ nhất số ít)","我是大学一年级的学生。","Wǒ shì dàxué yī niánjí de xuéshēng.","Tôi là sinh viên đại học năm thứ nhất."],[381,"我们",1,"wǒmen","ngã môn","chúng tôi, chúng ta","我们都是越南人。","Wǒmen dōu正式 Yuènánrén.","Chúng tôi đều là người Việt Nam."],[382,"五",1,"wǔ","ngũ","số 5","家里有五个红苹果。","Jiālǐ yǒu wǔ gè hóng píngguǒ.","Trong nhà có năm quả táo màu đỏ."],[383,"午饭",1,"wǔfàn","ngọ phản","bữa trưa, cơm trưa","中午十二点我们吃午饭。","Zhōngwǔ shí'èr diǎn wǒmen chī wǔfàn.","Mười hai giờ trưa chúng tôi ăn cơm trưa."],[384,"西",1,"xī","tây","phía tây","太阳从西边落下。","Tàiyáng cóng xībian luòxià.","Mặt trời lặn ở phía tây."],[385,"西边",1,"xībian","tây biên","phía tây","学校西边有一家大饭店。","Xuéxiào xībian yǒu yì jiā dà fàndiàn.","Phía tây trường học có một nhà hàng lớn."],[386,"洗",1,"xǐ","tẩy","rửa, giặt, tắm","吃饭以前要洗手。","Chīfàn yǐqián yào xǐshǒu.","Trước khi ăn cơm phải rửa tay."],[387,"洗手间",1,"xǐshǒujiān","tẩy thủ gian","nhà vệ sinh, phòng vệ sinh","请问，洗手间在哪里？","Qǐngwèn, xǐshǒujiān zài nǎlǐ？","Xin hỏi, nhà vệ sinh ở đâu thế ạ?"],[388,"喜欢",1,"xǐhuan","hỷ hoan","thích, yêu thích","我很喜欢学汉语。","Wǒ hěn xǐhuān xué Hànyǔ.","Tôi rất thích học tiếng Trung."],[389,"下",1,"xià","hạ","xuống, dưới, bên dưới","请看桌子下面，有你的包。","Qǐng kàn zhuōzi xiàmian, yǒu nǐ de bāo.","Xin hãy nhìn xuống dưới bàn, có cái túi của bạn kìa."],[390,"下班",1,"xià bān","hạ ban","tan làm, hết giờ làm","爸爸下午五点下班回家。","Bàba xiàwǔ wǔ diǎn xiàbān huí jiā.","Bố tan làm về nhà vào lúc năm giờ chiều."],[391,"下边",1,"xiàbian","hạ biên","bên dưới, phía dưới","床下边有一本书。","Chuáng xiàbian yǒu yì běn shū.","Phía bên dưới giường có một quyển sách."],[392,"下车",1,"xià chē","hạ xa","xuống xe","火车站到了，我们下车吧。","Huǒchēzhàn dào le, wǒmen xiàchē ba.","Ga tàu hỏa đến rồi, chúng mình xuống xe thôi."],[393,"下次",1,"xiàcì","hạ thứ","lần sau, lần kế tiếp","下次考试你要更认真点。","Xiàcì kǎoshì nǐ yào gèng rènzhēn diǎn.","Kỳ thi lần sau bạn phải chăm chỉ hơn chút nữa nhé."],[394,"下课",1,"xià kè","hạ khóa","tan học, hết giờ học","十点半了，我们下课吧。","Shí diǎn bàn le, wǒmen xiàkè ba.","Mười giờ rưỡi rồi, chúng ta tan học thôi."],[395,"下午",1,"xiàwǔ","hạ ngọ","buổi chiều (khoảng 13h - 17h)","今天下午我们没有汉语课。","Jīntiān xiàwǔ wǒmen méiyǒu Hànyǔ kè.","Chiều ngày hôm nay chúng tôi không có tiết tiếng Trung."],[396,"下雨",1,"xià yǔ","hạ vũ","đổ mưa, trời mưa","外面下雨了，你带伞了吗？","Wàimiàn xiàyǔ le, nǐ dài sǎn le ma?","Bên ngoài trời mưa rồi, bạn có mang theo ô không?"],[397,"先",1,"xiān","tiên","trước, đầu tiên","我们先去吃饭，然后再来看书。","Wǒmen xiān qù chīfàn, ránhòu zài lái kànshū.","Chúng mình đi ăn cơm trước, sau đó mới quay lại đọc sách."],[398,"先生",1,"xiānsheng","tiên sinh","quý ông, ngài, chồng","王先生是北京大学的老师。","Wáng xiānsheng shì Běijīng Dàxué de lǎoshī.","Ông Vương là giảng viên của trường Đại học Bắc Kinh."],[399,"现在",1,"xiànzài","hiện tại","hiện tại, bây giờ","现在是下午三点半。","Xiànzài shì xiàwǔ sān diǎn bàn.","Bây giờ là ba giờ rưỡi chiều."],[400,"想",1,"xiǎng","tưởng","muán, suy nghĩ, nhớ","我想去中国旅游。","Wǒ xiǎng qù Zhōngguó lǚyóu.","Tôi muốn đi du lịch Trung Quốc."],[401,"小",1,"xiǎo","tiểu","nhỏ, bé","这个苹果太小了。","Zhè gè píngguǒ tài xiǎo le.","Quả táo này nhỏ quá rồi."],[402,"小孩儿",1,"xiǎoháir","tiểu hài nhi","trẻ em, đứa trẻ","那个小孩儿在商场门口等妈妈。","Nà gè xiǎoháir zài shāngchǎng ménkǒu děng māma.","Đứa trẻ kia đang đợi mẹ ở trước cổng trung tâm thương mại."],[403,"小姐",1,"xiǎojiě","tiểu thư","cô, tiểu thư (gọi tôn kính nữ giới trẻ tuổi)","王小姐，您请坐在这儿。","Wáng xiǎojiě, nín qǐng zuò zài zhèr.","Cô Vương ơi, xin mời cô ngồi ở chỗ này ạ."],[404,"小朋友",1,"xiǎopéngyǒu","tiểu bằng hữu","trẻ em, bạn nhỏ","小朋友，你叫什么名字？","Xiǎopéngyǒu, nǐ jiào shénme míngzi?","Bạn nhỏ ơi, em tên là gì thế?"],[405,"小时",1,"xiǎoshí","tiểu thời","tiếng đồng hồ, giờ đồng hồ","他每天晚上学两个小时的汉语。","Tā měitiān wǎnshang xué liǎng gè xiǎoshí de Hànyǔ.","Mỗi tối cậu ấy đều học tiếng Trung hai tiếng đồng hồ."],[406,"小学",1,"xiǎoxué","tiểu học","trường tiểu học, bậc tiểu học","我家 đằng sau 有 một 所小学。","Wǒ jiā hòubian yǒu yì suǒ xiǎoxué.","Phía sau nhà tôi có một ngôi trường tiểu học."],[407,"小学生",1,"xiǎoxuéshēng","tiểu học sinh","học sinh tiểu học","我妹妹是一个小学一年级的学生。","Wǒ mèimei shì yí gè xiǎoxué yī niánjí de xuéshēng.","Em gái tôi là một học sinh tiểu học năm thứ nhất."],[408,"笑",1,"xiào","tiếu","cười","听到这句话，他高兴地笑了。","Tīngdào zhè jù huà, tā gāoxìng de xiào le.","Nghe thấy câu nói này, anh ấy đã cười một cách vui vẻ."],[409,"写",1,"xiě","tả","viết","请在纸上写你的名字。","Qǐng zài zhǐ shàng xiě nǐ de míngzi.","Vui lòng viết tên của bạn lên tờ giấy."],[410,"谢谢",1,"xièxie","tạ tạ","cảm ơn","谢谢你的新电脑。- 不客气！","Xièxie nǐ de xīn diànnǎo. - Bú kèqi!","Cảm ơn chiếc máy tính mới của bạn. - Không có gì!"],[411,"新",1,"xīn","tân","mới","他买了一个新电脑。","Tā mǎile yí gè xīn diànnǎo.","Anh ấy đã mua một chiếc máy tính mới rồi."],[412,"新年",1,"xīnnián","tân niên","năm mới","祝大家新年快乐！","Zhù dàjiā xīnnián kuàilè!","Chúc mọi người năm mới vui vẻ!"],[413,"星期",1,"xīngqī","tinh kỳ","tuần, thứ","一个星期有七天。","Yí gè xīngqī yǒu qī tiān.","Một tuần có bảy ngày."],[414,"星期日",1,"xīngqīrì","tinh kỳ nhật","chủ nhật","星期日我们不用去学校上课。","Xīngqīrì wǒmen búyòng qù xuéxiào shàngkè.","Chủ nhật chúng tôi không cần đến trường lên lớp."],[415,"星期天",1,"xīngqītiān","tinh kỳ thiên","chủ nhật","星期天我想和朋友一起去买东西。","Xīngqītiān wǒ xiǎng gēn péngyou yìqǐ qù mǎi dōngxi.","Chủ nhật tôi muốn cùng bạn đi mua đồ đạc."],[416,"行",1,"xíng","hành","được, ổn","明天下午去打球，行吗？","Míngtiān xiàwǔ qù dǎqiú, xíng ma?","Chiều mai đi chơi bóng, được không?"],[417,"休息",1,"xiūxi","hưu tức","nghỉ ngơi","工作累了，请大家休息一下吧。","Gōngzuò lèi le, qǐng dàjiā xiūxi yíxià ba.","Làm việc mệt rồi, mời mọi người nghỉ ngơi một lát đi."],[418,"学",1,"xué","học","học, học tập","我想学说汉语。","Wǒ xiǎng xué shuō Hànyǔ.","Tôi muốn học nói tiếng Trung."],[419,"学生",1,"xuéshēng","học sinh","học sinh, sinh viên","他是北京大学的学生。","Tā shì Běijīng Dàxué de xuéshēng.","Anh ấy là sinh viên của trường Đại học Bắc Kinh."],[420,"学习",1,"xuéxí","học tập","học tập, học","我们在学校里认真地学习。","Wǒmen zài xuéxiào lǐ rènzhēn de xuéxí.","Chúng tôi học tập một cách chăm chỉ ở trường."],[421,"学校",1,"xuéxiào","học hiệu","trường học","我们的学校很大、很漂亮。","Wǒmen de xuéxiào hěn dà, hěn piàoliang.","Trường học của chúng tôi rất lớn và rất đẹp."],[422,"学院",1,"xuéyuàn","học viện","học viện, trường đại học nhỏ","他在一所外国语学院学习。","Tā zài yì suǒ wàiguóyǔ xuéyuàn xuéxí.","Anh ấy đang học tại một học viện ngoại ngữ."],[423,"要",1,"yào","yếu","muốn, cần, phải","今天下午我要去商店买衣服。","Jīntiān xiàwǔ wǒ yào qù shāngdiàn mǎi yīfu.","Chiều nay tôi phải đi cửa hàng mua quần áo."],[424,"爷爷",1,"yéye","gia gia","ông nội","我爷爷今年八十岁了。","Wǒ yéye jīnnián bāshí suì le.","Ông nội tôi năm nay tám mươi tuổi rồi."],[425,"也",1,"yě","dã","cũng","他是大学生，我也是大学生。","Tā shì dàxuéshēng, wǒ yě shì dàxuéshēng.","Anh ấy là sinh viên, tôi cũng là sinh viên."],[426,"页",1,"yè","diệp","trang (sách, vở)","请大家打开书到第十页。","Qǐng dàjiā dǎkāi shū dào dì shí yè.","Mời mọi người mở sách ra trang thứ mười."],[427,"一",1,"yī","nhất","số 1, một","这里有一本新书。","Zhèlǐ yǒu yì běn xīn shū.","Ở đây có một cuốn sách mới."],[428,"衣服",1,"yīfu","y phục","quần áo","这条马路旁边有许多买衣服的店。","Zhè tiáo mǎlù pángbiān yǒu xǔduō mǎi yīfu de diàn.","Bên cạnh con đường cái này có rất nhiều cửa hàng bán quần áo."],[429,"医生",1,"yīshēng","y sinh","bác sĩ","我妈妈在医院里当医生。","Wǒ māma zài yīyuàn lǐ dāng yīshēng.","Mẹ tôi làm bác sĩ ở trong bệnh viện."],[430,"医院",1,"yīyuàn","y viện","bệnh viện","这家医院有很多好医生。","Zhè jiā yīyuàn yǒu hěn duō hǎo yīshēng.","Bệnh viện này có rất nhiều bác sĩ giỏi."],[431,"一半",1,"yíbàn","nhất bán","một nửa","这个大苹果我吃了一半。","Zhè gè dà píngguǒ wǒ chīle yíbàn.","Quả táo lớn này tôi đã ăn một nửa rồi."],[432,"一会儿",1,"yíhuìr","nhất hội nhi","một chốc, một lát, một tí","请等我一会儿，我马上来。","Qǐng děng wǒ yíhuìr, wǒ mǎshàng lái.","Xin hãy đợi tôi một lát, tôi tới liền đây."],[433,"一块儿",1,"yíkuàir","nhất khối nhi","cùng nơi, cùng chỗ, cùng nhau","明天下午我们一块儿去商店买东西吧。","Míngtiān xiàwǔ wǒmen yíkuàir qù shāngdiàn mǎi dōngxi ba.","Chiều mai chúng mình cùng nhau đi cửa hàng mua đồ đi."],[434,"一下儿",1,"yíxiàr","nhất hạ nhi","một lát, một lúc, thử xem","请你看一下，这个对不对？","Qǐng nǐ kàn yíxià, zhè gè duì bú duì?","Xin mời bạn xem một lát, cái này có đúng không?"],[435,"一样",1,"yíyàng","nhất dạng","giống nhau, như nhau","我的新手机和他的手机一样。","Wǒ de xīn shǒujī hé tā de shǒujī yíyàng.","Điện thoại mới của tôi giống hệt điện thoại của anh ấy."],[436,"一边",1,"yìbiān","nhất biên","một bên, một mặt, vừa… vừa…","他喜欢一边听歌一边写字。","Tā xǐhuān yìbiān tīng gē yìbiān xiězì.","Cậu ấy thích vừa nghe nhạc vừa viết chữ."],[437,"一点儿",1,"yìdiǎnr","nhất điểm nhi","một chút, một ít, hơi hơi","我想喝一点儿热开水。","Wǒ xiǎng hē yìdiǎnr rè kāishuǐ.","Tôi muốn uống một chút nước sôi nóng."],[438,"一起",1,"yìqǐ","nhất khởi","cùng nhau, cùng một chỗ","下午我们一起去图书馆看书吧。","Xiàwǔ wǒmen yìqǐ qù túshūguǎn kànshū ba.","Chiều nay chúng mình cùng nhau đến thư viện đọc sách đi."],[439,"一些",1,"yìxiē","nhất tá","một ít, một vài, một số","桌子上面有一些红色的苹果。","Zhuōzi shàngmian yǒu yìxiē hóngsè de píngguǒ.","Ở trên bàn có một vài quả táo màu đỏ."],[440,"用",1,"yòng","dụng","dùng, sử dụng","我可以借用一下你的新电脑吗？","Wǒ kěyǐ jièyòng yíxià nǐ de xīn diànnǎo ma?","Tôi có thể mượn dùng máy tính mới của bạn một lát không?"],[441,"有",1,"yǒu","hữu","có","我家有一只很可爱的小狗。","Wǒ jiā yǒu yì zhī hěn kě'ài de xiǎogǒu.","Nhà tôi có một chú chó nhỏ rất đáng yêu."],[442,"有的",1,"yǒude","hữu đích","có cái, có một số, có người","学校里的学生，有的是外国学生。","Xuéxiào lǐ de xuéshēng, yǒude shì wài guó xuéshēng.","Học sinh trong trường, có một số là du học sinh nước ngoài."],[443,"有名",1,"yǒumíng","hữu danh","nổi tiếng","北京大学是一个非常有名的大学。","Běijīng Dàxué shì yí gè fēicháng yǒumíng de dàxué.","Đại học Bắc Kinh là một trường đại học vô cùng nổi tiếng."],[444,"有时候",1,"yǒushíhou","hữu thời hậu","có lúc, đôi khi","我有时候在家里看电视，不出去玩。","Wǒ yǒushíhou zài jiālǐ kàn diànshì, bù chūqù wán.","Tôi có lúc ở nhà xem tivi, không đi ra ngoài chơi."],[445,"有一些",1,"yǒu yìxiē","hữu nhất tá","có một ít, có một số","今天商场里有一些新衣服很漂亮。","Jīntiān shāngchǎng lǐ yǒu yìxiē xīn yīfu hěn piàoliang.","Hôm nay trong trung tâm thương mại có một ít quần áo mới rất đẹp."],[446,"有用",1,"yǒuyòng","hữu dụng","có ích, có tác dụng, hữu dụng","多学一门外语对工作很有用。","Duō xué yì mén wàiyǔ duì gōngzuò hěn yǒuyòng.","Học thêm một môn ngoại ngữ rất có ích cho công việc."],[447,"右",1,"yòu","hữu","bên phải","请往右边走，火车站就在那儿。","Qǐng wǎng yòubian zǒu, huǒchēzhàn jiù zài nàr.","Xin hãy đi về phía bên phải, ga tàu hỏa ở ngay đó."],[448,"右边",1,"yòubian","hữu biên","phía bên phải","我的右边是一个漂亮的男学生。","Wǒ de yòubian shì yí gè piàoliang de nán xuéshēng.","Phía bên phải của tôi là một nam sinh rất đẹp trai."],[449,"雨",1,"yǔ","vũ","mưa","今天的雨很大，别出去玩了。","Jīntiān de yǔ hěn dà, bié chūqù wán le.","Cơn mưa hôm nay rất lớn, đừng đi ra ngoài chơi nữa."],[450,"元",1,"yuán","nguyên","đồng, nguyên (đơn vị tiền tệ giống 块)","这本书一共三十元钱。","Zhè běn shū yígòng sāanshí yuán qián.","Cuốn sách này tổng cộng có giá ba mươi nguyên."],[451,"远",1,"yuǎn","viễn","xa","我学校离我家不远，很近。","Wǒ xuéxiào lí wǒ jiā bù yuǎn, hěn jìn.","Trường học cách nhà tôi không xa, rất là gần."],[452,"月",1,"yuè","nguyệt","mặt trăng, tháng","一年有十二个月。","Yì nián yǒu shí'èr gè yuè.","Một năm có mười hai tháng."],[453,"再",1,"zài","tái","lại, nữa (hành động chưa xảy ra)","请再说一遍，我没听见。","Qǐng zài shuō yí biàn, wǒ méi tīngjiàn.","Xin hãy nói lại một lần nữa, tôi vừa nãy chưa nghe thấy."],[454,"再见",1,"zàijiàn","tái kiến","hẹn gặp lại, tạm biệt","老师，再见！明天见！","Lǎoshī, zàijiàn! Míngtiān jiàn!","Thầy cô giáo tạm biệt! Hẹn ngày mai gặp lại!"],[455,"在",1,"zài","tại","đang, ở tại","妈妈正在厨房里做饭呢。","Māma zhèngzài chúfáng lǐ zuòfàn ne.","Mẹ đang nấu cơm ở trong nhà bếp kìa."],[456,"在家",1,"zàijiā","tại gia","ở nhà","今天下午他不在家，去学校了。","Jīntiān xiàwǔ tā bú zàijiā, qù xuéxiào le.","Chiều nay cậu ấy không ở nhà, đi đến trường rồi."],[457,"早",1,"zǎo","tảo","sớm, chào buổi sáng","老师您早！今天您身体好吗？","Lǎoshī nín zǎo! Jīntiān nín shēntǐ hǎo ma?","Chào buổi sáng thầy ạ! Hôm nay thầy khỏe không?"],[458,"早饭",1,"zǎofàn","tảo phản","bữa sáng, cơm sáng","我每天早上七点吃早饭。","Wǒ měitiān zǎoshàng qī diǎn chī zǎofàn.","Tôi ăn bữa sáng vào lúc bảy giờ sáng mỗi ngày."],[459,"早上",1,"zǎoshang","tảo thượng","buổi sáng sớm (khoảng 6h - 8h)","早上外面的风很大、很冷。","Zǎoshàng wàimiàn de fēng hěn dà, hěn lěng.","Sáng sớm gió bên ngoài rất to và rất lạnh."],[460,"怎么",1,"zěnme","chẩm ma","làm sao, thế nào, bằng cách nào","请问，去电影院怎么走？","Qǐngwèn, qù diànyǐngyuàn zěnme zǒu?","Xin hỏi, đường đi đến rạp chiếu phim đi thế nào vậy?"],[461,"站",1,"zhàn","trạm","bến, trạm, đứng","我在前面的公共汽车站等你。","Wǒ zài qiánmian de gōnggòng qìchēzhàn děng nǐ.","Tôi đợi bạn ở bến xe buýt phía trước nhé."],[462,"找",1,"zhǎo","tìm","tìm kiếm, thối tiền thừa","你在房间里找什么东西呢？","Nǐ zài fángjiān lǐ zhǎo shénme dōngxi ne?","Bạn đang tìm đồ đạc gì trong phòng thế?"],[463,"找到",1,"zhǎodào","tìm đáo","tìm thấy","我找到我的钱包和手机了。","Wǒ zhǎodàole wǒ de qiánbāo hé shǒujī le.","Tôi tìm thấy ví tiền và điện thoại của mình rồi."],[464,"这",1,"zhè","giá","này, đây","这是我买的新电脑。","Zhè shì wǒ mǎile de xīn diànnǎo.","Đây là chiếc máy tính mới mà tôi đã mua."],[465,"这边",1,"zhèbiān","giá biên","bên này, phía bên này","请大家往这边走，教学楼在那儿。","Qǐng dàjiā wǎng zhèbiān zǒu, jiàoxuélóu zài nàr.","Mời mọi người đi về phía bên này, tòa nhà học đường ở đằng kia."],[466,"这里",1,"zhèlǐ","giá lý","nơi đây, ở đây","这里有很多好玩儿的地方。","Zhèlǐ yǒu hěn duō hǎowánr de dìfang.","Ở đây có rất nhiều địa điểm vui chơi thú vị."],[467,"这儿",1,"zhèr","giá nhi","đây, ở đây","请坐在这儿等我一下下。","Qǐng zuò zài zhèr děng wǒ yíxiàxià.","Xin hãy ngồi ở đây đợi tôi một chút xíu."],[468,"这些",1,"zhèxiē","giá tá","những cái này, những người này","这些书都是我们班学生的。","Zhèxiē shū dōu shì wǒmen bān xuéshēng de.","Những cuốn sách này đều là của học sinh lớp chúng tôi."],[469,"着",1,"zhe","trước","trợ từ biểu thị hành động đang tiếp diễn hoặc trạng thái duy trì","学校门口停着许多汽车。","Xuéxiào ménkǒu tíngzhe xǔduō qìchē.","Trước cổng trường đang đỗ rất nhiều xe ô tô."],[470,"真",1,"zhēn","chân","thật, thật là","今天的天气真好，不冷不热。","Jīntiān de tiānqì zhēn hǎo, bù lěng bú rè.","Thời tiết hôm nay thật là đẹp, không lạnh không nóng."],[471,"真的",1,"zhēnde","chân đích","Thật ư? Thật đó!","他说的话都是真的，你别不信。","Tā shuō de huà dōu shì zhēnde, nǐ bié bú xìn.","Lời anh ấy nói đều là thật đấy, bạn đừng không tin."],[472,"正",1,"zhèng","chánh","khéo, đúng lúc, đang (phó từ)","我正想去商店，我们就一块儿去吧。","Wǒ zhèng xiǎng qù shāngdiàn, wǒmen jiù yíkuàir qù ba.","Tôi đang tính đi cửa hàng đây, chúng mình cùng nhau đi luôn đi."],[473,"正在",1,"zhèngzài","chánh tại","đang (biểu thị hành động tiến hành)","同学们正在教室里认真地学汉语。","Tóngxuémen zhèngzài jiàoshì lǐ rènzhēn de xué Hànyǔ.","Các học sinh đang chăm chỉ học tiếng Trung ở trong lớp học."],[474,"知道",1,"zhīdào","tri đạo","biết, hiểu rõ","你知道老师的手机号是多少吗？","Nǐ zhīdào lǎoshī de shǒujīhào shì duōshao ma？","Bạn có biết số điện thoại di động của thầy cô giáo là bao nhiêu không?"],[475,"知识",1,"zhīshi","tri thức","kiến thức, tri thức","在大学里我们可以学到很多新知识。","Bà dàxué lǐ wǒmen kěyǐ xuédào hěn duō xīn zhīshi.","Ở trường đại học chúng ta có thể học được rất nhiều kiến thức mới."],[476,"中",1,"zhōng","trung","giữa, trong","这几本书中，哪一本是你的？","Zhè jǐ běn shū zhōng, nǎ yì běn shì nǐ de?","Trong vài cuốn sách này, cuốn nào là của bạn thế?"],[477,"中国",1,"Zhōngguó","Trung Quốc","nước Trung Quốc","明年我想去中国北京大学读书。","Míngnián wǒ xiǎng qù Zhōngguó Běijīng Dàxué dúshū.","Năm sau tôi muốn đến trường Đại học Bắc Kinh của Trung Quốc học tập."],[478,"中间",1,"zhōngjiān","trung gian","giữa, ở giữa","我坐在爸爸和妈妈的中间。","Wǒ zuò zài bàba hé māma de zhōngjiān.","Tôi ngồi ở chính giữa bố và mẹ."],[479,"中文",1,"Zhōngwén","Trung văn","tiếng Trung (văn tự)","他在大学学习中文。","Tā zài dàxué xuéxí Zhōngwén.","Anh ấy học tiếng Trung ở trường đại học."],[480,"中午",1,"zhōngwǔ","trung ngọ","buổi trưa (khoảng 11h30 - 13h)","中午十二点我们一起吃午饭吧。","Zhōngwǔ shí'èr diǎn wǒmen yìqǐ chī wǔfàn ba.","Mười hai giờ trưa chúng mình cùng nhau ăn cơm trưa nhé."],[481,"中学",1,"zhōngxué","trung học","trường trung học, cấp trung học","我哥哥在这一所中学当老师。","Wǒ gēge zài zhè yì suǒ zhōngxué dāng lǎoshī.","Anh trai tôi làm giáo viên tại ngôi trường trung học này."],[482,"中学生",1,"zhōngxuéshēng","trung học sinh","học sinh trung học","我们班的学生都是中学生。","Wǒmen bān de xuéshēng dōu shì zhōngxuéshēng.","Học sinh lớp chúng tôi đều là học sinh trung học."],[483,"重",1,"zhòng","trọng","nặng","这个大包非常重，你拿吧。","Zhè gè dà bāo fēicháng zhòng, nǐ ná ba.","Cái túi lớn này vô cùng nặng, bạn cầm đi."],[484,"重要",1,"zhòngyào","trọng yếu","quan trọng","明天的考试非常重要，别忘了。","Míngtiān de kǎoshì fēicháng zhòngyào, bié wàng le.","Kỳ thi ngày mai vô cùng quan trọng, đừng quên nhé."],[485,"住",1,"zhù","trú","ở tại, cư trú","他在北京饭店住了三天。","Tā zài Běijīng Fàndiàn zhùle sān tiān.","Anh ấy đã ở khách sạn Bắc Kinh ba ngày."],[486,"准备",1,"zhǔnbèi","chuẩn bị","chuẩn bị, dự định","明天考试，你准备好了吗？","Míngtiān kǎoshì, nǐ zhǔnbèihǎo le ma？","Ngày mai thi rồi, bạn đã chuẩn bị sẵn sàng chưa?"],[487,"桌子",1,"zhuōzi","trác tử","cái bàn","桌子上面放着一个新电脑。","Zhuōzi shàngmian fàngzhe yí gè xīn diànnǎo.","Trên bàn đang để một chiếc máy tính mới."],[488,"字",1,"zì","tự","chữ, chữ viết, văn tự","他写汉字写得非常认真。","Tā xiě Hànzì xiě de fēicháng rènzhēn.","Cậu ấy viết chữ Hán vô cùng cẩn thận chăm chỉ."],[489,"子",1,"zi","tử","cái (hậu tố đứng sau một số danh từ như 桌子、杯子)","房间里有一张新桌子和两个杯子。","Fángjiān lǐ yǒu yì zhāng xīn zhuōzi hé liǎng gè bēizi.","Trong phòng có một cái bàn mới và hai cái cốc."],[490,"走",1,"zǒu","tẩu","đi, rời đi, di chuyển","太晚了，我们快走吧。","Tài wǎn le, wǒmen kuài zǒu ba.","Muộn quá rồi, chúng mình mau đi thôi."],[491,"走路",1,"zǒu lù","tẩu lộ","đi bộ, đi đường","我每天走路去学校上课。","Wǒ měitiān zǒulù qù xuéxiào shàngkè.","Tôi đi bộ đến trường lên lớp mỗi ngày."],[492,"最",1,"zuì","tối","nhất, số một","我最喜欢吃中国菜。","Wǒ zuì xǐhuān chī Zhōngguó cài.","Tôi thích ăn món ăn Trung Quốc nhất."],[493,"最好",1,"zuìhǎo","tối hảo","tốt nhất, nên","今天外面很冷，你最好多穿点衣服。","Jīntiān wàimiàn hěn lěng, nǐ zuìhǎo duō chuān diǎn yīfu.","Hôm nay bên ngoài rất lạnh, tốt nhất bạn nên mặc nhiều áo vào một chút."],[494,"最后",1,"zuìhòu","tối hậu","cuối cùng, sau cùng","这是我最后一本汉语书。","Zhè shì wǒ zuìhòu yì běn Hànyǔ shū.","Đây là cuốn sách tiếng Trung cuối cùng của tôi."],[495,"昨天",1,"zuótiān","tạc thiên","hôm qua","昨天下午我没去学校。","Zuótiān xiàwǔ wǒ méi qù xuéxiào.","Chiều hôm qua tôi không đến trường."],[496,"左",1,"zuǒ","tả","bên trái","请往左走，书店就在那儿。","Qǐng wǎng zuǒ zǒu, shūdiàn jiù zài nàr.","Xin hãy rẽ trái, hiệu sách ở ngay đó."],[497,"左边",1,"zuǒbian","tả biên","phía bên trái","我的左边是一个外国学生。","Wǒ de zuǒbian shì yí gè wài guó xuéshēng.","Phía bên trái của tôi là một học sinh nước ngoài."],[498,"坐",1,"zuò","tọa","ngồi, đi (bằng phương tiện xe, tàu)","请坐下，喝杯茶吧。","Qǐng zuòxià, hē bēi chá ba.","Mời ngồi xuống uống một cốc trà nhé."],[499,"坐下",1,"zuò xià","tọa hạ","ngồi xuống","同学们，请坐下上课吧。","Tóngxuémen, qǐng zuòxià shàngkè ba.","Các em học sinh, xin mời ngồi xuống để vào bài học nào."],[500,"做",1,"zuò","tố","làm","你喜欢做什么工作？","Nǐ xǐhuān zuò shénme gōngzuò?","Bạn thích làm công việc gì?"],[501,"啊",2,"ā","a","a, chà, à","啊，这里的风景太美了！","Ā, zhèlǐ de fēngjǐng tài měile!","Chà, phong cảnh ở đây đẹp quá!"],[502,"爱情",2,"àiqíng","ái tình","tình yêu","这是一个关于爱情的故事。","Zhè shì yí gè guānyú àiqíng de gùshì.","Đây là một câu chuyện về tình yêu."],[503,"安静",2,"ānjìng","an tĩnh","yên lặng","图书馆里非常安静。","Túshūguǎn lǐ fēicháng ānjìng.","Trong thư viện rất yên tĩnh."],[504,"爱人",2,"àirén","ái nhân","vợ/ chồng","我的爱人是一位医生。","Wǒ de àirén shì yí wèi yīshēng.","Vợ/chồng của tôi là một bác sĩ."],[505,"安全",2,"ānquán","an toàn","an toàn","过马路时要注意安全。","Guò mǎlù shí yào zhùyì ānquán.","Khi qua đường phải chú ý an toàn."],[506,"白色",2,"báisè","bạch sắc","màu trắng","我今天穿了一件白色的衣服。","Wǒ jīntiān chuānle yí jiàn báisè de yīfu.","Hôm nay tôi mặc một chiếc áo màu trắng."],[507,"班长",2,"bānzhǎng","ban trưởng","lớp trưởng","他是我们班的班长。","Tā shì wǒmen bān de bānzhǎng.","Cậu ấy là lớp trưởng của lớp chúng tôi."],[508,"办",2,"bàn","biện","làm","这件事你办得很好。","Zhè jiàn shì nǐ bàn de hěn hǎo.","Việc này bạn làm rất tốt."],[509,"办法",2,"bànfǎ","biện pháp","cách, phương pháp","我想出了一个好办法。","Wǒ xiǎng chūle yí gè hǎo bànfǎ.","Tôi đã nghĩ ra một cách hay rồi."],[510,"办公室",2,"bàngōngshì","biện công thất","phòng làm việc","老师现在在办公室里。","Lǎoshī xiànzài zài bàngōngshì lǐ.","Thầy nh ấy là ngôi sao điện ảnh nổi tiếng nhất hiện nay, có rất nhiều người hâm mộ trẻ tuổi."],[884,"目的",2,"mùdì","mục đích","mục đích","他这次去中国的主要目的是提高自己的汉语口语。","Tā zhè cì qù Zhōngguó de zhǔyào mùdì shì tígāo zìjǐ de Hànyǔ kǒuyǔ.","Mục đích chủ yếu của anh ấy khi đi Trung Quốc lần này là nâng cao khẩu ngữ tiếng Trung."],[885,"拿出",2,"náchū","na xuất","mang ra, lấy ra","请大家从书包里拿出笔记本，准备开始做笔记。","Qǐng dàjiā cóng shūbāo lǐ náchū bǐjìběn, zhǔnbèi kāishǐ zuò bǐjì.","Xin mọi người lấy vở ghi chép từ trong cặp sách ra, chuẩn bị bắt đầu ghi chép nào."],[886,"拿到",2,"nádào","na đáo","lấy được, đạt được","经过四年的辛勤努力，他终于拿到了大学毕业证。","Jīngguò sì nián de xīnqín nǔlì, tā zhōngyú nádàole dàxué bìyèzhèng.","Qua 4 năm nỗ lực chăm chỉ, anh ấy cuối cùng đã lấy được bằng tốt nghiệp đại học."],[887,"那",2,"nà","na","vậy, kia, thế thì","如果你今天不想去公园，那我们去超市买东西吧。","Rúguǒ nǐ jīntiān bù xiǎng qù gōngyuán, nà wǒmen qù chāoshì mǎi dōngxi ba.","Nếu như hôm nay bạn không muốn đi công viên, vậy thì chúng ta đi siêu thị mua đồ đi."],[888,"那会儿",2,"nàhuìr","na hội nhi","lúc ấy, khi đó","他昨天下午两点在开会，那会儿手机关机了。","Tā zuótiān xiàwǔ liǎng diǎn zài kāihuì, nàhuìr shǒujī guānjī le.","Chiều hôm qua lúc 2 giờ anh ấy đang họp, lúc đó máy điện thoại đã tắt rồi."],[889,"那么",2,"nàme","na ma","vậy thì, đến vậy, như thế","既然大家都同意这个办法，那么我们就这样办吧。","Jìrán dàjiā dōu tóngyì zhè gè bànfǎ, nàme wǒmen jiù zhèyàng bàn ba.","Nếu mọi người đều đồng ý phương pháp này, vậy thì chúng ta làm như thế này đi."],[890,"那时候那时",2,"nà shíhòu nà shí","na thời hậu na thời","lúc đó, khi đó","我小时候住在农村，那时候那里的空气非常新鲜。","Wǒ xiǎoshíhou zhù zài nóngcūn, nà shíhòu nàlǐ de kōngqì fēicháng xīnxian.","Lúc nhỏ tôi sống ở nông thôn, khi đó không khí ở nơi ấy vô cùng trong lành."],[891,"那样",2,"nàyàng","na dạng","như vậy, như thế","你不要总是那样说话，会让别人生气和误会的。","Nǐ búyào zǒngshì nàyàng shuōhuà, huì ràng biérén shēngqì hé wùhuì de.","Bạn đừng có luôn nói chuyện kiểu như vậy, sẽ làm người khác tức giận và hiểu lầm đấy."],[892,"南方",2,"nánfāng","nam phương","miền Nam, phương Nam", const tones=[["ˉ","Thanh 1 – ngang cao","mā 妈","t1"],["ˊ","Thanh 2 – lên (như hỏi “hả?”)","má 麻","t2"],["ˇ","Thanh 3 – xuống rồi lên","mǎ 马","t3"],["ˋ","Thanh 4 – xuống dứt khoát","mà 骂","t4"]];
$("#app").innerHTML=`
<div class="card"><h2>Pinyin (拼音) là gì?</h2><p>Pinyin là cách viết âm đọc của chữ Hán bằng chữ Latinh. Mỗi âm tiết = <b>thanh mẫu</b> (phụ âm đầu) + <b>vận mẫu</b> (vần) + <b>thanh điệu</b>.</p></div>
<div class="card"><h2>4 thanh điệu + thanh nhẹ</h2><div class="grid">${tones.map(t=>`<div class="chip"><b class="${t[3]}" style="font-size:1.3rem">${t[0]}</b><br>${t[1]}<br><span class="py zh">${t[2]}</span> ${sp(t[2].split(" ")[1])}</div>`).join("")}</div>
<p>Thanh nhẹ (轻声): đọc ngắn, nhẹ, không dấu, vd <span class="zh py">māma 妈妈</span>.</p>
<h3>Quy tắc cần nhớ</h3><div class="ex">不 <b>bù</b> đọc thành <b>bú</b> trước thanh 4: <span class="zh">不是 bú shì</span></div>

<div class="ex">一 <b>yī</b> đổi thành <b>yí</b> trước thanh 4, và <b>yì</b>… theo ngữ cảnh; học dần qua ví dụ.</div></div>
<div class="card"><h2>Thanh mẫu (21 phụ âm đầu)</h2>${ini.map(g=>`<div class="row" style="margin:6px 0">${g.map(i=>`<button class="btn" onclick="speak('${i==="r"?"日":i==="zh"?"知":i==="ch"?"吃":i==="sh"?"诗":i==="z"?"资":i==="c"?"词":i==="s"?"思":i}')">${i}</button>`).join("")}</div>`).join("")}
<p class="mu">Chú ý các cặp dễ nhầm với người Việt: <b>zh/ch/sh</b> (uốn lưỡi) – <b>z/c/s</b> (lưỡi thẳng); <b>j/q/x</b> đi với i, ü; <b>b/p, d/t, g/k</b> khác nhau ở độ bật hơi (p, t, k bật hơi mạnh).</p></div>

const GR={"levels":[{"level":1,"name":"HSK 1","grammar_count":43,"grammar":[{"id":"HSK1-001","stt":1,"title":"Đại từ nghi vấn “什么/shénme/”","explanation":"Dùng để hỏi người hoặc sự vật (cái gì, gì).","examples":[{"zh":"你叫什么名字","pinyin":"Nǐ jiào shénme míngzi","vi":"Tên bạn là gì?"},{"zh":"你买什么？","pinyin":"Nǐ mǎi shénme","vi":"Bạn mua gì?"}]},{"id":"HSK1-002","stt":2,"title":"Câu có từ “是/shì/”","explanation":"Dùng để biểu đạt thuộc tính, danh tính của đối tượng, sự vật, sự việc. Dạng phủ định thêm不 /bú/ ở phía trước","examples":[{"zh":"我是老师。","pinyin":"Wǒ shì lǎoshī","vi":"Tôi là giáo viên."},{"zh":"李月不是老师。","pinyin":"Lǐ Yuè bú shì lǎoshī","vi":"Lý Nguyệt không phải là giáo viên"}]},{"id":"HSK1-003","stt":3,"title":"Trợ từ nghi vấn “吗/ma/”","explanation":"Đặt ở cuối câu trần thuật để tạo thành câu hỏi nghi vấn (phải không, không?).","examples":[{"zh":"你是美国人吗？","pinyin":"Nǐ shì Měiguó rén ma","vi":"Bạn là người Mỹ phải không?"},{"label":"","zh":"你是学生吗？","pinyin":"Nǐ shì xuésheng ma","vi":"Bạn là học sinh phải không?"}]},{"id":"HSK1-004","stt":4,"title":"Đại từ nghi vấn “哪/nǎ/”","explanation":"Dùng để hỏi về người hoặc sự vật, thường đi kèm lượng từ.","examples":[{"zh":"你是哪国人？","pinyin":"Nǐ shì nǎ guó rén","vi":"Bạn là người nước nào?"},{"zh":"哪本书？Nǎ","pinyin":"běn shū?","vi":"Quyển sách nào?"}]},{"id":"HSK1-005","stt":5,"title":"Trợ từ kết cấu “的/de/”","explanation":"Biểu thị quan hệ sở hữu (của). Có thể lược bỏ khi danh từ theo sau là quan hệ thân thuộc.","examples":[{"zh":"她是我的汉语老师。","pinyin":"Tā shì wǒ de Hànyǔ lǎoshī","vi":"Cô ấy là giáo viên tiếng Hán của tôi."},{"zh":"这是我的书。","pinyin":"Zhè shì wǒ de shū","vi":"Đây là sách của tôi."}]},{"id":"HSK1-006","stt":6,"title":"Trợ từ nghi vấn “呢/ne/”","explanation":"Dùng ở cuối câu để hỏi lại, truy vấn tình huống đã đề cập.","examples":[{"zh":"我喜欢喝咖啡。你呢？","pinyin":"Wǒ xǐhuan hē kāfēi. Nǐ ne","vi":"Tôi thích uống cà phê. Còn bạn?"},{"zh":"他已经吃过饭了。你呢？","pinyin":"Tā yǐjīng chīguo fàn le. Nǐ ne","vi":"Anh ấy ăn rồi. Còn bạn?"}]},{"id":"HSK1-007","stt":7,"title":"Đại từ nghi vấn “几/jǐ/”","explanation":"Dùng để hỏi về số lượng nhỏ (thường dưới 10).","examples":[{"zh":"你有几个汉语老师？","pinyin":"Nǐ yǒu jǐ ge Hànyǔ lǎoshī","vi":"Bạn có mấy giáo viên tiếng Hán?"},{"zh":"你女儿几岁了？","pinyin":"Nǐ nǚ'ér jǐ suì le","vi":"Con gái bạn mấy tuổi rồi?"}]},{"id":"HSK1-008","stt":8,"title":"Cách diễn đạt các số dưới 100","explanation":"Các số từ 11 đến 99 trong tiếng Trung được tạo thành theo cấu trúc:(Số hàng chục) +十+ (Số hàng đơn vị)","examples":[{"zh":"李老师今年50岁了。","pinyin":"Lǐ lǎoshī jīnnián wǔshí suì le","vi":"Thầy Lí năm nay 50 tuổi rồi."},{"zh":"二十三","pinyin":"èr shí sān","vi":"Hai mươi ba."}]},{"id":"HSK1-009","stt":9,"title":"Trợ từ “了/le/ -","explanation":"Dùng ở cuối câu chỉ sự thay đổi, sự xuất hiện của 1 tình huống mới.","examples":[{"zh":"我朋友的女儿今年四岁了。","pinyin":"Wǒ péngyou de nǚ'ér jīnnián sì suì le","vi":"Con gái bạn tôi năm nay đã bốn tuổi rồi."},{"zh":"李老师今年50岁了。","pinyin":"Lǐ lǎoshī jīnnián wǔshí suì le","vi":"Thầy Lí năm nay đã 50 tuổi rồi.),"}]},{"id":"HSK1-010","stt":10,"title":"Động từ năng nguyện “会 /huì/”","explanation":"Diễn tả khả năng có được thông qua học hỏi. Dạng phủ định dùng不会/bú huì/.","examples":[{"zh":"我会写汉字。","pinyin":"Wǒ huì xiě Hànzì","vi":"Tôi biết viết chữ Hán."},{"zh":"你妈妈会做中国菜吗？","pinyin":"Nǐ māma huì zuò Zhōngguócài ma","vi":"Mẹ bạn có biết nấu món Trung Quốc không?"}]},{"id":"HSK1-011","stt":11,"title":"Câu có vị ngữ là tính từ","explanation":"Vị ngữ là tính từ, thường dùng很/hěn/ làm phó từ chỉ mức độ. Phủ định dùng 不/bù/.","examples":[{"zh":"你的汉语很好。","pinyin":"Nǐ de Hànyǔ hěn hǎo","vi":"Tiếng Hán của bạn rất tốt."},{"zh":"我妈妈的汉语不好。","pinyin":"Wǒ māma de Hànyǔ bù hǎo","vi":"Tiếng Hán của mẹ tôi không tốt."}]},{"id":"HSK1-012","stt":12,"title":"Đại từ nghi vấn “怎么/zěnme/”","explanation":"Dùng để hỏi phương thức thực hiện hành động, đặt trước động từ.","examples":[{"zh":"这个汉字怎么读？","pinyin":"Zhège Hànzì zěnme dú","vi":"Chữ Hán này đọc như thế nào?"},{"zh":"你怎么去饭店？","pinyin":"Nǐ zěnme qù fàn diàn","vi":"Bạn đi đến nhà hàng bằng cách nào?"}]},{"id":"HSK1-013","stt":13,"title":"Diễn tả ngày tháng","explanation":"Diễn tả tháng, ngày/thứ, thứ tự từ lớn đến nhỏ (năm -> tháng > ngày/thứ).","examples":[{"zh":"9月1号,星期三。","pinyin":"Jiǔ yuè yī hào, xīngqī sān","vi":"Ngày 1 tháng 9, thứ Tư 8月31号,星期二。/Bā yuè sān shí yī hào, xīngqī èr/ → Ngày 31 tháng 8, thứ Ba"}]},{"id":"HSK1-014","stt":14,"title":"Câu có vị ngữ là danh từ","explanation":"Vị ngữ là danh từ hoặc cụm danh từ (thường diễn tả tuổi tác, thời gian).","examples":[{"zh":"今天9月1号。","pinyin":"Jīntiān jiǔ yuè yī hào","vi":"Hôm nay là ngày 1 tháng 9."},{"zh":"我的汉语老师33岁。","pinyin":"Wǒ de Hànyǔ lǎoshī sān shí sān suì","vi":"Giáo viên tiếng Hán của tôi 33 tuổi."}]},{"id":"HSK1-015","stt":15,"title":"Cấu trúc liên động từ","explanation":"Hành động thứ nhất biểu thị phương thức hoặc mục đích của hành động thứ hai. Cả hai hành động đều do cùng một chủ thể thực hiện.","examples":[{"zh":"我去图书馆看书。","pinyin":"Wǒ qù túshūguǎn kàn shū","vi":"Tôi đi thư viện đọc sách."},{"zh":"妈妈上街买菜。","pinyin":"Māma shàng jiē mǎi cài","vi":"Mẹ ra chợ mua thức ăn."}]},{"id":"HSK1-016","stt":16,"title":"Động từ năng nguyện “想 /xiǎng/”","explanation":"Biểu thị mong muốn hoặc dự định (muốn).","examples":[{"zh":"我想喝茶。","pinyin":"Wǒ xiǎng hē chá","vi":"Tôi muốn uống trà."},{"label":"","zh":"明天我想去学校看书。","pinyin":"Míngtiān wǒ xiǎng qù xuéxiào kàn shū","vi":"Ngày mai tôi muốn đến trường đọc sách."}]},{"id":"HSK1-017","stt":17,"title":"Đại từ nghi vấn “多少/duōshao/","explanation":"Dùng để hỏi số lượng từ 10 trở lên, hoặc hỏi giá cả.","examples":[{"zh":"你们学校有多少个学生？","pinyin":"Nǐmen xuéxiào yǒu duōshao ge xuésheng","vi":"Trường các bạn có bao nhiêu học sinh?"},{"zh":"这个杯子多少钱？","pinyin":"Zhège bēizi duōshao qián","vi":"Cái cốc này bao nhiêu tiền?"}]},{"id":"HSK1-018","stt":18,"title":"Lượng từ “个/gè” “口/ kǒu/”","explanation":"个/gè/ Lượng từ phổ biến nhất, dùng cho hầu hết danh từ chỉ người, sự vật, đồ vật. Dùng khi không biết rõ lượng từ chuyên biệt. 口/kǒu/ Lượng từ dùng cho số thành viên trong gia đình.","examples":[{"zh":"一个老师","pinyin":"yí gè lǎoshī","vi":"một giáo viên"},{"zh":"三个苹果","pinyin":"sān gè píngguǒ","vi":"ba quả táo"},{"zh":"我家有四口人","pinyin":"Wǒ jiā yǒu sì kǒu rén","vi":"Nhà tôi có bốn người"},{"zh":"我们家三口人","pinyin":"Wǒmen jiā sān kǒu rén","vi":"Gia đình tôi có ba người"}]},{"id":"HSK1-019","stt":19,"title":"Động từ “在/zài/”","explanation":"Dùng để nói ai đó/cái gì đang ở đâu.","examples":[{"zh":"我朋友在学校。","pinyin":"Wǒ péngyou zài xuéxiào","vi":"Bạn tôi ở trường."},{"zh":"小狗在椅子下面。","pinyin":"Xiǎogǒu zài yǐzi xiàmiàn","vi":"Con chó nhỏ ở dưới ghế."}]},{"id":"HSK1-020","stt":20,"title":"Đại từ nghi vấn “哪儿/nǎr/","explanation":"Dùng để hỏi về vị trí của người hoặc vật (ở đâu).","examples":[{"zh":"你的杯子在哪儿？","pinyin":"Nǐ de bēizi zài nǎr","vi":"Cái cốc của bạn ở đâu?"},{"zh":"你的中国朋友在哪儿？","pinyin":"Nǐ de péngyou zài nǎr","vi":"Bạn của bạn ở đâu?"}]},{"id":"HSK1-021","stt":21,"title":"Giới từ “在/zài/","explanation":"Dẫn xuất từ động từ \"在\", dùng để chỉ địa điểm nơi xảy ra hành động.","examples":[{"zh":"他们在学校工作。","pinyin":"Tāmen zài xuéxiào gōngzuò","vi":"Họ làm việc ở trường."},{"zh":"我在朋友家喝茶。","pinyin":"Wǒ zài péngyou jiā hē chá","vi":"Tôi uống trà ở nhà bạn."}]},{"id":"HSK1-022","stt":22,"title":"Trợ từ nghi vấn “呢/ne/”","explanation":"Dùng ở cuối câu, hỏi lại về vị trí hoặc truy vấn về người/vật.","examples":[{"zh":"我的小猫呢？","pinyin":"Wǒ de xiǎomāo ne","vi":"Con mèo nhỏ của tôi đâu?"},{"zh":"他在哪儿呢？","pinyin":"Tā zài nǎr ne","vi":"Anh ấy ở đâu vậy?"}]},{"id":"HSK1-023","stt":23,"title":"Câu có từ “有/yǒu/”","explanation":"Biểu thị sự tồn tại hoặc sự sở hữu (có). Phủ định dùng没(有).","examples":[{"zh":"我的家乡有一条小河。","pinyin":"Wǒ de jiāxiāng yǒu yì tiáo xiǎo hé","vi":"Quê tôi có một con sông nhỏ."},{"zh":"房间里没有人。","pinyin":"Fángjiān lǐ méi yǒu rén","vi":"Trong phòng không có ai."}]},{"id":"HSK1-024","stt":24,"title":"Liên từ “和/hé/","explanation":"Dùng để nối hai hoặc nhiều thành phần giống nhau (danh từ, đại từ, cụm danh từ) trong câu.","examples":[{"zh":"哥哥和姐姐都在家。","pinyin":"Gēge hé jiějie dōu zài jiā","vi":"Anh trai và chị gái đều ở nhà."},{"zh":"我们学习了生词、语法和课文。","pinyin":"Wǒmen xuéxí le shēngcí hé yǔfǎ","vi":"Chúng tôi đã học từ mới và ngữ pháp."}]},{"id":"HSK1-025","stt":25,"title":"Động từ năng nguyện “能/néng/”","explanation":"Dùng để biểu thị khả năng, năng lực hoặc sự cho phép (có thể).","examples":[{"zh":"我能说汉语。","pinyin":"Wǒ néng shuō Hànyǔ.","vi":"Tôi có thể nói tiếng Trung."},{"zh":"这里能停车吗？","pinyin":"Zhèlǐ néng tíngchē ma?","vi":"Ở đây có được đỗ xe không?"}]},{"id":"HSK1-026","stt":26,"title":"“请/qǐng/","explanation":"Dùng để diễn tả lời đề nghị, yêu cầu lịch sự, mềm mỏng (mời).","examples":[{"zh":"请坐。","pinyin":"Qǐng zuò","vi":"Mời ngồi."},{"label":"","zh":"请喝茶。","pinyin":"Qǐng hē chá","vi":"Mời uống trà."}]},{"id":"HSK1-027","stt":27,"title":"Cách diễn tả thời gian","explanation":"Diễn tả theo thứ tự từ lớn đến nhỏ: Số giờ +点 /diǎn/ + Số phút +分/fēn/","examples":[{"zh":"现在八点十八分。","pinyin":"Xiànzài bā diǎn shíbā fēn","vi":"Bây giờ là 8 giờ 18 phút."},{"zh":"三点十五分","pinyin":"sān diǎn shíwǔ fēn","vi":"3 giờ 15 phút"}]},{"id":"HSK1-028","stt":28,"title":"Từ chỉ thời gian làm trạng ngữ","explanation":"Từ/cụm từ chỉ thời điểm, khoảng thời gian (như:今天，每天，八点，去年，...), đứng trong câu để bổ nghĩa cho toàn bộ hành động, trả lời câu hỏi \"Khi nào?\".","examples":[{"zh":"明天我们去公园。","pinyin":"Míngtiān wǒmen qù gōngyuán.","vi":"Ngày mai chúng tôi đi công viên."},{"zh":"晚上八点她看电视。","pinyin":"Wǎnshang bā diǎn tā kàn diànshì.","vi":"Lúc 8 giờ tối cô ấy xem TV."}]},{"id":"HSK1-029","stt":29,"title":"Danh từ “前 /qián/”","explanation":"Biểu thị một khoảng thời gian trước thời điểm hiện tại/được đề cập.","examples":[{"zh":"三天前","pinyin":"sān tiān qián","vi":"Ba ngày trước."},{"zh":"我以前住在北京。","pinyin":"Wǒ yǐqián zhù zài Běijīng","vi":"Trước đây tôi sống ở Bắc Kinh."}]},{"id":"HSK1-030","stt":30,"title":"Đại từ nghi vấn “怎么样 /zěnmeyàng/","explanation":"Dùng để hỏi về tính chất, trạng thái, ý kiến hoặc đề xuất.","examples":[{"zh":"这部电影怎么样？","pinyin":"Zhè bù diànyǐng zěnmeyàng?","vi":"Bộ phim này như thế nào? (Hay/dở ra sao?)"},{"zh":"我们晚上吃火锅，怎么样？","pinyin":"Wǒmen wǎnshang chī huǒguō, zěnmeyàng?","vi":"Tối nay chúng ta ăn lẩu, thấy sao?"}]},{"id":"HSK1-031","stt":31,"title":"Câu có vị ngữ là kết cấu chủ-vị","explanation":"Vị ngữ là một cụm từ có cấu trúc chủ-vị: [Chủ ngữ 1] + [Vị ngữ (Chủ ngữ 2 + Động từ 2)]","examples":[{"zh":"这本书内容很有趣。","pinyin":"Zhè běn shū nèiróng hěn yǒuqù","vi":"Cuốn sách này nội dung rất thú vị."},{"zh":"这家餐厅价格很贵。","pinyin":"Zhè jiā cāntīng jiàgé hěn guì","vi":"Nhà hàng này giá cả rất đắt."}]},{"id":"HSK1-032","stt":32,"title":"Phó từ chỉ mức độ “太/tài/","explanation":"Diễn tả mức độ quá cao, thường đi kèm了(le). Phủ định dùng不太.","examples":[{"zh":"太热了。","pinyin":"Tài rè le","vi":"Nóng quá rồi."},{"zh":"天气太冷了。","pinyin":"Tiānqì tài lěng le","vi":"Thời tiết lạnh quá rồi."}]},{"id":"HSK1-033","stt":33,"title":"Động từ năng nguyện “会/huì/","explanation":"Dùng để diễn tả khả năng xảy ra của một tình huống (dự đoán).","examples":[{"zh":"明天会下雨。","pinyin":"Míngtiān huì xiàyǔ.","vi":"Ngày mai sẽ mưa."},{"zh":"他应该会同意。","pinyin":"Tā yīnggāi huì tóngyì.","vi":"Anh ấy chắc sẽ đồng ý."}]},{"id":"HSK1-034","stt":34,"title":"Thán từ “喂 /wèi/","explanation":"Dùng để gọi, thu hút sự chú ý hoặc bắt đầu cuộc trò chuyện, đặc biệt là qua điện thoại.","examples":[{"zh":"喂，李老师在家吗？","pinyin":"Wèi, Lǐ lǎoshī zài jiā ma?","vi":"A lô, thầy Lý có ở nhà không?"},{"zh":"喂，你是张小姐吗？","pinyin":"Wèi, nǐ shì Zhāng xiǎojiě ma","vi":"A lô, cô là cô Trương phải không?"}]},{"id":"HSK1-035","stt":35,"title":"Cấu trúc “在……呢” (zài...ne)","explanation":"Biểu thị hành động đang diễn ra (đang).","examples":[{"zh":"你在做什么呢？","pinyin":"Nǐ zài zuò shénme ne","vi":"Bạn đang làm gì vậy?"},{"zh":"我在看书呢。","pinyin":"Wǒ zài kàn shū ne","vi":"Tôi đang đọc sách."}]},{"id":"HSK1-036","stt":36,"title":"Cách đọc số điện thoại","explanation":"Đọc từng chữ số một, tuần tự từ trái sang phải. Số \"1\" đọc là /yāo/.","examples":[{"raw":"82304156 /bā èr sān líng sì yāo wǔ liù/ 13851897623 /yāo sān bā wǔ yāo bā jiǔ qī liù èr sān/"}]},{"id":"HSK1-037","stt":37,"title":"Trợ từ ngữ khí “吧/ba/","explanation":"Đề nghị, khuyên bảo, mệnh lệnh.","examples":[{"zh":"我们走吧。","pinyin":"Wǒmen zǒu ba.","vi":"Mình đi thôi."},{"zh":"她在工作呢，你下午打吧。","pinyin":"Tā zài gōngzuò ne, nǐ xiàwǔ dǎ ba","vi":"Cô ấy đang làm việc, chiều bạn gọi điện đi."}]},{"id":"HSK1-038","stt":38,"title":"Trợ từ了/le/","explanation":"Dùng sau động từ/tính từ để biểu thị sự việc đã xảy ra hay hoàn thành.","examples":[{"zh":"她去商店了。","pinyin":"Tā qù shāngdiàn le","vi":"Cô ấy đã đi cửa hàng rồi."},{"zh":"我买了一点儿苹果。","pinyin":"Wǒ mǎi le yì diǎnr píngguǒ","vi":"Tôi đã mua một ít táo."}]},{"id":"HSK1-039","stt":39,"title":"Danh từ 后/hòu/","explanation":"Biểu thị một khoảng thời gian sau thời điểm được đề cập (sau).","examples":[{"zh":"五点四十分钟后。","pinyin":"Wǔ diǎn sì shí fēnzhōng hòu","vi":"Sau 5 giờ 40 phút五"},{"zh":"点后。","pinyin":"Wǔ diǎn hòu","vi":"Sau 5 giờ."}]},{"id":"HSK1-040","stt":40,"title":"Trợ từ ngữ khí 啊/a/","explanation":"Trợ từ ngữ khí啊/a/ (có thể biến âm thành /ya/, /wa/, /na/... tùy âm tiết trước nó) khi đặt cuối câu trần thuật có tác dụng làm mềm mại, thân mật, nhấn mạnh hoặc bày tỏ cảm xúc","examples":[{"zh":"小心啊！","pinyin":"Xiǎoxīn a","vi":"Cẩn thận đấy!"},{"zh":"快点儿啊，要迟到了！","pinyin":"Kuài diǎnr a, yào chídào le!","vi":"Nhanh lên nào, sắp muộn rồi!"}]},{"id":"HSK1-041","stt":41,"title":"Phó từ 都/dōu/","explanation":"Biểu thị sự bao gồm hoặc tổng hợp (đều, tất cả).","examples":[{"zh":"他们都喜欢看电视。","pinyin":"Tāmen dōu xǐhuan kàn diànshì","vi":"Họ đều thích xem TV."},{"zh":"我们都是坐出租车来的。","pinyin":"Wǒmen dōu shì zuò chūzūchē lái de","vi":"Chúng tôi đều là đi taxi đến."}]},{"id":"HSK1-042","stt":42,"title":"Cấu trúc “是……的”","explanation":"Nhấn mạnh thời gian, địa điểm, hoặc cách thức xảy ra sự việc đã biết.","examples":[{"zh":"我们是坐出租车来的。","pinyin":"Wǒmen shì zuò chūzūc

dàn lí jù zuì zhōng chéng gōng shàng wèi kě zhī","vi":"Mặc dù chúng tôi đã đạt được tiến triển ban đầu, nhưng vẫn chưa thể biết được còn cách thành công cuối cùng bao xa."}]}],"exam_focus":[]}]};
let gf={lv:1,q:"",n:30};
function gram(){
$("#app").innerHTML=`<div class="card"><h2>Ngữ pháp HSK</h2><div class="row"><select id="gl">${[1,2,3,4,5,6].map(i=>`<option value="${i}">HSK ${i}</option>`).join("")}</select><input id="gq" placeholder="Tìm điểm ngữ pháp / chữ Hán / giải thích" style="flex:1;min-width:160px"></div><p class="mu" id="gc"></p></div><div id="glist"></div>`;
$("#gl").value=gf.lv;$("#gq").value=gf.q;
$("#gl").onchange=$("#gq").oninput=()=>{gf.n=30;gdraw()};gdraw()}
function gex(e){const z=(e.zh||"").replace(/[^\u3400-\u9fff，。？！、]/g,"");const lb=e.label?`<b>${e.label}</b> `:"";
return e.zh&&e.pinyin&&e.vi?`<div class="ex">${lb}<span class="zh">${e.zh}</span> ${z?sp(z):""}<br><span class="py">${e.pinyin}</span><br>${e.vi}</div>`:`<div class="ex">${e.raw||""}</div>`}
function gdraw(){gf.lv=+$("#gl").value;gf.q=$("#gq").value.trim().toLowerCase();
const L=GR.levels[gf.lv-1];
const r=L.grammar.filter(g=>!gf.q||(g.title+" "+g.explanation+" "+g.examples.map(e=>(e.zh||"")+(e.pinyin||"")+(e.vi||"")+(e.raw||"")).join(" ")).toLowerCase().includes(gf.q));
$("#gc").textContent=`${r.length}/${L.grammar.length} điểm ngữ pháp`;
let s=r.slice(0,gf.n).map(g=>`<div class="card"><h3 style="margin-top:0">${g.stt?g.stt+". ":""}${g.title}${g.word_class?` <span class="mu">(${g.word_class})</span>`:""}</h3><p>${g.explanation.replace(/\n/g,"<br>")}</p>${g.examples.map(gex).join("")}</div>`).join("");
if(r.length>gf.n)s+=`<button class="btn p" onclick="gf.n+=30;gdraw()">Xem thêm</button>`;
if(!gf.q&&L.exam_focus.length)s+=`<div class="card"><h2>Hay gặp trong đề thi HSK ${gf.lv}</h2>${L.exam_focus.map(f=>`<h3>${f.category||(f.stt+". "+f.title)}</h3>${f.points?`<ul>${f.points.map(p=>`<li>${p}</li>`).join("")}</ul>`:""}<p>${f.reason}</p>`).join("")}</div>`;
$("#glist").innerHTML=s}

let F={lv:1,deck:[],i:0,flip:false,rev:false,track:false,star:false,sh:false,list:30};
function fbuild(){F.deck=V.filter(w=>(!F.lv||w.lv===F.lv)&&(!F.star||starred.has(w.n)));if(F.sh)F.deck=shuffle(F.deck);F.i=0;F.flip=false;F.list=30;fshow();flist()}
function flash(){
$("#app").innerHTML=`<div class="card"><div class="row"><select id="fl">${LVOPT}</select><select id="fm"><option value="0">Mặt trước: chữ Hán</option><option value="1">Mặt trước: nghĩa</option></select></div><div class="row" style="margin-top:8px"><label><input type="checkbox" id="ft"> Theo dõi tiến độ</label><label><input type="checkbox" id="fs"> Chỉ từ gắn sao ★</label><label><input type="checkbox" id="fh"> Xáo trộn</label></div></div><div id="fhead"></div><div id="fcard"></div><div id="fctl"></div><div id="flist"></div>`;
$("#fl").value=F.lv;$("#fm").value=+F.rev;$("#ft").checked=F.track;$("#fs").checked=F.star;$("#fh").checked=F.sh;
$("#fl").onchange=$("#fm").onchange=$("#ft").onchange=$("#fs").onchange=$("#fh").onchange=()=>{F.lv=+$("#fl").value;F.rev=$("#fm").value==="1";F.track=$("#ft").checked;F.star=$("#fs").checked;F.sh=$("#fh").checked;fbuild()};
fbuild()}
function fshow(){
const K=F.deck,el=$("#fcard");
if(!K.length){el.innerHTML=`<div class="card">Chưa có thẻ nào. Hãy gắn sao ★ cho vài từ hoặc đổi bộ lọc.</div>`;$("#fctl").innerHTML="";$("#fhead").innerHTML="";return}
const w=K[F.i],st=starred.has(w.n),kn=K.filter(x=>known.has(x.n)).length;
$("#fhead").innerHTML=F.track?`<div class="row" style="justify-content:space-between"><span class="pill lr">${K.length-kn} Đang học</span><span class="pill kn">${kn} Đã biết</span></div>`:"";
const term=`<div class="big zh" style="font-size:3.6rem">${w.h}</div>`;
const front=F.rev?`<div style="font-size:1.8rem">${w.m}</div>`:term;
const back=(F.rev?term:"")+`<div class="py" style="font-size:1.4rem">${w.p}</div><div class="mu">Hán Việt: ${w.hv}</div>`+(F.rev?"":`<div style="font-size:1.3rem;margin:6px 0">${w.m}</div>`)+`<div style="text-align:left" onclick="event.stopPropagation()">${exh(w)}</div>`;
const tools=`<div class="qt" onclick="event.stopPropagation()"><button class="ib" onclick="speak('${w.h}')" aria-label="Nghe">🔊</button><button class="ib" onclick="fstar(${w.n})" aria-label="Gắn sao">${st?"★":"☆"}</button></div>`;
el.innerHTML=`<div class="qc" onclick="flipc()"><div class="qi${F.flip?" fl":""}" id="qi"><div class="qf">${tools}<div class="in">${front}<p class="mu" style="font-size:.8rem">Chạm để lật · phím Space</p></div></div><div class="qf qb">${tools}<div class="in">${back}</div></div></div></div>`;
$("#fctl").innerHTML=`<div class="bar"><i style="width:${(F.i+1)/K.length*100}%"></i></div>`+(F.track?`<div class="row" style="justify-content:space-between;margin:10px 0"><button class="btn" onclick="fmark(false)">✗ Đang học</button><button class="btn ok" onclick="fmark(true)">✓ Đã biết</button></div>`:"")+`<div class="row" style="justify-content:center;gap:18px;margin:10px 0"><button class="btn" onclick="fnav(-1)" aria-label="Thẻ trước">←</button><b>${F.i+1} / ${K.length}</b><button class="btn" onclick="fnav(1)" aria-label="Thẻ sau">→</button></div>`}
function flipc(){F.flip=!F.flip;const e=$("#qi");if(e)e.classList.toggle("fl",F.flip)}
function fnav(d){const n=F.deck.length;if(!n)return;F.i=(F.i+d+n)%n;F.flip=false;fshow()}
function fmark(k){const w=F.deck[F.i];k?known.add(w.n):known.delete(w.n);sv("known2",[...known]);fnav(1)}
function fstar(n){starred.has(n)?starred.delete(n):starred.add(n);sv("starred",[...starred]);fshow();flist()}
function flist(){const L=F.deck;$("#flist").innerHTML=L.length?`<h2 style="margin-top:20px">Thuật ngữ trong bộ này (${L.length})</h2>`+L.slice(0,F.list).map((w,i)=>`<div class="card row" style="margin:8px 0;flex-wrap:nowrap"><span class="big zh" style="min-width:3.4rem;font-size:1.6rem;cursor:pointer" onclick="F.i=${i};F.flip=false;fshow();window.scrollTo(0,0)">${w.h}</span><div style="flex:1"><span class="py">${w.p}</span><br>${w.m}</div><button class="ib" onclick="fstar(${w.n})" aria-label="Gắn sao">${starred.has(w.n)?"★":"☆"}</button><button class="ib" onclick="speak('${w.h}')" aria-label="Nghe">🔊</button></div>`).join("")+(L.length>F.list?`<button class="btn p" onclick="F.list+=30;flist()">Xem thêm</button>`:""):""}
document.addEventListener("keydown",e=>{if(CUR!=="flash"||/INPUT|SELECT|TEXTAREA/.test(e.target.tagName))return;if(e.key==="ArrowRight")fnav(1);else if(e.key==="ArrowLeft")fnav(-1);else if([" ","ArrowUp","ArrowDown"].includes(e.key)){e.preventDefault();flipc()}});

let Q=null;
function quiz(){
if(Q&&Q.done){return qres()}
if(Q){return qshow()}
$("#app").innerHTML=`<div class="card"><h2>Bài kiểm tra trắc nghiệm</h2><p>10 câu ngẫu nhiên: chữ Hán → nghĩa, pinyin → nghĩa, nghĩa → chữ Hán.</p>
<div class="row"><select id="ql">${LVOPT}</select><button class="btn p" onclick="qstart()">Bắt đầu</button></div></div>`}
function qstart(){const lv=+$("#ql").value,pool=V.filter(w=>!lv||w.lv===lv);
const qs=shuffle(pool).slice(0,10).map(w=>{const t=Math.floor(Math.random()*3);
const key=t===2?"h":"m";const dis=shuffle(pool.filter(x=>x[key]!==w[key])).slice(0,3);
return{w,t,opts:shuffle([w,...dis]),a:null}});
Q={qs,i:0,done:false,lv};qshow()}
function qshow(){const q=Q.qs[Q.i],w=q.w;
const prompt=q.t===0?`<span class="big zh">${w.h}</span>`:q.t===1?`<span class="big py">${w.p}</span>`:`<span class="big" style="font-size:1.5rem">${w.m}</span>`;
const ask=q.t===2?"Chữ Hán nào có nghĩa này?":"Nghĩa của từ này là gì?";
$("#app").innerHTML=`<div class="card"><div class="mu">Câu ${Q.i+1} / ${Q.qs.length}</div><div class="bar"><i style="width:${Q.i/Q.qs.length*100}%"></i></div>
<p>${ask}</p>${prompt} ${q.t===2?"":sp(w.h)}
<div style="margin-top:12px">${q.opts.map((o,k)=>`<button class="btn opt ${q.a===null?"":o===w?"right":q.a===k?"wrong":""}" ${q.a!==null?"disabled":""} onclick="qans(${k})">${q.t===2?`<span class="zh" style="font-size:1.3rem">${o.h}</span>`:o.m}</button>`).join("")}</div>
${q.a!==null?`<p>${q.opts[q.a]===w?"✅ Chính xác!":"❌ Chưa đúng."} <span class="zh">${w.h}</span> – <span class="py">${w.p}</span> – ${w.m}</p><button class="btn p" onclick="qnext()">${Q.i<Q.qs.length-1?"Câu tiếp →":"Xem kết quả"}</button>`:""}</div>`}
function qans(k){Q.qs[Q.i].a=k;qshow()}
function qnext(){if(Q.i<Q.qs.length-1){Q.i++;qshow()}else{Q.done=true;qres()}}
function qres(){const s=Q.qs.filter(q=>q.opts[q.a]===q.w).length,wr=Q.qs.filter(q=>q.opts[q.a]!==q.w);
$("#app").innerHTML=`<div class="card"><h2>Kết quả: ${s} / ${Q.qs.length}</h2><p>${s>=9?"Xuất sắc! 🏆":s>=6?"Khá tốt, ôn thêm vài từ nhé!":"Cố lên! Hãy quay lại flashcard để ôn."}</p>
${wr.length?`<h3>Từ cần ôn lại</h3>${wr.map(q=>`<div class="ex"><span class="zh big" style="font-size:1.3rem">${q.w.h}</span> <span class="py">${q.w.p}</span> – ${q.w.m}</div>`).join("")}`:""}
<button class="btn p" onclick="Q=null;quiz()">Làm lại</button></div>`}

const h=location.hash.slice(1);go(TABS.some(t=>t[0]===h)?h:"home");
</script>
</body>
</html>

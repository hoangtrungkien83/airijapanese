hē lái de","vi":"Chúng tôi đến bằng taxi."},{"zh":"你是什么时候开始学汉语的？","pinyin":"Nǐ shì shénme shíhou kāishǐ xué Hànyǔ de","vi":"Bạn là bắt đầu học tiếng Hán từ khi nào?"}]},{"id":"HSK1-043","stt":43,"title":"Cách diễn tả ngày tháng","explanation":"Diễn tả đầy đủ năm, tháng, ngày, thứ, theo thứ tự từ lớn đến nhỏ.","examples":[{"zh":"今天是2025年1月5号。","pinyin":"Jīntiān shì èr líng èr wǔ nián yī yuè wǔ hào.","vi":"Hôm nay là ngày 5 tháng 1 năm 2025."},{"zh":"明天是2024年12月18号，星期三。","pinyin":"Míngtiān shì èr líng èr sì nián shí'èr yuè shíbā hào, xīngqīsān.","vi":"Ngày mai là thứ Tư, ngày 18 tháng 12 năm 2024."}]}],"exam_focus":[{"category":"Số lượng và định lượng","points":["Các số dưới 100","Đại từ nghi vấn “几/_jǐ_/","Đại từ nghi vấn “多少/_duōshao_/","Cách đọc số điện thoại"],"reason":"Đề thi thường kiểm tra trực tiếp khả năng nghe và phân biệt số lượng, tuổi tác, giá cả, và các con số phức tạp hơn (như số điện thoại) qua các tùy chọn trắc nghiệm."},{"category":"Hỏi đáp cơ bản (Nghi vấn)","points":["Đại từ nghi vấn “什么/_shénme_/”","Trợ từ nghi vấn “吗/_ma_/”","Đại từ nghi vấn “哪/_nǎ_/”","Đại từ nghi vấn “哪儿/_nǎr_/”","Đại từ nghi vấn “怎么样/_zěnmeyàng_/”"],"reason":"Các câu hỏi nghi vấn là cấu trúc cơ bản nhất của mọi bài kiểm tra ngôn ngữ. Đặc biệt là hỏi về danh tính, địa điểm, và tình trạng/trạng thái (thời tiết, sức khỏe)."},{"category":"Hành động và trạng thái","points":["Động từ/Giới từ “在/_zài_/”","Cấu trúc “在……呢/_zài...ne_/”","Trợ từ “了/_le_/”"],"reason":"Kiểm tra khả năng phân biệt giữa hành động đang diễn ra (在……呢) và hành động đã hoàn thành (了). Đây là hai khái niệm thì/trạng thái hành động quan trọng nhất ở cấp độ HSK 1."},{"category":"Động từ năng nguyện","points":["Động từ năng nguyện “想/_xiǎng_/","Động từ năng nguyện “会/_huì_/”"],"reason":"“想(muốn) và会(biết/sẽ) là hai động từ năng nguyện thiết yếu giúp người học diễn đạt ý định, khả năng và dự đoán. Chúng thường xuyên xuất hiện trong các tình huống hội thoại cơ bản, đóng vai trò quan trọng trong việc hình thành câu và thiết lập bối cảnh giao tiếp."}]},{"level":2,"name":"HSK 2","grammar_count":44,"grammar":[{"id":"HSK2-001","stt":1,"title":"Trợ động từ \"要/yào/”","explanation":"Khi là trợ động từ,要đứng trước động từ chính và diễn đạt ý chí, nguyện vọng hoặc sự cần thiết.","examples":[{"zh":"王方要学习英语。","pinyin":"Wáng Fāng yào xuéxí Yīngyǔ","vi":"Vương Phương muốn học tiếng Anh."},{"zh":"我要吃米饭。","pinyin":"Wǒ yào chī mǐfàn","vi":"Tôi muốn ăn cơm."}]},{"id":"HSK2-002","stt":2,"title":"Phó từ chỉ mức độ \"最/zuì/","explanation":"最có nghĩa là \"nhất\", dùng để biểu thị mức độ cao nhất trong phạm vi so sánh. Nó tương đương với hậu tố \"-est\" trong tiếng Anh (tallest, biggest) hoặc từ \"most\".","examples":[{"zh":"大卫的汉语最好。","pinyin":"Dàwèi de Hànyǔ zuì hǎo","vi":"Tiếng Hán của Đại Vệ là tốt nhất."},{"zh":"我最喜欢吃米饭。","pinyin":"Wǒ zuì xǐhuān chī mǐfàn","vi":"Tôi thích ăn cơm nhất."}]},{"id":"HSK2-003","stt":3,"title":"Cách diễn tả số lượng \"几/jǐ/","explanation":"几dùng để hỏi về số lượng ít, ước chừng dưới 10. Cấu trúc cơ bản:几+ Lượng từ + Danh từ?","examples":[{"zh":"这里住着几个人？","pinyin":"Zhèlǐ zhù zhe jǐ gè rén","vi":"Ở đây có mấy người ở?"},{"zh":"你学中文学了几年了？","pinyin":"Nǐ xué Zhōngwén xué le jǐ nián le","vi":"Bạn học tiếng Trung được mấy năm rồi?"}]},{"id":"HSK2-004","stt":4,"title":"Câu hỏi với \"是不是...\" /shì.bú shì../","explanation":"Nếu đưa ra phỏng đoán về một sự việc hoặc tình huống và muốn xác minh thêm, có thể dùng cấu trúc câu hỏi này. \"是不是...\" thường dùng ở phía trước vị ngữ, nhưng cũng có thể dùng ở đầu hoặc cuối câu.","examples":[{"zh":"你很少生病，是不是喜欢运动？","pinyin":"Nǐ hěn shǎo shēngbìng, shì bù shì xǐhuan yùndòng","vi":"Cậu rất ít khi ốm, có phải là thích vận động không?"},{"zh":"是不是明天爸爸休息?","pinyin":"Shì bù shì míngtiān bàba xiūxi","vi":"Có phải ngày mai bố nghỉ không?"}]},{"id":"HSK2-005","stt":5,"title":"Đại từ \"每/měi/”","explanation":"每thường không đứng một mình. Nó luôn đi kèm với một danh từ, lượng từ hoặc từ chỉ thời gian để tạo thành một cụm để chỉ tất cả các thành viên trong tập thể hoặc nhóm. Ví dụ: hằng ngày, mỗi năm, mỗi tháng, mỗi tuần.","examples":[{"zh":"山姆每年都去中国旅游。","pinyin":"Shānmǔ měi nián dōu qù Zhōngguó lǚyóu","vi":"Sam mỗi năm đều đi du lịch Trung Quốc."},{"label":"","zh":"我每天六点起床工作吗？","pinyin":"Wǒ měi tiān liù diǎn qǐchuáng gōngzuò ma","vi":"Tôi có phải mỗi ngày 6 giờ thức dậy làm việc không?"}]},{"id":"HSK2-006","stt":6,"title":"Đại từ nghi vấn \" 多/duō/”","explanation":"多được dùng để hỏi về độ cao, chiều dài, tuổi tác, khoảng cách, thời gian, giá cả... - tức là những thứ có thể đo lường được bằng con số.","examples":[{"zh":"你多大？","pinyin":"Nǐ duō dà","vi":"Bạn bao nhiêu tuổi?"},{"zh":"他儿子多高？","pinyin":"Tā érzi duō gāo","vi":"Con trai anh ấy cao bao nhiêu?"}]},{"id":"HSK2-007","stt":7,"title":"Cụm từ có \"的 /de/”","explanation":"Đại từ, tính từ, động từ kết hợp với \"的\" để tạo thành cụm từ trung tâm ngữ, tương đương với cụm danh từ để thay thế\ncho một danh từ đã được xác định hoặc ngầm hiểu trong ngữ cảnh.","examples":[{"zh":"这本书不是我的。","pinyin":"Zhè běn shū bú shì wǒ de","vi":"Cuốn sách này không phải của tôi."},{"zh":"这块表是你的吗？","pinyin":"Zhè kuài shǒubiǎo shì nǐ de ma","vi":"Chiếc đồng hồ này là của bạn phải không?"}]},{"id":"HSK2-008","stt":8,"title":"\"一下/yí xià/","explanation":"Dùng sau động từ, biểu thị một hành động ngắn ngủi.","examples":[{"zh":"我看一下。","pinyin":"Wǒ kàn yíxià","vi":"Tôi xem một chút."},{"zh":"你休息一下吧。","pinyin":"Nǐ xiūxī yíxià ba","vi":"Bạn nghỉ ngơi một chút đi."}]},{"id":"HSK2-009","stt":9,"title":"Phó từ ngữ khí \"真/zhēn/”","explanation":"Dùng để nhấn mạnh mức độ cao của một tính chất hoặc trạng thái, đồng thời bộc lộ cảm xúc chân thật của người nói.","examples":[{"zh":"你真好！","pinyin":"Nǐ zhēn hǎo","vi":"Bạn thật tốt!"},{"zh":"你女儿的房间真漂亮！","pinyin":"Nǐ nǚ'ér de fángjiān zhēn piàoliang","vi":"Phòng của con gái bạn thật đẹp!"}]},{"id":"HSK2-010","stt":10,"title":"Cấu trúc \"是...的 /shì... de/","explanation":"Dùng để nhấn mạnh chi tiết (thời gian, địa điểm, cách thức, đối tượng, mục đích...) của một sự việc đã xảy ra trong quá khứ.","examples":[{"zh":"这本书是我买的。","pinyin":"Zhè běn shū shì wǒ mǎi de","vi":"Cuốn sách này là do tôi mua."},{"zh":"手机不是我弄坏的。","pinyin":"Shǒujī bú shì wǒ nòng huài de","vi":"Điện thoại không phải là tôi làm hỏng đâu."}]},{"id":"HSK2-011","stt":11,"title":"Cấu trúc diễn tả thời gian \"......的时候\" /de shí hou/","explanation":"Dùng để chỉ một thời điểm hoặc khoảng thời gian cụ thể khi một sự việc xảy ra.","examples":[{"zh":"睡觉的时候，请保持安静。","pinyin":"Shuìjiào de shíhou, qǐng bǎochí ānjìng","vi":"Khi ngủ, hãy giữ yên lặng."},{"zh":"你忙的时候，不用回我的消息。","pinyin":"Nǐ máng de shíhou, búyòng huí wǒ de xiāoxi","vi":"Khi bạn bận, không cần phải trả lời tin nhắn của tôi."}]},{"id":"HSK2-012","stt":12,"title":"Phó từ \"就/jiù/","explanation":"Biểu thị thừa nhận, chấp nhận, đưa ra kết luận hợp logic hoặc giải pháp. Cấu trúc: \"就+ động từ/cụm động từ\".","examples":[{"zh":"你既然不喜欢这份工作，那就辞职吧。","pinyin":"Nǐ jìrán bù xǐhuan zhè fèn gōngzuò, nà jiù cízhí ba","vi":"Cậu đã không thích công việc này, vậy thì nghỉ việc đi."},{"zh":"天气这么冷，你穿这么少，就会感冒的。","pinyin":"Tiānqì zhème lěng, nǐ chuān zhème shǎo, jiù huì gǎnmào de","vi":"Thời tiết lạnh thế, cậu mặc ít vậy, ắt là sẽ bị cảm."}]},{"id":"HSK2-013","stt":13,"title":"Phó từ ngữ khí \" 还\" /hái/","explanation":"Cấu trúc \"还+ hình dung từ\" hoặc \"还+ tính từ\" thường dùng để diễn tả sự tán thành, chấp nhận được.","examples":[{"zh":"你还知道回来啊？","pinyin":"Nǐ hái zhīdào huílái a","vi":"Còn biết về đấy à?"},{"zh":"今天还挺冷的。","pinyin":"Jīntiān hái tǐng lěng de","vi":"Hôm nay còn khá lạnh đấy."}]},{"id":"HSK2-014","stt":14,"title":"Phó từ chỉ mức độ \"有点儿\" /yǒu diǎnr/","explanation":"Dùng để diễn tả cảm xúc tiêu cực hay thái độ không hài lòng của người nói.","examples":[{"zh":"今天天气有点儿冷。","pinyin":"Jīntiān tiānqì yǒudiǎnr lěng","vi":"Hôm nay thời tiết hơi lạnh."},{"zh":"我昨晚睡有点儿晚。","pinyin":"Wǒ zuówǎn shuì yǒudiǎnr wǎn","vi":"Tối qua tôi ngủ hơi muộn."}]},{"id":"HSK2-015","stt":15,"title":"Đại từ nghi vấn \"怎么/zěnme/”","explanation":"Dùng cấu trúc \"怎么+ động từ/tính từ\" để hỏi về nguyên nhân của sự việc nào đó và thường diễn tả thái độ ngạc nhiên, kỳ lạ.","examples":[{"zh":"你怎么不高兴？","pinyin":"Nǐ zěnme bù gāoxìng","vi":"Sao bạn không vui?"},{"zh":"今天怎么这么热？","pinyin":"Jīntiān zěnme zhème rè","vi":"Sao hôm nay nóng thế?"}]},{"id":"HSK2-016","stt":16,"title":"Sự lặp lại lượng từ","explanation":"Lượng từ (量词) khi được lặp lại sẽ có dạng \"AA\" hoặc \"一AA\", biểu thị ý nghĩa \"mỗi/từng...\", \"từng cái một\", \"rất nhiều\", hoặc tạo nhịp điệu, tính hình tượng cho câu văn.","examples":[{"zh":"这些苹果个个都很甜。","pinyin":"Zhèxiē píngguǒ gègè dōu hěn tián","vi":"Những quả táo này quả nào cũng rất ngọt."},{"zh":"这个商店的衣服件件都很漂亮。","pinyin":"Zhège shāngdiàn de yīfu jiàn jiàn dōu hěn piàoliang","vi":"Quần áo ở cửa hàng này cái nào cũng rất đẹp."}]},{"id":"HSK2-017","stt":17,"title":"Cấu trúc \"因为...,所以... /yīnwèi..., suǒyǐ.../","explanation":"Kết nối hai phần câu, trong đó một phân câu biểu thị nguyên nhân, một phân câu biểu thị kết quả.","examples":[{"zh":"因为天气不好，所以我没去商店。","pinyin":"Yīnwèi tiānqì bù hǎo, suǒyǐ wǒ méi qù shāngdiàn","vi":"Bởi vì thời tiết không tốt, nên tôi không đi cửa hàng."},{"zh":"因为汉字太难了，所以我不喜欢写汉字。","pinyin":"Yīnwèi Hànyǔ tài nán le, suǒyǐ wǒ bù xǐhuān xiě Hànzì","vi":"Bởi vì chữ Hán khó quá, nên tôi không thích viết chữ Hán."}]},{"id":"HSK2-018","stt":18,"title":"Phó từ ngữ khí \"还/hái/”","explanation":"Biểu thị hành động hoặc trạng thái vẫn đang tiếp diễn.","examples":[{"zh":"八点了，他还在睡觉。","pinyin":"Bā diǎn le, tā hái zài shuìjiào","vi":"- Tám giờ rồi, anh ấy vẫn còn ngủ."},{"zh":"你怎么还没吃饭？","pinyin":"Nǐ zěnme hái méi chī fàn","vi":"Sao bạn vẫn chưa ăn cơm?"}]},{"id":"HSK2-019","stt":19,"title":"Phó từ chỉ thời gian \"就\" /jiù/","explanation":"Nhấn mạnh sự việc xảy ra sớm, thuận lợi hoặc đạt được quan điểm của người nói.","examples":[{"zh":"电影七点开始， 他六点就来了。","pinyin":"Diànyǐng qī diǎn kāishǐ, tā liù diǎn jiù lái le","vi":"Phim 7 giờ bắt đầu, anh ấy 6 giờ đã đến rồi."},{"zh":"我昨天就知道这个消息了。","pinyin":"Wǒ zuótiān jiù zhīdào zhège xiāoxi le","vi":"Tôi hôm qua đã biết tin này rồi."}]},{"id":"HSK2-020","stt":20,"title":"Giới từ \"离\" /lí/","explanation":"Giới từ \"离\" dùng để biểu thị khoảng cách trong không gian hoặc thời gian giữa hai điểm. Nó tương đương với \"cách\", \"xa\", \"từ... đến...\" trong tiếng Việt.","examples":[{"zh":"我家离学校很远","pinyin":"Wǒ jiā lí xuéxiào hěn yuǎn","vi":"Nhà tôi cách trường rất xa."},{"zh":"学校离机场有20公里。","pinyin":"Xuéxiào lí jīchǎng yǒu èr shí gōnglǐ","vi":"Trường học cách sân bay 20 km."}]},{"id":"HSK2-021","stt":21,"title":"Trợ từ ngữ khí \" 呢\" /ne/","explanation":"Dùng ở cuối câu trần thuật sau động từ/tính từ, biểu thị sự khẳng định, tin tưởng.","examples":[{"zh":"八点上课，时间还早呢。","pinyin":"Bā diǎn shàngkè, shíjiān hái zǎo ne","vi":"Tám giờ vào lớp, thời gian vẫn còn sớm."},{"zh":"医院离我们这儿还远呢。","pinyin":"Yīyuàn lí wǒmen zhèr hái yuǎn ne","vi":"Bệnh viện cách chỗ chúng ta còn xa đấy."}]},{"id":"HSK2-022","stt":22,"title":"Câu hỏi có cấu trúc \"......,好吗? /hǎo ma/","explanation":"Thường dùng để hỏi ý kiến, quan điểm của người khác.","examples":[{"zh":"我们一起去吃饭，好吗？","pinyin":"Wǒmen yìqǐ qù chī fàn, hǎo ma","vi":"Chúng ta cùng đi ăn cơm nhé?"},{"zh":"你明天下午给我打电话，好吗？","pinyin":"Nǐ míngtiān xiàwǔ gěi wǒ dǎ diànhuà, hǎo ma","vi":"Chiều mai bạn gọi điện thoại cho tôi nhé?"}]},{"id":"HSK2-023","stt":23,"title":"Phó từ \"再/zài/","explanation":"Biểu thị một hành động hoặc trạng thái lặp lại hoặc tiếp tục diễn ra.","examples":[{"zh":"你再看看这本书。","pinyin":"Nǐ zài kàn kàn zhè běn shū","vi":"Bạn xem lại cuốn sách này đi."},{"zh":"你明天再给我打电话吧。","pinyin":"Nǐ míngtiān zài gěi wǒ dǎ diànhuà ba","vi":"Ngày mai bạn gọi điện thoại cho tôi nhé."}]},{"id":"HSK2-024","stt":24,"title":"Câu kiêm ngữ (兼语)","explanation":"Câu kiêm ngữ do hai cụm động từ tạo thành, trong đó động từ thứ nhất thường là \"请/qǐng/,让/ràng/,叫/jiào/\". Cấu trúc: Chủ ngữ 1 + Động từ 1 + Kiêm ngữ + Động từ 2 + (Tân ngữ)","examples":[{"zh":"我请你吃饭。","pinyin":"Wǒ qǐng nǐ chī fàn","vi":"Tôi mời bạn ăn cơm.老师 让 我 写 汉字。/Lǎoshī ràng wǒ xiě Hànzì/ Giáo viên bảo tôi viết chữ Hán."}]},{"id":"HSK2-025","stt":25,"title":"Sự lặp lại động từ","explanation":"Dùng để biểu thị thời gian ngắn, số lượng ít, nhẹ nhàng, thử.","examples":[{"zh":"我看看你的新手机。","pinyin":"Wǒ kànkan nǐ de xīn shǒujī","vi":"Tôi xem thử điện thoại mới của bạn."},{"zh":"让我想想再回答。","pinyin":"Ràng wǒ xiǎngxiǎng zài huídá","vi":"Để tôi nghĩ một chút rồi trả lời."}]},{"id":"HSK2-026","stt":26,"title":"Bổ ngữ chỉ kết quả","explanation":"Một số động từ hoặc hình dung từ có thể dùng sau động từ để bổ sung, giải thích kết quả của hành động.","examples":[{"zh":"我看见你的朋友了。","pinyin":"Wǒ kàn jiàn nǐ de péngyǒu le","vi":"Tôi nhìn thấy bạn của bạn rồi."},{"zh":"大卫找到工作了。","pinyin":"Dàwèi zhǎo dào gōngzuò le","vi":"Đại Vệ đã tìm được việc làm rồi."}]},{"id":"HSK2-027","stt":27,"title":"Giới từ \"从\" /cóng/","explanation":"\"从\" dùng để biểu thị điểm mốc khoảng thời gian, quãng đường, hoặc trình tự.","examples":[{"zh":"商店从上午九点开到下午六点。","pinyin":"Shāngdiàn cóng shàngwǔ jiǔ diǎn kāi dào xiàwǔ liù diǎn","vi":"Cửa hàng mở cửa từ 9 giờ sáng đến 6 giờ chiều."},{"zh":"从这儿到地铁站怎么走？","pinyin":"Cóng zhèr dào dìtiě zhàn zěnme zǒu","vi":"Từ đây đến ga tàu điện đi thế nào?"}]},{"id":"HSK2-028","stt":28,"title":"Cách diễn tả thứ tự \"第...\" /dì.../","explanation":"\"第\" thường được dùng trước cụm từ chỉ số lượng để nói về thứ tự.","examples":[{"zh":"第一本书","pinyin":"Dì yī běn shū","vi":"Cuốn sách thứ nhất."},{"zh":"第二次跳舞","pinyin":"Dì èr cì tiàowǔ","vi":"Lần múa thứ hai."}]},{"id":"HSK2-029","stt":29,"title":"Câu cầu khiến \" 不要...了\"; \"别... 了\"; \"不...了\"","explanation":"Biểu thị sự ngăn cản, cấm đoán làm việc gì đó.","examples":[{"zh":"不要玩手机了。","pinyin":"Bú yào wán shǒujī le","vi":"Đừng chơi điện thoại nữa."},{"zh":"别睡觉了。","pinyin":"Bié shuìjiào le","vi":"Đừng ngủ nữa."}]},{"id":"HSK2-030","stt":30,"title":"Giới từ \"对\" /duì/","explanation":"\"对\" có thể biểu thị mối quan hệ đối đãi giữa người và người, vật và vật, sự vật và sự vật.","examples":[{"zh":"跑步对身体很好。","pinyin":"Pǎobù duì shēntǐ hěn hǎo","vi":"Chạy bộ rất tốt cho sức khỏe."},{"zh":"看电视对学习汉语有帮助。","pinyin":"Kàn diànshì duì xuéxí Hànyǔ yǒu bāngzhù","vi":"Xem TV có ích cho việc học tiếng Hán."}]},{"id":"HSK2-031","stt":31,"title":"Cấu trúc có động từ/cụm động từ làm định ngữ","explanation":"Khi động từ hoặc cụm động từ được dùng làm định ngữ, phải thêm \"的\" vào giữa định ngữ và trung tâm ngữ.","examples":[{"zh":"新买的自行车","pinyin":"xīn mǎi de zìxíngchē","vi":"Chiếc xe đạp mới mua."},{"zh":"和你一起唱歌的人","pinyin":"hé nǐ yìqǐ chànggē de rén","vi":"Người hát cùng với bạn."}]},{"id":"HSK2-032","stt":32,"title":"Câu có từ \"比\" /bǐ/","explanation":"Dùng \"比\" biểu thị sự so sánh. Vị ngữ của câu có thể là tính từ.","examples":[{"zh":"哥哥比姐姐高。","pinyin":"Gēge bǐ jiějie gāo","vi":"Anh trai cao hơn chị gái."},{"zh":"今天比昨天热。","pinyin":"Jīntiān bǐ zuótiān rè","vi":"Hôm nay nóng hơn hôm qua."}]},{"id":"HSK2-033","stt":33,"title":"Câu có từ \"比\" diễn tả sự khác biệt","explanation":"Dùng số lượng biểu thị sự khác biệt.","examples":[{"zh":"西瓜比苹果贵两块钱。","pinyin":"Xīguā bǐ píngguǒ guì liǎng kuài qián","vi":"Dưa hấu đắt hơn táo hai tệ."},{"zh":"她比我们老师小两岁。","pinyin":"Tā bǐ wǒmen lǎoshī xiǎo liǎng suì","vi":"Cô ấy nhỏ hơn giáo viên của chúng tôi hai tuổi."}]},{"id":"HSK2-034","stt":34,"title":"Trợ động từ \"可能\" /kěnéng/","explanation":"Biểu thị sự phỏng đoán, có lẽ, có thể. Thường dùng trước động từ hoặc sau chủ ngữ.","examples":[{"zh":"他可能就知道这件事情了。","pinyin":"Tā kěnéng jiù zhīdào zhè jiàn shìqing le","vi":"Có lẽ anh ấy biết chuyện này rồi."},{"zh":"你可能不认识他。","pinyin":"Nǐ kěnéng bù rènshi tā","vi":"Bạn có thể không quen biết anh ấy."}]},{"id":"HSK2-035","stt":35,"title":"Bổ ngữ chỉ trạng thái (状态补语)","explanation":"Bổ ngữ trạng thái dùng để mô tả kết quả, mức độ hoặc trạng thái của hành động, thường dùng trợ động từ \"得\" (de).","examples":[{"zh":"他跑得很快。","pinyin":"Tā pǎo de hěn kuài","vi":"Anh ấy chạy rất nhanh.房间打扫得特别干净。 /Fángjiān dǎsǎo de tèbié gānjìng/ Phòng được dọn đặc biệt sạch sẽ."}]},{"id":"HSK2-036","stt":36,"title":"Câu có từ \"比\" /bǐ/ với bổ ngữ trạng thái","explanation":"Nếu động từ có bổ ngữ trạng thái, \"比\" có thể đặt trước động từ hoặc trước bổ ngữ.","examples":[{"zh":"他比我学得好。","pinyin":"Tā bǐ wǒ xué de hǎo","vi":"Anh ấy học tốt hơn tôi."},{"zh":"他比我跑得快得多。","pinyin":"Tā bǐ wǒ pǎo de kuài de duō","vi":"Anh ấy chạy nhanh hơn tôi nhiều."}]},{"id":"HSK2-037","stt":37,"title":"Trợ động thái \" 着\" /zhe/","explanation":"Đặt sau động từ, có thể biểu thị sự duy trì của một trạng thái nào đó.","examples":[{"zh":"门开着。","pinyin":"Mén kāi zhe","vi":"Cửa đang mở."},{"label":"","zh":"他们穿着红色的衣服。","pinyin":"Tāmen chuān zhe hóngsè de yīfu","vi":"Họ đang mặc quần áo màu đỏ."}]},{"id":"HSK2-038","stt":38,"title":"Câu hỏi phản vấn \"不是......吗?\"","explanation":"Thường dùng để nhắc nhở hoặc biểu thị sự không hiểu, không hài lòng.","examples":[{"zh":"不是今天没有雨吗？","pinyin":"Bú shì jīntiān méiyǒu yǔ ma","vi":"Không phải hôm nay không có mưa sao?"},{"zh":"不是你是北京人吗？","pinyin":"Bú shì nǐ shì Běijīng rén ma","vi":"Không phải bạn là người Bắc Kinh sao?"}]},{"id":"HSK2-039","stt":39,"title":"Giới từ \"往\" /wǎng/","explanation":"\"往\" thường dùng để chỉ phương hướng.","examples":[{"zh":"从这儿往前走，就是我们学校。","pinyin":"Cóng zhèr wǎng qián zǒu, jiù shì wǒmen xuéxiào","vi":"Từ đây đi về phía trước là trường của chúng tôi."},{"zh":"你看，往左是医院，往右是银行。","pinyin":"Nǐ kàn, wǎng zuǒ shì yīyuàn, wǎng yòu shì yínháng","vi":"Bạn xem, rẽ trái là bệnh viện, rẽ phải là ngân hàng."}]},{"id":"HSK2-040","stt":40,"title":"Trợ động thái \" 过\" /guò/","explanation":"Đặt sau động từ, dùng để biểu thị kinh nghiệm đã trải qua trong quá khứ.","examples":[{"zh":"他们来过我家。","pinyin":"Tāmen lái guo wǒ jiā","vi":"Họ đã từng đến nhà tôi."},{"zh":"我看过那个电影。","pinyin":"Wǒ kàn guo nàge diànyǐng","vi":"Tôi đã từng xem bộ phim đó."}]},{"id":"HSK2-041","stt":41,"title":"Cấu trúc \"虽然..., 但是...\" (suīrán..., dànshì...)","explanation":"Kết nối hai phân câu, cấu thành quan hệ chuyển ngoặt.","examples":[{"zh":"虽然外面很冷，但是房间里很热。","pinyin":"Suīrán wàimiàn hěn lěng, dànshì fángjiān lǐ hěn rè","vi":"Mặc dù bên ngoài rất lạnh, nhưng trong phòng rất ấm."},{"zh":"虽然汉语很难，但是我很喜欢写汉字。","pinyin":"Suīrán Hànyǔ hěn nán, dànshì wǒ hěn xǐhuān xiě Hànzì","vi":"Mặc dù tiếng Hán khó, nhưng tôi rất thích viết chữ Hán."}]},{"id":"HSK2-042","stt":42,"title":"Bổ ngữ chỉ tần suất \"次\" /cì/","explanation":"Thường đặt sau động từ, dùng để biểu thị số lần động tác xảy ra.","examples":[{"zh":"我们看过三次电影。","pinyin":"Wǒmen kàn guò sān cì diànyǐng","vi":"- Chúng tôi đã xem phim ba lần."},{"zh":"他们坐过飞机一次。","pinyin":"Tāmen zuò guò fēijī yī cì","vi":"Họ đã từng đi máy bay một lần."}]},{"id":"HSK2-043","stt":43,"title":"Cấu trúc diễn tả trạng thái của hành động \"要... 了\" /yào... le/","explanation":"Diễn tả một hành động/sự việc sắp diễn ra ngay lập tức, thường trong vài phút, vài giờ, hoặc tương lai rất gần. Cấu trúc: Chủ ngữ +要+ [Động từ/Cụm động từ] +了","examples":[{"zh":"火车要来了。","pinyin":"Huǒchē yào lái le","vi":"Tàu hỏa sắp đến rồi."},{"zh":"新的一年快要到了。","pinyin":"Xīn de yī nián kuàiyào dào le","vi":"Năm mới sắp đến rồi."}]},{"id":"HSK2-044","stt":44,"title":"Cấu trúc \"都...了 \" /dōu... le/","explanation":"Biểu thị ý nghĩa \"đã\", thường chứa sự nhấn mạnh hoặc ngữ khí không hài lòng.","examples":[{"zh":"都8点了，快点儿起床吧。","pinyin":"Dōu bā diǎn le, kuài diǎnr qǐchuáng ba","vi":"Đã 8 giờ rồi, mau dậy đi."},{"zh":"你都十岁了，可以自己洗衣服了。","pinyin":"Nǐ dōu shí suì le, kěyǐ zìjǐ xǐ yīfu le","vi":"Bạn đã 10 tuổi rồi, có thể tự giặt quần áo rồi."}]}],"exam_focus":[{"stt":1,"title":"Trợ động từ \"要\" /yào/ và Cấu trúc \"要...了\" (sắp/muốn)","reason":"\"要\" và cấu trúc diễn tả hành động sắp xảy ra (\"要...了\" hoặc \"快要...了\") là các cấu trúc cơ bản và quan trọng, xuất hiện trong mọi đề thi để hỏi về dự định hoặc phán đoán thời gian."},{"stt":2,"title":"Cấu trúc \"是...的\" /shì... de/(Nhấn mạnh)","reason":"Cấu trúc dùng để nhấn mạnh chủ thể, thời gian, hoặc cách thức thực hiện hành động được kiểm tra thường xuyên trong các bài tập đối thoại và câu kể, đặc biệt là trong phần Đọc hiểu (Ghép nối)."},{"stt":3,"title":"Bổ ngữ chỉ kết quả","reason":"Các bổ ngữ chỉ kết quả như \"完\" /wán/, \"见\" /jiàn/, \"错\" /cuò/, \"懂\" /dǒng/, \"到\" /dào/ xuất hiện rộng rãi để kiểm tra việc hoàn thành hay kết quả của hành động, đặc biệt trong phần đọc hiểu và hội thoại."},{"stt":4,"title":"Giới từ \"离\" /lí/ (Chỉ khoảng cách)","reason":"\"离\" là giới từ cốt lõi ở HSK 2, dùng để diễn tả khoảng cách địa lý hoặc thời gian. Nó luôn được kiểm tra trong các bài về địa điểm (sân bay, trường học, nhà ga)."},{"stt":5,"title":"Cấu trúc so sánh \"比\" /bǐ/ Câu so sánh sự khác biệt","reason":"Câu chữ \"比\" là cấu trúc so sánh cơ bản nhất, dùng để diễn tả sự hơn kém giữa hai đối tượng. Cấu trúc này liên tục xuất hiện, đôi khi kèm theo số lượng để diễn tả sự khác biệt."},{"stt":6,"title":"Phó từ \"再\" /zài/ Lặp lại/Tiếp tục","reason":"\"再\" biểu thị hành động lặp lại hoặc tiếp diễn, là một phó từ quan trọng trong các đoạn hội thoại về kế hoạch hoặc thay đổi."},{"stt":7,"title":"Bổ ngữ chỉ trạng thái \"得\" /de/","reason":"Bổ ngữ trạng thái \"得\" được sử dụng để mô tả hoặc đánh giá mức độ, kết quả của hành động."},{"stt":8,"title":"Đại từ nghi vấn \"怎么\" /zěnme/ (Hỏi nguyên nhân)","reason":"\"怎么\" dùng để hỏi nguyên nhân hoặc cách thức, thường mang ngữ khí ngạc nhiên, đây là từ khóa quan trọng trong các câu hỏi lắng nghe về lý do hoặc cách làm việc gì đó."}]},{"level":3,"name":"HSK 3","grammar_count":47,"grammar":[{"id":"HSK3-001","title":"Kết quả ngữ \"好\" /hǎo/","explanation":"Đặt sau động từ, biểu thị hành động đã được hoàn thành và đạt được kết quả thỏa đáng.","examples":[{"zh":"我吃好了。","pinyin":"Wǒ chī hǎo le","vi":"Tôi đã ăn ăn no rồi"},{"zh":"你准备好了吗？","pinyin":"Nǐ zhǔnbèi hǎo le ma","vi":"Bạn chuẩn bị xong chưa?"}]},{"id":"HSK3-002","title":"Cấu trúc phủ định tuyệt đối (一...也/都+不/ 没)","explanation":"Dùng để diễn tả sự phủ định hoàn toàn. Khi vị ngữ là tính từ, thường dùng \"一点儿也/都+不+ tính từ\".","examples":[{"zh":"我一点儿东西也不想吃。","pinyin":"Wǒ yìdiǎnr dōngxi yě bù xiǎng chī","vi":"Một chút đồ ăn tôi cũng không muốn ăn."},{"zh":"他一点儿也不累。","pinyin":"Tā yìdiǎnr yě bù lèi","vi":"Anh ấy một chút cũng không mệt."}]},{"id":"HSK3-003","title":"Liên từ \"那\" /nà/","explanation":"Đặt ở đầu câu, dùng để chỉ kết quả hay nhận xét dựa vào nội dung đã được đề cập trước đó.","examples":[{"zh":"1.A:我不想去看电影。","pinyin":"Wǒ bù xiǎng qù kàn diànyǐng","vi":"Tôi không muốn đi xem phim."},{"label":"B:","zh":"那我也不去了。","pinyin":"Nà wǒ yě bù qù le","vi":"Thế thì tôi cũng không đi nữa."},{"zh":"2. A:我早复习好了。","pinyin":"Wǒ zǎo fùxí hǎo le","vi":"Tôi đã ôn tập xong sớm rồi."},{"label":"B:","zh":"那也不能一直玩儿啊。","pinyin":"Nà yě bù néng yìzhí wánr a","vi":"Thế thì cũng không thể cứ chơi mãi được."}]},{"id":"HSK3-004","title":"Bổ ngữ chỉ phương hướng đơn giản","explanation":"Đặt sau động từ, biểu thị phương hướng của hành động. Thường dùng với các động từ có cùng phương hướng như上, 下,进,出,回,过,起.","examples":[{"zh":"我们在楼上等你呢，你上来吧。","pinyin":"Wǒmen zài lóu shàng děng nǐ ne, nǐ shàng lái ba","vi":"Chúng tôi ở trên lầu đợi bạn đấy, bạn lên đây đi."},{"zh":"你把这张椅子搬过去吧。","pinyin":"Nǐ bǎ zhè zhāng yǐzi bān guòqù ba","vi":"Bạn chuyển cái ghế này qua đó đi."}]},{"id":"HSK3-005","title":"Hai động từ/hành động liên tiếp (Động tác liền kề)","explanation":"Cấu trúc \"Động từ 1 +了+就+ Động từ 2\" dùng để diễn tả hai hành động xảy ra liên tiếp, hành động thứ hai nối tiếp ngay sau hành động thứ nhất.","examples":[{"zh":"我下了课就吃饭。","pinyin":"Wǒ xià le kè jiù chī fàn","vi":"Tôi tan học là ăn cơm ngay."},{"zh":"妈妈起了就做早饭。","pinyin":"Māma qǐ le jiù zuò zǎofàn","vi":"Mẹ thức dậy là làm bữa sáng ngay."}]},{"id":"HSK3-006","title":"Phản vấn: Câu hỏi có cấu trúc \" 能......吗\"","explanation":"Dùng để biểu thị sự phản đối. Nếu giữa \"能......吗\" là hình thức khẳng định biểu đạt ý phủ định.","examples":[{"zh":"你不做作业，也不练习，能学好吗？","pinyin":"Nǐ bù zuò zuòyè, yě bù liànxí, néng xué hǎo ma","vi":"Bạn không làm bài tập, cũng không luyện tập, làm sao mà học tốt được"},{"zh":"你每天晚上吃了饭就睡觉，也不出去走走，能不胖吗？","pinyin":"Nǐ měitiān wǎnshàng chī le fàn jiù shuìjiào, yě bù chūqù zǒuzou, néng bù pàng ma","vi":"Bạn mỗi tối ăn cơm xong là đi ngủ, cũng không ra ngoài đi dạo, làm sao mà không béo được?"}]},{"id":"HSK3-007","title":"\"还是\" /háishì/ và \"或者\" /huòzhě/","explanation":"Cả hai đều biểu thị sự lựa chọn. \"还是\" dùng trong câu hỏi nghi vấn, \"或者\" dùng trong câu trần thuật.","examples":[{"zh":"还是:你喜欢喝咖啡还是喝茶？","pinyin":"Nǐ xǐhuan hē kāfēi háishì hē chá","vi":"Bạn thích uống cà phê hay trà?"},{"zh":"或者:明天是晴天或者阴天都可以。","pinyin":"Míngtiān shì qíngtiān huòzhě yīntiān dōu kěyǐ","vi":"Ngày mai trời nắng hoặc trời râm đều được."}]},{"id":"HSK3-008","title":"Cấu trúc diễn tả sự tồn tại","explanation":"Dùng để biểu thị vị trí tồn tại của sự vật. Cấu trúc cơ bản là \"Từ/cụm từ chỉ vị trí + Động từ +着+ Cụm danh từ\".","examples":[{"zh":"桌子上放着一杯咖啡。","pinyin":"Zhuōzi shàng fàng zhe yī bēi kāfēi","vi":"Trên bàn đặt một tách cà phê"},{"zh":"冰箱里放着很多水果。","pinyin":"Bīngxiāng lǐ fàng zhe hěn duō shuǐguǒ","vi":"Trong tủ lạnh để rất nhiều hoa quả."}]},{"id":"HSK3-009","title":"Trợ động từ \"会\" /huì/","explanation":"Dùng trong câu biểu thị khả năng. Thường dùng để diễn tả những sự việc chưa xảy ra.","examples":[{"zh":"你穿得那么少，会感冒的。","pinyin":"Nǐ chuān de nàme shǎo, huì gǎnmào de","vi":"Bạn mặc ít đồ như vậy, sẽ bị cảm lạnh đấy."},{"zh":"喝杯热茶会很舒服。","pinyin":"Hē bēi rè chá huì hěn shūfu","vi":"Uống một tách trà nóng sẽ rất dễ chịu."}]},{"id":"HSK3-010","title":"Cấu trúc \"又... 又...\" /yòu... yòu.../","explanation":"Cấu trúc \"又+ tính từ 1 +又+ tính từ 2\" dùng để đề cập đến hai đặc điểm cùng tồn tại ở một người hay sự vật.","examples":[{"zh":"这个西瓜又大又甜。","pinyin":"Zhège xīguā yòu dà yòu tián","vi":"Quả dưa hấu này vừa to vừa ngọt."},{"zh":"她工作又认真又热情。","pinyin":"Tā gōngzuò yòu rènzhēn yòu rèqíng","vi":"Cô ấy làm việc vừa nghiêm túc vừa nhiệt tình."}]},{"id":"HSK3-011","title":"Động tác kèm trạng thái","explanation":"Cấu trúc \"Động từ 1 +着+ (trạng thái), Động từ 2 + (tân ngữ 2)\" biểu thị hai hành động xảy ra đồng thời, diễn tả trạng thái hoặc cách thức tiến hành hành động thứ hai.","examples":[{"zh":"小丽站着跟同事聊天儿。","pinyin":"Xiǎo Lì zhàn zhe gēn tóngshì liáotiānr","vi":"Tiểu Lệ đứng trò chuyện với đồng nghiệp."},{"zh":"她总是笑着跟客人说话。","pinyin":"Tā zǒng shì xiào zhe gēn kèrén shuōhuà","vi":"Cô ấy luôn cười nói chuyện với khách hàng."}]},{"id":"HSK3-012","title":"Trợ từ chỉ sự thay đổi \"了\" /le/","explanation":"Biểu thị tình huống đã thay đổi, hoặc xuất hiện tình huống mới.","examples":[{"zh":"我以前有钱，现在没钱了。","pinyin":"Wǒ yǐqián yǒu qián, xiànzài méi qián le","vi":"Trước đây tôi có tiền, giờ không có tiền nữa."},{"zh":"这条裙子是去年的，今年就不能穿了。","pinyin":"Zhè tiáo qúnzi shì qùnián de, jīnnián jiù bùnéng chuān le","vi":"Chiếc váy này là của năm ngoái, năm nay không mặc được nữa rồi."}]},{"id":"HSK3-013","title":"Cấu trúc \"越来越 + tính từ/động từ trạng thái\"","explanation":"Biểu thị sự thay đổi theo thời gian, hoặc sự thay đổi mức độ. Không dùng phó từ chỉ mức độ更.","examples":[{"zh":"这个问题越来越复杂。","pinyin":"Zhège wèntí yuè lái yuè fùzá","vi":"Vấn đề này càng lúc càng phức tạp."},{"zh":"他的汉语说得越来越流利。","pinyin":"Tā de Hànyǔ shuō de yuè lái yuè liúlì","vi":"Tiếng Trung của anh ấy nói ngày một lưu loát."}]},{"id":"HSK3-014","title":"Bổ ngữ chỉ khả năng","explanation":"Dùng để diễn tả khả năng có thể thực hiện được một kết quả nào đó. Công Thức Cơ Bản: Khẳng định: Động từ +得+ Bổ ngữ (kết quả/phương hướng) Phủ định: Động từ +不+ Bổ ngữ (kết quả/phương hướng) Dạng câu hỏi chính phản: Động từ +得 + Bổ ngữ + Động từ +不+ Bổ ngữ？","examples":[{"label":"Phủ định:","zh":"这个汉字太难，我写不对。","pinyin":"Zhège Hànzì tài nán, wǒ xiě bù duì","vi":"Chữ Hán này khó quá, tôi viết không đúng."},{"label":"Khẳng định:","zh":"你说慢一点儿，我听得懂","pinyin":"Nǐ shuō màn yīdiǎnr, wǒ tīng de dǒng","vi":"Bạn nói chậm một chút, tôi có thể nghe hiểu."},{"label":"Câu hỏi:","zh":"这么多作业，你今天做得完做不完？","pinyin":"Zhème duō zuòyè, nǐ jīntiān zuò de wán zuò bù wán","vi":"Nhiều bài tập thế này, hôm nay bạn làm xong được không?"}]},{"id":"HSK3-015","title":"Đại từ nghi vấn dùng để hỏi vị trí \"哪\" /nǎ/","explanation":"\"哪\" (thường dùng cùng với \"儿\" trong khẩu ngữ thành \"哪儿\") là đại từ nghi vấn dùng để hỏi về địa điểm, nơi chốn. Nó có nghĩa là \"đâu, nơi nào\".","examples":[{"zh":"卫生间在哪儿？","pinyin":"Wèishēngjiān zài nǎr","vi":"Nhà vệ sinh ở đâu?"},{"zh":"你去哪儿？","pinyin":"Nǐ qù nǎr","vi":"Bạn đi đâu?"}]},{"id":"HSK3-016","title":"Phân biệt \"刚\" /gāng/ và \"刚才\" /gāngcái/","explanation":"\"刚才\" là danh từ chỉ thời gian, chỉ hành động xảy ra trong thời gian ngắn. \"刚\" là phó từ, biểu thị hành động xảy ra cách thời điểm nói không lâu, thời gian ngắn hơn.","examples":[{"zh":"刚才:刚才我喝了一杯咖啡。","pinyin":"Gāngcái wǒ hē le yī bēi kāfēi","vi":"Lúc nãy tôi đã uống một tách cà phê."},{"zh":"刚:我刚喝完一杯咖啡。","pinyin":"Wǒ gāng hē wán yī bēi kāfēi","vi":"Tôi vừa mới uống xong một tách cà phê."}]},{"id":"HSK3-017","title":"Cách diễn tả khoảng thời gian","explanation":"Dùng cấu trúc \"Chủ ngữ + động từ +了 + khoảng thời gian + tân ngữ +了\" diễn tả hành động đang tiếp diễn.","examples":[{"zh":"我学习了两年汉语了。","pinyin":"Wǒ xuéxí le liǎng nián Hànyǔ le","vi":"Tôi đã học tiếng Hán được hai năm rồi."},{"zh":"我们在这儿坐了半个小时了。","pinyin":"Wǒmen zài zhèr zuò le bàn gè xiǎoshí le","vi":"Chúng tôi đã ngồi ở đây được nửa tiếng rồi."}]},{"id":"HSK3-018","title":"Cấu trúc \"对...... 感兴趣\" và \" 对......有兴趣\"","explanation":"Dùng để diễn tả sự hứng thú đối với điều gì đó.","examples":[{"zh":"他们对电影不感兴趣。","pinyin":"Tāmen duì diànyǐng bù gǎn xìngqù","vi":"Họ không hứng thú với phim ảnh."},{"zh":"同学们对打篮球很感兴趣。","pinyin":"Tóngxuémen duì dǎ lánqiú hěn gǎn xìngqù","vi":"Các bạn học rất hứng thú với bóng rổ."}]},{"id":"HSK3-019","title":"Dùng \"刻\", \"半\", \"差\" diễn tả thời gian","explanation":"Dùng để biểu thị thời gian. \"刻\" /kè/: Mười lăm phút \"半\" /bàn/: \"Rưỡi\" hoặc \"ba mươi phút \"差\" /chà/: Thiếu, kém, chưa tới.","examples":[{"zh":"三点一刻","pinyin":"Sān diǎn yí kè","vi":"Ba giờ mười lăm"},{"zh":"差五分八点","pinyin":"Chà wǔ fēn bā diǎn","vi":"Kém năm phút tám giờ. (Tức là 7:55)"},{"zh":"六点半","pinyin":"Liù diǎn bàn","vi":"Sáu giờ rưỡi / Sáu giờ ba mươi."}]},{"id":"HSK3-020","title":"\"又\" /yòu/ và \"再 \" /zài/","explanation":"\"又\" biểu thị hành động hoặc tình huống lặp lại đã xảy ra. \"再\" biểu thị hành động hoặc tình huống lặp lại chưa xảy ra.","examples":[{"zh":"又:你上午已经喝了一杯咖啡，下午怎么又喝了一杯？","pinyin":"Nǐ shàngwǔ yǐjīng hē le yī bēi kāfēi, xiàwǔ zěnme yòu hē le yī bēi","vi":"Buổi sáng bạn đã uống một ly cà phê rồi, buổi chiều sao lại uống thêm một ly nữa?"},{"zh":"再:你只吃了一点儿饭，再吃一点儿吧。","pinyin":"Nǐ zhǐ chī le yīdiǎn fàn, zài chī yīdiǎn ba","vi":"Bạn chỉ ăn một chút cơm, ăn thêm chút nữa đi."}]},{"id":"HSK3-021","title":"Đại từ nghi vấn dùng linh hoạt","explanation":"Dùng hai đại từ nghi vấn giống nhau, biểu thị sự tương đồng về đối tượng, hành động hoặc phương thức.","examples":[{"zh":"什么东西便宜我就买什么。","pinyin":"Shénme dōngxi piányi wǒ jiù mǎi shénme","vi":"Cái gì rẻ thì tôi mua cái đó."},{"zh":"你坐哪儿我就坐哪儿。","pinyin":"Nǐ zuò nǎr wǒ jiù zuò nǎr","vi":"Bạn ngồi đâu thì tôi ngồi đó."}]},{"id":"HSK3-022","title":"Cấu trúc \"越A越 B\" /yuè A yuè B/","explanation":"Biểu thị sự thay đổi đi kèm với sự thay đổi của A (càng... càng).","examples":[{"zh":"雨越下越大了。","pinyin":"Yǔ yuè xià yuè dà le","vi":"Mưa càng lúc càng to."},{"zh":"你说的中文越说越好了。","pinyin":"Nǐ shuō de Zhōngwén yuè shuō yuè hǎo le","vi":"Tiếng Trung của bạn càng nói càng hay."}]},{"id":"HSK3-023","title":"Cấu trúc so sánh 1: \"A跟B一样+ (tính từ)\"","explanation":"Dùng để so sánh A và B, kết quả tương đồng. Phủ định thì thêm \"不\" trước \"一样\".","examples":[{"zh":"这本书跟那本书一样。","pinyin":"Zhè běn shū gēn nà běn shū yīyàng","vi":"Quyển sách này giống quyển sách kia."},{"zh":"她的汉语说得跟中国人一样好。","pinyin":"Tā de Hànyǔ shuō de gēn Zhōngguó rén yīyàng hǎo","vi":"Tiếng Hán của cô ấy nói hay như người Trung Quốc."}]},{"id":"HSK3-024","title":"Cấu trúc so sánh 2: \"A比B + tính từ + bổ sung mức độ\"","explanation":"Dùng để so sánh sự khác biệt về mức độ (như一点儿/一些/得多/多了).","examples":[{"zh":"大山比大卫高一点儿。","pinyin":"Dàshān bǐ Dàwèi gāo yīdiǎn","vi":"Đại Sơn cao hơn Đại Vệ một chút"},{"zh":"数学比历史难多了。","pinyin":"Shùxué bǐ lìshǐ nán duō le","vi":"Môn Toán khó hơn môn Lịch sử nhiều."}]},{"id":"HSK3-025","title":"Cách diễn tả số ước lượng (1)","explanation":"Dùng hai số đếm liên tiếp (như二三,三四) để diễn tả số lượng ước chừng.","examples":[{"zh":"你每天都喝三四杯咖啡了，别再喝了。","pinyin":"Nǐ měitiān dōu hē sān sì bēi kāfēi le, bié zài hē le","vi":"Ngày nào bạn cũng uống ba bốn ly cà phê rồi, đừng uống nữa."},{"zh":"我们已经学了两三个小时。","pinyin":"Wǒmen yǐjīng xué le liǎng sān gè xiǎoshí","vi":"Chúng tôi đã học được khoảng hai ba tiếng."}]},{"id":"HSK3-026","title":"Cấu trúc với \"把\" (1)","explanation":"Dùng để chỉ hành động được thực hiện, có tác động đến đối tượng B và làm cho đối tượng thay đổi hoặc hoàn thành một việc gì đó.","examples":[{"zh":"请同学们把书拿出来。","pinyin":"Qǐng tóngxuémen bǎ shū ná chūlái","vi":"Mời các bạn học sinh lấy sách ra."},{"zh":"你把灯关了吧。","pinyin":"Nǐ bǎ dēng guān le ba","vi":"Bạn tắt đèn đi."}]},{"id":"HSK3-027","title":"Cách diễn tả số ước lượng (2)","explanation":"Dùng \"左右\" /zuǒyòu/ sau số để diễn tả số ước lượng (khoảng).","examples":[{"zh":"周末我一般十点左右起床。","pinyin":"Zhōumò wǒ yībān shí diǎn zuǒyòu qǐchuáng","vi":"Cuối tuần tôi thường dậy vào khoảng mười giờ."},{"zh":"我们公司有五百人左右。","pinyin":"Wǒmen gōngsī yǒu wǔbǎi rén zuǒyòu","vi":"Công ty chúng tôi có khoảng năm trăm người."}]},{"id":"HSK3-028","title":"Phân biệt \"才\" /cái/ và \"就\" /jiù/","explanation":"\"就\" biểu thị hành động xảy ra sớm, nhanh, thuận lợi. \"才\" biểu thị hành động xảy ra muộn, chậm, không thuận lợi.","examples":[{"zh":"(就):我早上五点就起床了。","pinyin":"Wǒ zǎoshang wǔ diǎn jiù qǐchuáng le","vi":"Tôi sáng năm giờ đã dậy rồi. (才):八点上课，他九点才起来。/Bā diǎn shàngkè, tā jiǔ diǎn cái qǐlái/ Tám giờ vào học, anh ấy chín giờ mới dậy."}]},{"id":"HSK3-029","title":"Cấu trúc với \"把\" (2)","explanation":"Diễn tả một hành động làm cho vị trí của đối tượng B bị thay đổi (A把B + Động từ +在/到/给/...).","examples":[{"zh":"我把照片放在你包里了。","pinyin":"Wǒ bǎ zhàopiàn fàng zài nǐ bāo li le","vi":"Tôi đã đặt ảnh vào trong túi của bạn rồi."},{"zh":"你帮我把这本书带给小丽。","pinyin":"Nǐ bāng wǒ bǎ zhè běn shū dài gěi Xiǎo Lì","vi":"Bạn giúp tôi mang quyển sách này cho Tiểu Lệ."}]},{"id":"HSK3-030","title":"Bổ ngữ chỉ phương hướng kép","explanation":"Bổ ngữ chỉ phương hướng kép là sự kết hợp giữa một động từ chỉ phương hướng đơn giản thứ nhất (上,下,进,出, 回,过,起) và một động từ chỉ phương hướng đơn giản thứ hai (来,去).","examples":[{"zh":"老师拿出了一本书来。","pinyin":"Lǎoshī ná chū le yī běn shū lái.","vi":"Thầy giáo lấy ra một quyển sách."},{"zh":"小狗从房间跑出来了。","pinyin":"Xiǎo gǒu cóng fángjiān pǎo chūlái le","vi":"Chú chó nhỏ chạy ra khỏi phòng."}]},{"id":"HSK3-031","title":"Cấu trúc \"一边......一边......\"","explanation":"Dùng để diễn tả hai hành động diễn ra đồng thời.","examples":[{"zh":"妈妈一边唱歌一边做饭。","pinyin":"Māmā yībiān chànggē yībiān zuòfàn","vi":"Mẹ vừa hát vừa nấu cơm."},{"zh":"我丈夫喜欢一边吃早饭一边看报纸。","pinyin":"Wǒ zhàngfu xǐhuan yībiān chī zǎofàn yībiān kàn bàozhǐ","vi":"Chồng tôi thích vừa ăn sáng vừa đọc báo."}]},{"id":"HSK3-032","title":"Cấu trúc với \"把\" (3)","explanation":"Hành động làm cho đối tượng B đạt được kết quả nào đó hoặc thay đổi vị trí (A把B + Động từ + Bổ ngữ kết quả/phương hướng).","examples":[{"zh":"我把衣服洗干净了。","pinyin":"Wǒ bǎ yīfu xǐ gānjìng le","vi":"Tôi giặt quần áo sạch sẽ rồi."},{"zh":"你把水果拿过来。","pinyin":"Nǐ bǎ shuǐguǒ ná guòlái","vi":"Bạn mang hoa quả lại đây."}]},{"id":"HSK3-033","title":"Cấu trúc \"先......, 再......,然后......\"","explanation":"Biểu thị trình tự của các hành động.","examples":[{"zh":"我先洗完澡，然后再给你回电话。","pinyin":"Wǒ xiān xǐ wán zǎo, ránhòu zài gěi nǐ huí diànhuà","vi":"Tôi đi tắm xong trước, sau đó gọi lại cho bạn."},{"zh":"你先把饭菜做好，然后再把一块新鲜的水果放进去。","pinyin":"Nǐ xiān bǎ fàncài zuò hǎo, ránhòu zài bǎ yī kuài xīnxiān de shuǐguǒ fàng jìnqù","vi":"Bạn làm xong cơm trước, sau đó đặt thêm một miếng hoa quả tươi vào."}]},{"id":"HSK3-034","title":"Cấu trúc \"除了......以外,都/还/ 也......\"","explanation":"Trừ một phần ra, những phần khác đều tương đồng (都) hoặc bổ sung thêm (还/ 也).","examples":[{"zh":"都:除了你以外，大家都听懂了。","pinyin":"Chúle nǐ yǐwài, dàjiā dōu tīng dǒng le","vi":"Trừ bạn ra, mọi người đều đã hiểu."},{"zh":"还:除了唱歌以外，他还喜欢跳舞。","pinyin":"Chúle chànggē yǐwài, tā hái xǐhuan tiàowǔ","vi":"Ngoài ca hát ra, anh ấy còn thích khiêu vũ."}]},{"id":"HSK3-035","title":"Đại từ nghi vấn dùng linh hoạt (2)","explanation":"Dùng \"什么\" thay thế cho người/sự vật không xác định, biểu đạt ý nhún nhường, lịch sự.","examples":[{"zh":"这个饭馆没有什么特别好吃的菜。","pinyin":"Zhège fànguǎn méiyǒu shénme tèbié hǎo chī de cài","vi":"Quán ăn này không có món nào đặc biệt ngon cả."},{"zh":"你写得很好，没什么问题。","pinyin":"Nǐ xiě de hěn hǎo, méi shénme wèntí","vi":"Bạn viết rất tốt, không có vấn đề gì."}]},{"id":"HSK3-036","title":"Cách biểu đạt mức độ: \"极了\" /jí le/","explanation":"极了\" là một từ bổ nghĩa mức độ, đặt sau tính từ hoặc động từ chỉ trạng thái tâm lý, dùng để nhấn mạnh mức độ rất cao.","examples":[{"zh":"我的小狗可爱极了。","pinyin":"Wǒ de xiǎo gǒu kě'ài jíle","vi":"Chú chó nhỏ của tôi đáng yêu vô cùng."},{"zh":"他满意极了。","pinyin":"Tā mǎnyì jíle","vi":"Anh ấy cực kỳ hài lòng."}]},{"id":"HSK3-037","title":"Cấu trúc điều kiện: \"如果......(的话), (chủ ngữ) 就......\"","explanation":"\"如果\" làgiả thiết, \"就\" là kết quả sẽ xảy ra trong điều kiện đó.","examples":[{"zh":"如果你太累了，就休息一会儿。","pinyin":"Rúguǒ nǐ tài lèi le, jiù xiūxí yīhuìr","vi":"Nếu bạn quá mệt rồi, thì nghỉ ngơi một lát đi."},{"zh":"如果你喜欢，我就给你买。","pinyin":"Rúguǒ nǐ xǐhuan, wǒ jiù gěi nǐ mǎi","vi":"Nếu bạn thích, tôi sẽ mua cho bạn."}]},{"id":"HSK3-038","title":"Bổ ngữ trạng thái phức hợp","explanation":"Dùng \"得\" /de/ nối động từ/tính từ với cụm bổ ngữ trạng thái, miêu tả trạng thái/mức độ.","examples":[{"zh":"孩子们玩儿得不想回家。","pinyin":"Háizimen wánr de bù xiǎng huí jiā","vi":"Các con chơi đến mức không muốn về nhà."},{"zh":"他们忙得没有时间跟别人见面。","pinyin":"Tāmen máng de méiyǒu shíjiān gēn biérén jiànmiàn","vi":"Họ bận đến mức không có thời gian gặp ai."}]},{"id":"HSK3-039","title":"Điệp âm tính từ đơn âm tiết (Hình thức \"AA的\")","explanation":"Dùng để miêu tả đặc điểm của người hoặc sự vật.","examples":[{"zh":"你送的红红的花，我很喜欢。","pinyin":"Nǐ sòng de hónghóng de huā, wǒ hěn xǐhuan","vi":"Bó hoa đỏ tươi bạn tặng, tôi rất thích."},{"zh":"你女儿长得白白的，胖胖的，真可爱。","pinyin":"Nǐ nǚ'ér zhǎng de báibái de, pàngpàng de, zhēn kě'ài","vi":"Con gái bạn trắng trẻo, mũm mĩm, thật đáng yêu"}]},{"id":"HSK3-040","title":"Điệp âm động từ hai âm tiết (Hình thức \"ABAB\")","explanation":"Biểu đạt hành động xảy ra trong thời gian ngắn, hoặc mang ý thử.","examples":[{"zh":"他是新的，有时间你帮助帮助他吧。","pinyin":"Tā shì xīn de, yǒu shíjiān nǐ bāngzhù bāngzhù tā ba","vi":"Anh ấy là người mới, có thời gian bạn giúp đỡ anh ấy một chút đi."},{"zh":"我真应该多锻炼锻炼了。","pinyin":"Wǒ zhēn yīnggāi duō duànliàn duànliàn le","vi":"Tôi thật sự nên tập thể dục nhiều hơn một chút."}]},{"id":"HSK3-041","title":"Đại từ nghi vấn dùng linh hoạt (3)","explanation":"Thay thế cho một phạm vi rộng, biểu thị mọi đối tượng đều có tình huống tương đồng.","examples":[{"zh":"谁都喜欢小丽。","pinyin":"Shéi dōu xǐhuan Xiǎo Lì.","vi":"Ai cũng thích Tiểu Lệ."},{"zh":"我们怎么去公园都可以。","pinyin":"Wǒmen zěnme qù gōngyuán dōu kěyǐ","vi":"Chúng ta đi công viên bằng cách nào cũng được."}]},{"id":"HSK3-042","title":"Cấu trúc điều kiện: \"只要......, 就......\"","explanation":"\"只要\" là điều kiện cần. \"就\" là kết quả sẽ xảy ra trong điều kiện đó.","examples":[{"zh":"只要我有时间，就一定跟你去旅游。","pinyin":"Zhǐyào wǒ yǒu shíjiān, jiù yīdìng gēn nǐ qù lǚyóu","vi":"Chỉ cần tôi có thời gian, nhất định sẽ đi du lịch với bạn."},{"zh":"只要你给我钱，我就能照顾好它。","pinyin":"Zhǐyào nǐ gěi wǒ qián, wǒ jiù néng zhàogù hǎo tā","vi":"Chỉ cần bạn đưa tiền cho tôi, tôi sẽ chăm sóc nó tốt."}]},{"id":"HSK3-043","title":"Giới từ \"关于\" /guānyú/","explanation":"Giới thiệu đối tượng mà người nói muốn đề cập.","examples":[{"zh":"我最近看了一些关于中国文化的电影。","pinyin":"Wǒ zuìjìn kàn le yīxiē guānyú Zhōngguó wénhuà de diànyǐng","vi":"Gần đây tôi xem một vài bộ phim về văn hóa Trung Quốc."},{"zh":"关于这个工作，还有什么问题吗？","pinyin":"Guānyú zhège gōngzuò, hái yǒu shénme wèntí ma","vi":"Về công việc này, còn có vấn đề gì không?"}]},{"id":"HSK3-044","title":"Mở rộng ý nghĩa của bổ ngữ chỉ phương hướng","explanation":"\"出来\" có thể biểu thị từ không có gì đến có gì, phát sinh sự vật, sự việc mới, hoặc sự phân biệt, nhận ra. \"起来\" biểu thị sự bắt đầu (hành động/trạng thái), hoặc hồi tưởng/nhớ lại.","examples":[{"zh":"(出来):照片我选了几张洗出来了。","pinyin":"Zhàopiàn wǒ xuǎn le jǐ zhāng xǐ chūlái le","vi":"Ảnh tôi chọn đã rửa ra mấy tấm rồi. (起来):你能想起来那是什么时候的事吗？/Nǐ néng xiǎng qǐlái nà shì shénme shíhòu de shì ma/ Bạn có thể nhớ lại chuyện đó là lúc nào không?"}]},{"id":"HSK3-045","title":"Dùng \"使\" /shǐ/, \" 叫\" /jiào/, \"让\" /ràng/","explanation":"Đều dùng để biểu thị ý khiến/mệnh lệnh. \"使\" (văn viết), \"叫/让\" (khẩu ngữ).","examples":[{"zh":"(使):读书使我快乐。","pinyin":"Dúshū shǐ wǒ kuàilè","vi":"Đọc sách khiến tôi vui vẻ. (让):考试让我很紧张。/Kǎoshì ràng wǒ hěn jǐnzhāng/ Kỳ thi khiến tôi rất hồi hộp."}]},{"id":"HSK3-046","title":"Câu bị động với \" 被\" /bèi/","explanation":"Dùng để diễn tả ý bị động. Chủ ngữ là đối tượng chịu tác động.","examples":[{"zh":"我的自行车被偷了。","pinyin":"Wǒ de zìxíngchē bèi tōu le","vi":"Xe đạp của tôi bị trộm rồi."},{"zh":"我被朋友影响了。","pinyin":"Wǒ bèi péngyou yǐngxiǎng le","vi":"Tôi bị bạn bè ảnh hưởng."}]},{"id":"HSK3-047","title":"Cấu trúc \"只......, 才......\"","explanation":"\"只\" là điều kiện. \"才\" là kết quả xuất hiện trong điều kiện này.","examples":[{"zh":"只有写完作业，才能看电视。","pinyin":"Zhǐyǒu xiě wán zuòyè, cái néng kàn diànshì","vi":"Chỉ khi làm xong bài tập, mới có thể xem TV."},{"zh":"看起来只有爱，才能让人有变化。","pinyin":"Kàn qǐlái zhǐyǒu ài, cái néng ràng rén yǒu biànhuà","vi":"Có vẻ chỉ có tình yêu, mới có thể khiến người ta thay đổi."}]}],"exam_focus":[{"category":"Thời - trạng thái hành động","points":["Trợ từ了(hoàn thành & thay đổi)","Cấu trúc在……呢","Cấu trúc正在……"],"reason":"HSK 3 kiểm tra khả năng phân biệt hành động đang diễn ra – đã hoàn thành - sự thay đổi trạng thái, đặc biệt trong phần Nghe và Đọc hiểu."},{"category":"Trình tự & logic hành động","points":["先……再……然后……","……了就……"],"reason":"Các cấu trúc này giúp đánh giá khả năng tổ chức trình tự sự việc, thường xuất hiện trong câu dài và hội thoại tình huống."},{"category":"Động từ năng nguyện (mở rộng)","points":["会(khả năng/dự đoán)","能(điều kiện cho phép)","应该(khuyên nhủ, nghĩa vụ)"],"reason":"Đề thi HSK 3 chú trọng khả năng diễn đạt ý định, phán đoán và lời khuyên, phản ánh mức độ giao tiếp thực tế cao hơn HSK 1-2."},{"category":"Cấu trúc so sánh","points":["A跟B一样+ tính từ","A比B + tính từ (+一点儿/多了)"],"reason":"So sánh là dạng ngữ pháp xuất hiện rất thường xuyên trong phần Đọc hiểu và Hoàn thành câu."},{"category":"Diễn tả mức độ và xu hướng","points":["越来越+ tính từ/động từ","又……又……","极了"],"reason":"Giúp người học thể hiện mức độ, sự thay đổi và cảm xúc, là tiêu chí quan trọng của HSK 3."},{"category":"Bổ ngữ","points":["Bổ ngữ kết quả (好、完、对、错…)","Bổ ngữ khả năng (得/不)"],"reason":"HSK 3 bắt đầu kiểm tra sâu khả năng kết hợp động từ + bổ ngữ, nền tảng cho HSK 4 trở lên."},{"category":"Cấu trúc với “把” (cơ bản)","points":["把+ tân ngữ + động từ + kết","quả/phương hướng"],"reason":"Cấu trúc “把” xuất hiện ở mức nhập môn trong HSK 3, thường dùng để kiểm tra nhận diện cấu trúc câu."},{"category":"Câu điều kiện","points":["如果……就……","只要……就……"],"reason":"Thường xuất hiện trong phần Đọc hiểu, đánh giá khả năng hiểu mối quan hệ điều kiện – kết quả."},{"category":"Đại từ nghi vấn dùng linh hoạt","points":["什么/哪儿/怎么+都/就"],"reason":"HSK 3 yêu cầu người học hiểu đại từ nghi vấn không chỉ dùng để hỏi, mà còn để biểu đạt ý khái quát."},{"category":"Diễn tả thời gian và số lượng ước lượng","points":["……了+ khoảng thời gian +了","左右/二三/三四"],"reason":"Đề thi thường lồng vào bối cảnh sinh hoạt thực tế như học tập, làm việc, sinh hoạt hằng ngày."}]},{"level":4,"name":"HSK 4","grammar_count":87,"grammar":[{"id":"HSK4-001","title":"不仅…而且/还… /bùjǐn… érqiě/hái…/","explanation":"Liên từ, liên kết hai vế câu có mối quan hệ tăng tiến, biểu thị \"không những... mà còn...\".","examples":[{"zh":"不仅是足球踢得好，而且他也非常热情.","pinyin":"Bùjǐn shì zúqiú tī de hǎo, érqiě tā yě fēicháng rèqíng","vi":"Không chỉ đá bóng giỏi, mà anh ấy còn rất nhiệt tình."}]},{"id":"HSK4-002","title":"从来/cónglái/","explanation":"Phó từ, biểu thị từ trước đến nay đều là như vậy, thường dùng trong câu phủ định.","examples":[{"zh":"我从来没去过日本。","pinyin":"Wǒ cónglái méi qù guo Rìběn","vi":"Tôi chưa từng đi Nhật Bản bao giờ."}]},{"id":"HSK4-003","title":"刚/刚才 /gāng/gāngcái/","explanation":"Phó từ刚chỉ hành động xảy ra cách đây không lâu;刚才là danh từ chỉ thời gian ngắn trong quá khứ, có thể đứng trước chủ ngữ hoặc sau chủ ngữ và trước động từ,.","examples":[{"zh":"刚才:我刚才去洗手间了，你给我打电话了","pinyin":"Wǒ gāngcái qù xǐshǒujiān le, nǐ gěi wǒ dǎ diànhuà le","vi":"Tôi vừa mới đi vệ sinh, bạn đã gọi điện cho tôi sao"},{"zh":"刚:他刚来一会儿.","pinyin":"Tā gāng lái yīhuìr","vi":"Anh ấy vừa mới đến một lát."}]},{"id":"HSK4-004","title":"即使…也… /jíshǐ… yě…/","explanation":"Liên từ, biểu thị một sự giả định hoặc tình huống đã xảy ra (dù cho, cho dù), kết quả vẫn không thay đổi.","examples":[{"zh":"即使明天下雨，我们也要去爬山。","pinyin":"Jíshǐ míngtiān xià yǔ, wǒmen yě yào qù páshān","vi":"Cho dù ngày mai trời mưa, chúng tôi vẫn sẽ đi leo núi."}]},{"id":"HSK4-005","title":"(在)…上/zài)… shàng/","explanation":"Danh từ chỉ phương vị, dùng sau danh từ, biểu thị trên bề mặt vật thể hoặc chỉ phạm vi nào đó.","examples":[{"zh":"今天的工作上有很多问题.","pinyin":"Jīntiān de gōngzuò shàng yǒu hěnduō wèntí","vi":"Hôm nay có nhiều vấn đề về công việc."}]},{"id":"HSK4-006","title":"正好/zhènghǎo/","explanation":"Hình dung từ (biểu thị vừa vặn, vừa khéo) Phó từ (biểu thị sự việc xảy ra đúng lúc, đúng thời điểm).","examples":[{"zh":"我妹妹出生那天，正好下雪，所以爸妈叫她“小雪”.","pinyin":"Wǒ mèimei chūshēng nà tiān, zhènghǎo xià xuě, suǒyǐ bà mā jiào tā \"Xiǎoxuě\"","vi":"Em gái tôi sinh ra ngày hôm đó, vừa đúng lúc tuyết rơi, nên bố mẹ đặt tên nó là \"Tiểu Tuyết\"."},{"zh":"我的冰箱太旧了，正好商场在打折，我们便买一台吧.","pinyin":"Wǒ de bīngxiāng tài jiù le, zhènghǎo shāngchǎng zài dǎzhé, wǒmen biàn mǎi yī tái ba","vi":"Tủ lạnh nhà tôi cũ quá rồi, vừa hay trung tâm thương mại đang giảm giá, chúng ta mua một cái đi."}]},{"id":"HSK4-007","title":"差不多/几乎 /chàbùduō/jīhū/","explanation":"Phó từ/Hình dung từ: biểu thị, mức độ không khác biệt nhiều gần như, xấp xỉ","examples":[{"zh":"他俩差不多高.","pinyin":"Tā liǎng chàbùduō gāo","vi":"Hai người họ gần như cao bằng nhau."}]},{"id":"HSK4-008","title":"尽管/jǐnguǎn/","explanation":"Liên từ, biểu thị dù cho, mặc dù (sự việc đã xảy ra, nhưng kết quả/tình huống vế sau lại bất ngờ hoặc chuyển ý).","examples":[{"zh":"尽管这是一场误会，他仍然不开心","pinyin":"Jǐnguǎn zhè shì yī chǎng wùhuì, tā réngráng bù kāixīn","vi":"Mặc dù đây là một sự hiểu lầm, anh ấy vẫn không vui."}]},{"id":"HSK4-009","title":"却/què/","explanation":"Phó từ, dùng sau chủ ngữ hoặc trước động từ, biểu thị chuyển ý (nhưng mà, trái lại), ngữ khí nhẹ nhàng hơn \"但是 \",.","examples":[{"zh":"很多人虽然住在一个楼里，但却从来没说过话","pinyin":"Hěn duō rén suīrán zhù zài yī gè lóu lǐ, dàn què cónglái méi shuō guò huà","vi":"Rất nhiều người dù sống cùng một tòa nhà, nhưng lại chưa từng nói chuyện với nhau."}]},{"id":"HSK4-010","title":"而/ér/","explanation":"Liên từ, dùng để nối hai vế câu, biểu thị tăng tiến hoặc chuyển ý/tương phản,.","examples":[{"zh":"即使没有人支持我，我也会继续做下去。","pinyin":"Jíshǐ méiyǒu rén zhīchí wǒ, wǒ yě huì jìxù zuò xiàqù","vi":"Ngay cả khi không có ai ủng hộ tôi, tôi cũng sẽ tiếp tục làm."}]},{"id":"HSK4-011","title":"挺…的/tǐng… de/","explanation":"Dùng để biểu thị mức độ khá / tương đối /rất, mang sắc thái nhẹ nhàng, tự nhiên trong giao tiếp. Thường dùng trong cấu trúc “挺+ tính từ +的” để nhận xét hoặc đánh giá một sự việc, người hay trạng thái.","examples":[{"zh":"昨天晚上去的那家饭馆味道挺好的","pinyin":"Zuótiān wǎnshàng qù de nà jiā fànguǎn wèidào tǐng hǎo de","vi":"Quán ăn tối qua tôi đến khá ngon."}]},{"id":"HSK4-012","title":"本来/běnlái/","explanation":"Phó từ dùng để nói về trạng thái, sự việc ban đầu hoặc theo lẽ thường, trước khi có sự thay đổi xảy ra.","examples":[{"zh":"这件事情本来应该听他的","pinyin":"Zhè jiàn shìqing běnlái yīnggāi tīng tā de","vi":"Việc này vốn dĩ nên nghe lời anh ấy."}]},{"id":"HSK4-013","title":"另外/lìngwài/","explanation":"Đại từ (chỉ người/vật ngoài phạm vi đã đề cập) Phó từ (chỉ ngoài phạm vi đã đề cập) Liên từ (ngoài ra).","examples":[{"zh":"这本书不好看，我们看另外的吧。","pinyin":"Zhè běn shū bù hǎokàn, wǒmen kàn lìngwài de ba","vi":"Cuốn sách này không hay, chúng ta xem cuốn khác đi."},{"zh":"工资之外，公司会另外发一笔奖金。","pinyin":"Gōngzī zhī wài, gōngsī huì lìngwài fā yī bǐ jiǎngjīn","vi":"Ngoài lương ra, công ty sẽ phát thêm một khoản tiền thưởng."},{"zh":"这家餐厅菜很好吃，另外，环境也很不错。","pinyin":"Zhè jiā cāntīng cài hěn hǎo chī, lìngwài, huánjìng yě hěn bùcuò","vi":"Nhà hàng này đồ ăn rất ngon, thêm vào đó, không gian cũng rất tuyệt."}]},{"id":"HSK4-014","title":"首先…其次… /shǒuxiān… qícì…/","explanation":"Dùng trong văn viết, biểu thị trình tự (trước hết, sau đó).","examples":[{"zh":"不管以后做什么工作，你首先应该有一个好身体","pinyin":"Bùguǎn yǐhòu zuò shénme gōngzuò, nǐ shǒuxiān yīnggāi yǒu yī gè hǎo shēntǐ","vi":"Dù sau này làm công việc gì, bạn trước hết nên có một sức khỏe tốt."}]},{"id":"HSK4-015","title":"不管/bùguǎn/","explanation":"Liên từ, biểu thị trong bất kỳ tình huống nào (không quan tâm đến), thường dùng với “还/或是” hoặc các đại từ nghi vấn.","examples":[{"zh":"山东不管做什么事都非常认真.","pinyin":"Tóngxué bùguǎn zuò shénme shì dōu fēicháng rènzhēn","vi":"Tiểu Vương bất kể làm việc gì cũng rất nghiêm túc."}]},{"id":"HSK4-016","title":"以为/yǐwéi/","explanation":"Dùng để diễn tả người nói nghĩ hoặc tin rằng một sự việc là đúng, nhưng thực tế lại không đúng như vậy.","examples":[{"zh":"我以为今天的会议室里一个人都没有","pinyin":"Wǒ yǐwéi jīntiān de huìyì shì lǐ yī gè rén dōu méi yǒu","vi":"Tôi tưởng rằng trong phòng họp hôm nay không có một người nào."}]},{"id":"HSK4-017","title":"原来/yuánlái/","explanation":"thể hiện sự phát hiện, nhận ra sự thật (với ngữ khí ngạc nhiên) hoặc chỉ trạng thái ban đầu, nguyên gốc của sự vật. Có thể dùng như phó từ hoặc hình dung từ (tính từ).","examples":[{"zh":"原来是你！我还以为是小王呢。","pinyin":"Yuánlái shì nǐ! Wǒ hái yǐwéi shì Xiǎo Wáng ne","vi":"Thì ra là bạn! Tôi cứ tưởng là Tiểu Vương."},{"zh":"我们还是按原来的计划进行吧。","pinyin":"Wǒmen háishì àn yuánlái de jìhuà jìnxíng ba","vi":"Chúng ta vẫn cứ theo kế hoạch ban đầu mà tiến hành đi."}]},{"id":"HSK4-018","title":"并/bìng/","explanation":"Phó từ, dùng trước phủ định (不/没 (有)/无), có tác dụng nhấn mạnh ngữ khí phủ định,.","examples":[{"zh":"我以为做生意很简单，后来才发现其实并不容易","pinyin":"Wǒ yǐwéi zuò shēngyi hěn jiǎndān, hòulái cái fāxiàn qíshí bìng bù róngyì","vi":"Tôi tưởng kinh doanh rất đơn giản, sau này mới phát hiện ra thực ra hoàn toàn không dễ dàng."}]},{"id":"HSK4-019","title":"按照/ànzhào/","explanation":"Giới từ: theo, căn cứ vào.","examples":[{"zh":"按照经验，这个问题应该很快解决，请大家放心","pinyin":"Ànzhào jīngyàn, zhège wèntí yīnggāi hěn kuài jiějué, qǐng dàjiā fàngxīn","vi":"Theo kinh nghiệm, vấn đề này nên sớm được giải quyết, mọi người yên tâm."}]},{"id":"HSK4-020","title":"甚至/shènzhì/","explanation":"Phó từ, nhấn mạnh trường hợp cực đoan hoặc là cuối cùng (thậm chí).","examples":[{"zh":"这个房子离公司也不远，你可以坐公共汽车甚至可以骑自行车上班","pinyin":"Zhège fángzi lí gōngsī yě bù yuǎn, nǐ kěyǐ zuò gōnggòng qìchē shènzhì kěyǐ qí zìxíngchē shàngbān","vi":"Căn nhà này cách công ty không xa, bạn có thể đi xe buýt thậm chí có thể đạp xe đi làm."}]},{"id":"HSK4-021","title":"肯定/kěndìng/","explanation":"Phó từ: biểu thị mức độ chắc chắn cao, khẳng định rằng một việc nhất định sẽ xảy ra hoặc là đúng. Hình dung từ: thể hiện sự khẳng định, đồng ý hoặc xác nhận đối với một ý kiến hay sự việc.","examples":[{"zh":"你放心吧，我肯定按时到。","pinyin":"Nǐ fàngxīn ba, wǒ kěndìng ànshí dào","vi":"Bạn yên tâm đi, tôi nhất định sẽ đến đúng giờ."},{"zh":"请给我一个肯定的答复，是“去”还是“不去","pinyin":"Qǐng gěi wǒ yī gè kěndìng de dáfù, shì “qù” háishì “bù qù”","vi":"Hãy cho tôi một câu trả lời dứt khoát/rõ ràng, là \"đi\" hay \"không đi\"?"}]},{"id":"HSK4-022","title":"再说/zàishuō/","explanation":"Động từ: Gác lại Liên từ (biểu thị bổ sung thêm sự việc).","examples":[{"zh":"这个问题再说吧，我们先讨论紧急的。","pinyin":"Zhège wèntí xiān zàishuō ba, wǒmen xiān tǎo lùn jǐn jí de","vi":"Vấn đề này gác lại đã, chúng ta hãy thảo luận việc khẩn cấp trước."},{"zh":"现在下着大雨，再说你又没带伞，就别出去了。","pinyin":"Xiànzài xià zhe dàyǔ, zàishuō nǐ yòu méi dài sǎn, jiù bié chū qù le","vi":"Bây giờ trời đang mưa to, hơn nữa bạn lại không mang ô, đừng đi ra ngoài nữa."}]},{"id":"HSK4-023","title":"实际/实际上 /shíjì/shíjìshang/","explanation":"Danh từ (thực tế) Hình dung từ (chân thật) Phó từ (trên thực tế),.","examples":[{"zh":"理论要结合实际。","pinyin":"Lǐlùn yào jiéhé shíjì","vi":"Lý thuyết phải kết hợp với thực tế."},{"zh":"请告诉我你的实际年龄。","pinyin":"Qǐng gàosu wǒ nǐ de shíjì niánlíng","vi":"Hãy cho tôi biết tuổi thật của bạn."},{"zh":"他说自己很忙，实际上他只是在玩游戏。","pinyin":"Tā shuō zìjǐ hěn máng, shíjìshang tā zhǐshì zài wán yóuxì","vi":"Anh ấy nói mình rất bận, nhưng thực ra/thực tế anh ấy chỉ đang chơi game."}]},{"id":"HSK4-024","title":"对…来说/duì… láishuō/","explanation":"Giới từ, biểu thị thái độ đối với một đối tượng nào đó.","examples":[{"zh":"对一个女人来说，漂亮、聪明都很重要，但其实更重要的是快乐.","pinyin":"Duì yī gè nǚrén láishuō, piàoliang, cōngmíng dōu hěn zhòngyào, dàn qíshí gèng zhòngyào de shì kuàilè","vi":"Đối với một người phụ nữ mà nói, xinh đẹp, thông minh đều quan trọng, nhưng thực ra quan trọng hơn là niềm vui."}]},{"id":"HSK4-025","title":"尤其/yóuqí/","explanation":"Phó từ dùng để nhấn mạnh, biểu thị mức độ hoặc tính chất của một sự việc/sự vật cao hơn, đặc biệt hơn những cái khác trong cùng một phạm trù.","examples":[{"zh":"你女儿真可爱，长得真像你，尤其是眼睛","pinyin":"Nǐ nǚ'ér zhēn kě'ài, zhǎng de zhēn xiàng nǐ, yóuqí shì yǎnjīng","vi":"Con gái bạn thật đáng yêu, lớn lên rất giống bạn, đặc biệt là đôi mắt."}]},{"id":"HSK4-026","title":"竟然/jìngrán/","explanation":"phó từ cảm thán, dùng để biểu thị sự việc xảy ra trái với dự đoán, lẽ thường hoặc ngoài ý muốn,","examples":[{"zh":"他三年没练钢琴，竟然弹得还这么好。","pinyin":"Tā sān nián méi liàn gāngqín, jìngrán tán de hái zhème hǎo","vi":"Anh ấy ba năm không luyện piano, không ngờ vẫn chơi hay đến thế."}]},{"id":"HSK4-027","title":"倍(bèi)","explanation":"lượng từ, dùng để biểu thị số lần (bội số) khi so sánh về số lượng, mức độ hoặc kích thước","examples":[{"zh":"我的工资比五年前高了五倍。","pinyin":"Wǒ de gōngzī bǐ wǔ nián qián gāo le wǔ bèi","vi":"Lương của tôi cao gấp năm lần (so với) năm năm trước."}]},{"id":"HSK4-028","title":"值得/zhíde/","explanation":"động từ, biểu thị việc gì đó có giá trị, xứng đáng, đáng (để bỏ công sức, thời gian, tiền bạc...).","examples":[{"zh":"这本书很值得一读。","pinyin":"Zhè běn shū hěn zhíde yì dú","vi":"Cuốn sách này rất đáng đọc."}]},{"id":"HSK4-029","title":"其中/qízhōng/","explanation":"danh từ (đôi khi được phân loại là cụm từ chỉ định), có nghĩa là trong số đó, trong đó, bên trong đó.","examples":[{"zh":"我们班有二十名学生，其中十名是女生。","pinyin":"Wǒmen bān yǒu èrshí míng xuéshēng, qízhōng shí míng shì nǚshēng","vi":"Lớp chúng tôi có 20 học sinh, trong đó có 10 bạn là nữ."}]},{"id":"HSK4-030","title":"(在)…下((zài)… xià)","explanation":"Cấu trúc giới từ/danh từ, biểu thị điều kiện, tình huống cho một sự việc xảy ra.","examples":[{"zh":"在老师和同学们的帮助下，他的汉语提高得非常快","pinyin":"Zài lǎoshī hé tóngxuémen de bāngzhù xià, tā de Hànyǔ tígāo de fēicháng kuài","vi":"Dưới sự giúp đỡ của thầy cô và các bạn, tiếng Hán của anh ấy tiến bộ rất nhanh"}]},{"id":"HSK4-031","title":"估计/gūjì/","explanation":"Động từ (biểu thị đoán, phán đoán) Danh từ (biểu thị sự ước tính, phỏng chừng).","examples":[{"zh":"你估计这个项目多久能完成？","pinyin":"Nǐ gūjì zhège xiàngmù duōjiǔ néng wánchéng","vi":"Bạn ước tính dự án này bao lâu thì hoàn thành?"},{"zh":"根据市场估计，这款产品的需求量很大。","pinyin":"Gēnjù shìchǎng gūjì, zhè kuǎn chǎnpǐn de xūqiú liàng hěn dà","vi":"Theo ước tính của thị trường, nhu cầu cho sản phẩm này rất lớn."}]},{"id":"HSK4-032","title":"来不及/láibují/","explanation":"bổ ngữ khả năng có nghĩa không kịp, không còn đủ thời gian để làm việc gì đó.","examples":[{"zh":"事情发生得太突然，我来不及通知你。","pinyin":"Shìqing fāshēng de tài tūrán, wǒ láibují tōngzhī nǐ","vi":"Sự việc xảy ra quá đột ngột, tôi không kịp báo cho bạn."}]},{"id":"HSK4-033","title":"离合词重叠 /líhécí chóngdié/","explanation":"Cấu trúc lặp lại của động từ ly hợp (thường là dạng AAB), biểu thị thời gian ngắn, thử nghiệm, hoặc thư giãn.","examples":[{"zh":"学习累了，我们出去散散步吧。","pinyin":"Xuéxí lèi le, wǒmen chūqù sàn san bù ba","vi":"Học mệt rồi, chúng ta ra ngoài đi dạo một chút đi."}]},{"id":"HSK4-034","title":"要是/yàoshi/","explanation":"Liên từ dùng để giả định một điều kiện. Cấu trúc cơ bản: “要是” + [tình huống giả định]，就+ [kết quả/hành động sẽ xảy ra].","examples":[{"zh":"要是明天下雨，我们就不去公园了。","pinyin":"Yàoshi míngtiān xià yǔ, wǒmen jiù bù qù gōngyuán le","vi":"Nếu ngày mai trời mưa, thì chúng tôi sẽ không đi công viên nữa."}]},{"id":"HSK4-035","title":"既…又/也/还… (jì… yòu/yě/hái…)","explanation":"Liệt kê hai (hoặc nhiều) đặc điểm, tính chất hoặc trạng thái cùng tồn tại về một sự vật, sự việc. Cấu trúc: 既+ [Tính chất 1] +又/也/还+ [Tính chất 2]","examples":[{"zh":"她既聪明又漂亮。","pinyin":"Tā jì cōngmíng yòu piàoliang","vi":"Cô ấy vừa thông minh vừa xinh đẹp."}]},{"id":"HSK4-036","title":"使/shǐ/","explanation":"Động từ cầu khiến, làm cho / khiến cho một ai/cái gì thay đổi trạng thái hoặc thực hiện một hành động. Cấu trúc phổ biến: A +使+ B + [hành động/thay đổi]","examples":[{"zh":"这个消息使大家很高兴。","pinyin":"Zhège xiāoxi shǐ dàjiā hěn gāoxìng","vi":"Tin tức này khiến mọi người rất vui."}]},{"id":"HSK4-037","title":"只要…就… /zhǐyào… jiù…/","explanation":"Là cặp liên từ biểu thị điều kiện cần, chỉ cần thỏa mãn một điều kiện duy nhất/tối thiểu đó thì kết quả chắc chắn xảy ra. Công thức cơ bản: 只要+ [Điều kiện cần],就+ [Kết quả/Động tác sẽ xảy ra]","examples":[{"zh":"你只要想去，我就带你去。","pinyin":"Nǐ zhǐyào xiǎng qù, wǒ jiù dài nǐ qù","vi":"Chỉ cần bạn muốn đi, thì tôi sẽ đưa bạn đi."}]},{"id":"HSK4-038","title":"可不是/kě bú shì/","explanation":"Phó từ, biểu thị tán thành hoặc phụ họa ý kiến của người khác.","examples":[{"zh":"这个电影可不是很好看吗？我都看了三遍了。","pinyin":"Zhège diànyǐng kě bú shì hěn hǎokàn ma? Wǒ dōu kànle sān biàn le","vi":"Chẳng phải là bộ phim này rất hay sao? Tôi xem đến ba lần rồi."}]},{"id":"HSK4-039","title":"因此/yīncǐ/","explanation":"Liên từ, biểu thị nguyên nhân, vì vậy.","examples":[{"zh":"做好小事是完成大事的第一步，因此，件件小事都应该被看成是一次学习的机会.","pinyin":"Zuò hǎo xiǎo shì shì wánchéng dà shì de dì yī bù, yīncǐ, jiànjiàn xiǎo shì dōu yīnggāi bèi kànchéng shì yī cì xuéxí de jīhuì","vi":"Làm tốt việc nhỏ là bước đầu tiên để hoàn thành việc lớn, vì thế, mỗi việc nhỏ nên được xem là cơ hội học tập."}]},{"id":"HSK4-040","title":"往往/wǎngwǎng/","explanation":"Phó từ, biểu thị kinh nghiệm trong quá khứ, thường xảy ra trong một điều kiện nhất định.","examples":[{"zh":"他往往工作到深夜。","pinyin":"Tā wǎngwǎng gōngzuò dào shēnyè","vi":"Anh ấy thường làm việc đến tận khuya."}]},{"id":"HSK4-041","title":"难道/nándào/","explanation":"Phó từ, dùng trong câu hỏi, biểu thị ngữ khí nghi vấn nhấn mạnh (chẳng lẽ).","examples":[{"zh":"难道你花了好几个小时才做完这个题.","pinyin":"Nándào nǐ huā le jǐ ge xiǎoshí cái zuò wán zhège tí","vi":"Chẳng lẽ bạn đã mất mấy tiếng đồng hồ mới làm xong câu này."}]},{"id":"HSK4-042","title":"通过/tōngguò/","explanation":"Giới từ: chỉ cách thức hoặc phương tiện để đạt được mục đích (thông qua, bằng cách). Động từ: chỉ hành động đi qua một nơi hay một không gian.","examples":[{"zh":"通过努力，任何困难都会解决.","pinyin":"Tōngguò nǔlì, rènhé kùnnan dōu huì jiějué","vi":"Thông qua nỗ lực, bất kỳ khó khăn nào cũng sẽ được giải quyết."},{"zh":"这条街只能通过.","pinyin":"Zhè tiáo jiē zhǐ néng tōngguò","vi":"Con phố này chỉ có thể đi qua."}]},{"id":"HSK4-043","title":"可是/kěshì/","explanation":"Liên từ, dùng ở đầu vế câu sau, biểu thị chuyển ý, tương phản (nhưng mà).","examples":[{"zh":"我本来想当律师，可是后来我发现自己对新闻更感兴趣.","pinyin":"Wǒ běnlái xiǎng dāng lǜshī, kěshì hòulái wǒ fāxiàn zìjǐ duì xīnwén gèng gǎnxìngqù","vi":"Tôi vốn định làm luật sư, nhưng sau này tôi phát hiện bản thân lại hứng thú hơn với báo chí."}]},{"id":"HSK4-044","title":"结果/jiéguǒ/","explanation":"Danh từ: Kết quả, hậu quả, thành quả cuối cùng. Liên từ: Cuối cùng, rốt cuộc, kết cục là. Dùng để nối hai phân câu, vế sau là kết quả/ tình huống cuối cùng xảy ra (thường có chút bất ngờ hoặc khác với dự tính ban đầu).","examples":[{"zh":"比赛的结果将在晚上八点公布。","pinyin":"Bǐsài de jiéguǒ jiāng zài wǎnshang bā diǎn gōngbù.","vi":"Kết quả của trận đấu sẽ được công bố lúc 8 giờ tối."},{"zh":"我们找了半天钥匙，结果发现它就在口袋里。","pinyin":"Wǒmen zhǎo le bàntiān yàoshi, jiéguǒ fāxiàn tā jiù zài kǒudài lǐ.","vi":"Chúng tôi tìm chìa khóa mãi, rốt cuộc phát hiện nó nằm ngay trong túi."}]},{"id":"HSK4-045","title":"确实/quèshí/","explanation":"Phó từ, biểu thị khách quan và khẳng định (quả thực, thật sự).","examples":[{"zh":"确实，这个方案更节省成本。","pinyin":"Quèshí, zhège fāng'àn gèng jiéshěng chéngběn","vi":"Quả thực, phương án này tiết kiệm chi phí hơn."}]},{"id":"HSK4-046","title":"在…看来/zài… kànlái/","explanation":"Thành ngữ chêm xen, biểu thị quan điểm, cách nhìn cá nhân.","examples":[{"zh":"在很多人看来，听流行音乐是年轻人的爱好.","pinyin":"Zài hěn duō rén kànlái, tīng liúxíng yīnyuè shì niánqīng rén de àihǎo","vi":"Theo quan điểm của nhiều người, nghe nhạc pop là sở thích của người trẻ."}]},{"id":"HSK4-047","title":"由于/yóuyú/","explanation":"Liên từ/Giới từ, biểu thị nguyên nhân, bởi vì,.","examples":[{"zh":"由于各种原因，我们不得不改变原来的计划.","pinyin":"Yóuyú gèzhǒng yuányīn, wǒmen bù dé bù gǎibiàn yuánlái de jìhuà","vi":"Do nhiều nguyên nhân khác nhau, chúng tôi buộc phải thay đổi kế hoạch ban đầu."}]},{"id":"HSK4-048","title":"连…也/都… /lián… yě/dōu…/","explanation":"Liên từ, dùng để nhấn mạnh một trường hợp (ngay cả... cũng/còn...).","examples":[{"zh":"如果你连自己都不喜欢，又怎么能让别人喜欢你呢?","pinyin":"Rúguǒ nǐ lián zìjǐ dōu bù xǐhuān, yòu zěnme néng ràng biérén xǐhuān nǐ ne","vi":"Nếu bạn ngay cả bản thân mình còn không thích, làm sao có thể khiến người khác thích bạn?"}]},{"id":"HSK4-049","title":"否则/fǒuzé/","explanation":"Liên từ, nghĩa là \"nếu không (thì)\", chỉ ra kết quả tiêu cực nếu vế trước không xảy ra,.","examples":[{"zh":"看来要考好，要认真复习...否则会做的题也没时间做了.","pinyin":"Kàn lái yào kǎo hǎo, yào rènzhēn fùxí... fǒuzé huì zuò de tí yě méi shíjiān zuò le","vi":"Xem ra muốn thi tốt, phải ôn tập nghiêm túc... nếu không thì đề đã làm được cũng không kịp thời gian."}]},{"id":"HSK4-050","title":"无论/wúlùn/","explanation":"Liên từ, biểu thị bất kể điều kiện nào, kết quả cũng không thay đổi, thường dùng với cấu trúc “无论……都/也…”.","examples":[{"zh":"无论你去不去，都请通知我一声。","pinyin":"Wúlùn nǐ qù bu qù, dōu qǐng tōngzhī wǒ yīshēng","vi":"Bất kể bạn có đi hay không, cũng hãy thông báo cho tôi một tiếng."}]},{"id":"HSK4-051","title":"然而/rán'ér/","explanation":"Liên từ, dùng ở đầu vế câu sau, biểu thị chuyển ý (nhưng, song), thường dùng trong văn viết,.","examples":[{"zh":"他虽然失败了很多次，然而一直没有放弃.","pinyin":"Tā suīrán shībài le hěnduō cì, rán'ér yīzhí méi yǒu fàngqì","vi":"Mặc dù anh ấy thất bại nhiều lần, nhưng vẫn không từ bỏ."}]},{"id":"HSK4-052","title":"同时/tóngshí/","explanation":"Liên từ/Danh từ, biểu thị hai hành động xảy ra đồng thời hoặc có quan hệ liên kết.","examples":[{"zh":"我们要发展经济，同时也必须保护环境。","pinyin":"Wǒmen yào fāzhǎn jīngjì, tóngshí yě bìxū bǎohù huánjìng","vi":"Chúng ta cần phát triển kinh tế, đồng thời cũng phải bảo vệ môi trường."}]},{"id":"HSK4-053","title":"并且/bìngqiě/","explanation":"Liên từ, dùng để nối các động từ hoặc tính từ song song, biểu thị hai hoặc nhiều tính chất cùng tồn tại (hơn nữa, đồng thời).","examples":[{"zh":"这房子家具全...并且价格也便宜，真的恨值得考虑.","pinyin":"Zhè fángzi jiājù quán... bìngqiě jiàgé yě piányi, zhēn de hěn zhíde kǎolǜ","vi":"Căn nhà này đầy đủ nội thất... hơn nữa giá cả cũng rẻ, thực sự đáng để cân nhắc."}]},{"id":"HSK4-054","title":"再…也…/zài… yě…/","explanation":"Cấu trúc biểu thị giả định, \"再\" đứng trước động từ/tính từ, ý nghĩa \"dù thế nào đi nữa\".","examples":[{"zh":"事情已经发生了，你再后悔也无法改变，别伤心了.","pinyin":"Shìqing yǐjīng fāshēng le, nǐ zài hòuhuǐ yě wúfǎ gǎibiàn, bié shāngxīn le","vi":"Chuyện đã xảy ra rồi, bạn có hối hận nữa cũng không thể thay đổi, đừng buồn nữa."}]},{"id":"HSK4-055","title":"对于/duìyú/","explanation":"Giới từ, biểu thị đối tượng của thái độ hoặc tình huống nào đó,.","examples":[{"zh":"对于这件事，我跟大家的看法不同.","pinyin":"Duìyú zhè jiàn shì, wǒ gēn dàjiā de kànfǎ bù tóng","vi":"Đối với việc này, quan điểm của tôi khác với mọi người"}]},{"id":"HSK4-056","title":"名量词重叠 /liàngcí chóngdié","explanation":"/ Cấu trúc lặp lại lượng từ (thường là dạng “AA”), biểu thị ý nghĩa “mỗi”.","examples":[{"zh":"人人都会使用语言，但是怎么用语言把话说好却是一门艺术.","pinyin":"Rénrén dōu huì shǐyòng yǔyán, dànshì zěnme yòng yǔyán bǎ huà shuō hǎo què shì yī mén yìshù","vi":"Mỗi người đều biết dùng ngôn ngữ, nhưng làm thế nào để nói hay lại là một nghệ thuật."}]},{"id":"HSK4-057","title":"相反/xiāngfǎn/","explanation":"Tính từ: Miêu tả trạng thái đối lập giữa hai sự vật/tính chất. Liên từ: Dùng để nối và giới thiệu một ý/phân câu trái ngược với ý trước đó, thường dịch là \"ngược lại\", \"trái lại\".","examples":[{"zh":"这场危机不但没有削弱团队，相反，让大家更加团结了。","pinyin":"Zhè chǎng wēijī bùdàn méiyǒu xuēruò tuánduì, xiāngfǎn, ràng dàjiā gèngjiā tuánjié le","vi":"Cuộc khủng hoảng này không những không làm suy yếu đội ngũ, mà ngược lại, còn khiến mọi người thêm đoàn kết."},{"zh":"我们的观点完全相反。","pinyin":"Wǒmen de guāndiǎn wánquán xiāngfǎn","vi":"Quan điểm của chúng tôi hoàn toàn trái ngược."}]},{"id":"HSK4-058","title":"大概/dàgài/","explanation":"Phó từ, biểu thị ước đoán số lượng hoặc đánh giá, mức độ chính xác không cao.","examples":[{"zh":"从这儿到机场，大概需要一个小时。","pinyin":"Cóng zhèr dào jīchǎng, dàgài xūyào yī gè xiǎoshí","vi":"Khoảng một tiếng đồng hồ là từ đây đến sân bay."}]},{"id":"HSK4-059","title":"偶尔/ǒu'ěr/","explanation":"Phó từ, biểu thị tần suất xảy ra rất ít, thỉnh thoảng,.","examples":[{"zh":"他平时很忙，只是偶尔来看看父母。","pinyin":"Tā píngshí hěn máng, zhǐshì ǒu'ěr lái kànkan fùmǔ","vi":"Anh ấy bình thường rất bận, chỉ thỉnh thoảng mới về thăm bố mẹ."}]},{"id":"HSK4-060","title":"由/yóu/","explanation":"Giới từ, dùng để chỉ người chịu trách nhiệm về một việc nào đó,.","examples":[{"zh":"按照规定，这件事应该由王夫夫负责.","pinyin":"Ànzhào guīdìng, zhè jiàn shì yīnggāi yóu Wáng fūfū fùzé","vi":"Theo quy định, việc này nên do ông Vương phụ trách"}]},{"id":"HSK4-061","title":"随着/suízhe/","explanation":"Giới từ, biểu thị điều kiện để một sự việc khác xảy ra (cùng với, theo)","examples":[{"zh":"随着社会的发展，京剧也在改变.","pinyin":"Suízhe shèhuì de fāzhǎn, Jīngjù yě zài gǎibiàn","vi":"Cùng với sự phát triển của xã hội, Kinh kịch cũng đang thay đổi."}]},{"id":"HSK4-062","title":"够/gòu/","explanation":"Động từ: Đủ, đạt đến mức cần thiết về số lượng, tiêu chuẩn hoặc thời gian. Phó từ: Đủ, đến một mức độ nhất định (thường biểu thị mức độ cao, có thể đã vượt quá mong đợi)","examples":[{"zh":"这些钱够我们旅行吗？","pinyin":"Zhèxiē qián gòu wǒmen lǚxíng ma","vi":"Số tiền này có đủ cho chúng tôi đi du lịch không?"},{"zh":"你今天看起来够漂亮的！","pinyin":"Nǐ jīntiān kàn qǐlái gòu piàoliang de","vi":"Hôm nay trông bạn thật là xinh đẹp!"}]},{"id":"HSK4-063","title":"以/yǐ/","explanation":"Giới từ: Dựa vào, dùng, lấy... làm... (Biểu thị công cụ, phương thức, căn cứ) Cấu trúc:以+ Danh từ (+为/而...)","examples":[{"zh":"我们应以事实为根据，不要轻信谣言。","pinyin":"Wǒmen yīng yǐ shìshí wéi gēnjù, bú yào qīngxìn yáoyán","vi":"Chúng ta nên lấy sự thật làm căn cứ, đừng dễ tin lời đồn."}]},{"id":"HSK4-064","title":"既然/jìrán/","explanation":"Liên từ, dùng ở vế câu trước, ý nghĩa \"vì sự thật đã là như vậy rồi\". Vế câu sau thường dùng “就”, “也”, “还”.","examples":[{"zh":"既然大家都同意这个方案，我们就马上开始吧。","pinyin":"Jìrán dàjiā dōu tóngyì zhège fāng'àn, wǒmen jiù mǎshàng kāishǐ ba","vi":"Vì mọi người đều đồng ý với phương án này rồi, chúng ta hãy bắt đầu ngay đi."}]},{"id":"HSK4-065","title":"于是/yúshì/","explanation":"Liên từ, dùng ở vế câu sau của câu phức, biểu thị sự việc tiếp theo xảy ra sau sự việc đã nêu ở vế trước,.","examples":[{"zh":"听爷爷奶奶说，我妹妹出生那天，下了场大雪，于是我爸妈就给她取名叫夏雪.","pinyin":"Tīng yéyé nǎinai shuō, wǒ mèimei chūshēng nà tiān, xià le chǎng dà xuě, yúshì wǒ bà mā jiù gěi tā qǔ míng jiào Xiàxuě","vi":"Nghe ông bà nói... thế là bố mẹ tôi đặt tên em ấy là Hạ Tuyết."}]},{"id":"HSK4-066","title":"想起来 /xiǎngqǐlái/","explanation":"Động từ + bổ ngữ xu hướng, biểu thị sự ghi nhớ một điều gì đó từ trước đó.","examples":[{"zh":"听到这个声音，我一下子想不起来是谁了.","pinyin":"Tīng dào zhège shēngyīn, wǒ yī xiàzi xiǎng bù qǐlái shì shuí le","vi":"Nghe giọng này, tôi nhất thời không nhớ ra là ai."}]},{"id":"HSK4-067","title":"千万/qiānwàn/","explanation":"Một phó từ nhấn mạnh sự khuyên bảo hoặc cảnh báo, thường dịch là \"nhất định phải/đừng\"","examples":[{"zh":"过马路时千万要小心，不要闯红灯。","pinyin":"Guò mǎlù shí qiānwàn yào xiǎoxīn, bú yào chuǎng hóngdēng","vi":"Khi sang đường nhất định phải cẩn thận, đừng vượt đèn đỏ."}]},{"id":"HSK4-068","title":"恐怕(kǒngpà)","explanation":"Động từ: E rằng, lo sợ rằng. Phó từ: Dùng để biểu thị một phán đoán, ước lượng với thái độ dè dặt, không chắc chắn, thường kèm theo lo lắng hoặc tiên đoán về kết quả không mong muốn.","examples":[{"zh":"我恐怕此事會帶來不良後果。","pinyin":"Wǒ kǒngpà cǐ shì huì dàilái bùliáng hòuguǒ","vi":"Tôi e rằng việc này sẽ mang lại hậu quả không tốt."},{"zh":"看這天氣，恐怕要下大雨了。","pinyin":"Kàn zhè tiānqì, kǒngpà yào xià dàyǔ le","vi":"Nhìn thời tiết thế này, có lẽ sắp có mưa to rồi."}]},{"id":"HSK4-069","title":"到底/dàodǐ/","explanation":"Phó từ, dùng trong câu hỏi nghi vấn/có đại từ nghi vấn, nhấn mạnh ngữ khí truy vấn (rốt cuộc, cuối cùng).","examples":[{"zh":"你到底想说什么？","pinyin":"Nǐ dàodǐ xiǎng shuō shénme","vi":"Bạn rốt cuộc muốn nói gì?"}]},{"id":"HSK4-070","title":"拿…来说/ná… láishuō/","explanation":"Cấu trúc dùng để đưa ra sự vật/tình huống làm ví dụ.","examples":[{"zh":"学习语言需要耐心。拿学汉语来说，每天坚持练习才能进步。","pinyin":"Xuéxí yǔyán xūyào nàixīn. Ná xué hànyǔ láishuō, měitiān jiānchí liànxí cáinéng jìnbù","vi":"Học ngôn ngữ cần sự kiên nhẫn. Lấy việc học tiếng Trung mà nói, phải kiên trì luyện tập hàng ngày mới tiến bộ được."}]},{"id":"HSK4-071","title":"敢/gǎn/","explanation":"Động từ năng nguyện, biểu thị có dũng khí làm một việc gì đó,.","examples":[{"zh":"我们应该把那些敢说真话的人当镜子.","pinyin":"Wǒmen yīnggāi bǎ nà xiē gǎn shuō zhēnhuà de rén dāng jìngzi","vi":"Chúng ta nên coi những người dám nói sự thật như một tấm gương."}]},{"id":"HSK4-072","title":"倒/dào/","explanation":"Phó từ, biểu thị trái ngược hoặc ngoài ý muốn.","examples":[{"zh":"你说他笨？我倒觉得他很聪明。","pinyin":"Nǐ shuō tā bèn? Wǒ dào juéde tā hěn cōngmíng","vi":"Bạn nói anh ấy ngốc? Tôi lại thấy anh ấy rất thông minh đấy."}]},{"id":"HSK4-073","title":"趟/tàng/","explanation":"Lượng từ, biểu thị số lần đi và về.","examples":[{"zh":"上个月我去了趟北京动物园.","pinyin":"Shàng gè yuè wǒ qù le yī tàng Běijīng dòngwùyuán","vi":"Tháng trước tôi đã đi một chuyến đến Vườn thú Bắc Kinh."}]},{"id":"HSK4-074","title":"为了……而…… /wèile… ér…/","explanation":"Cấu trúc liên từ, vế câu trước chỉ mục đích, vế câu sau chỉ hành vi.","examples":[{"zh":"我们不应该为了钱而工作.","pinyin":"Wǒmen bù yīnggāi wèile qián ér gōngzuò","vi":"Chúng ta không nên vì tiền mà làm việc."}]},{"id":"HSK4-075","title":"仍然/réngráng/","explanation":"Phó từ, biểu thị ý trái ngược, trái với dự kiến hoặc ngoài ý muốn.","examples":[{"zh":"这件衣服好看倒好看，就是太贵了。","pinyin":"Zhè jiàn yīfu hǎokàn dào hǎokàn, jiùshì tài guì le","vi":"Bộ quần áo này đẹp thì đẹp thật, chỉ có điều quá đắt."}]},{"id":"HSK4-076","title":"是否/shìfǒu/","explanation":"Phó từ, Biểu thị tình trạng, trạng thái hoặc hành động tiếp tục duy trì, không thay đổi so với trước.","examples":[{"zh":"虽然遇到了困难，但他仍然非常乐观。","pinyin":"Suīrán yù dào le kùnnán, dàn tā réngrán fēicháng lèguān","vi":"Tuy gặp khó khăn, nhưng anh ấy vẫn rất lạc quan."}]},{"id":"HSK4-077","title":"受不了 /shòubuliǎo/","explanation":"Bổ ngữ khả năng, biểu thị không thể chịu đựng được (áp lực, nỗi đau, tình huống).","examples":[{"zh":"不过天天对着电脑，眼睛实在受不了.","pinyin":"Búguò tiāntiān duì zhe diànnǎo, yǎnjīng shízài shòu bù liǎo","vi":"Nhưng ngày nào cũng đối diện với máy tính, mắt thực sự không chịu nổi nữa."}]},{"id":"HSK4-078","title":"接着/jiēzhe/","explanation":"Phó từ: Biểu thị một hành động hoặc sự việc xảy ra ngay sau một hành động/sự việc khác, hoặc được nối tiếp một cách logic.","examples":[{"zh":"他吃完晚饭，接着又开始工作了。","pinyin":"Tā chī wán wǎnfàn, jiēzhe yòu kāishǐ gōngzuò le","vi":"Anh ấy ăn tối xong, tiếp theo lại bắt đầu làm việc."}]},{"id":"HSK4-079","title":"除此以外/chúcǐ yǐwài/","explanation":"Phó từ, tương đương với \"ngoài cái này ra\" (chỉ nội dung đã nói ở vế trước), thường dùng trong văn viết.","examples":[{"zh":"他和我弟弟一天出生...除此以外几乎再找不到其他共同点.","pinyin":"Tā hé wǒ dìdi yī tiān chūshēng... chú cǐ yǐwài jīhū zài zhǎo bù dào qítā gòngtóng diǎn","vi":"Tôi và em trai sinh cùng ngày... ngoài điều đó ra thì hầu như không tìm thấy điểm chung nào khác."}]},{"id":"HSK4-080","title":"把…叫做… /bǎ… jiàozuò…/","explanation":"Cấu trúc dùng để gọi tên một vật thể hoặc hiện tượng.","examples":[{"zh":"在中国，我们把父亲的爸爸叫做“爷爷”。","pinyin":"Zài zhōngguó, wǒmen bǎ fùqīn de bàba jiàozuò “yéye”","vi":"Ở Trung Quốc, chúng tôi gọi bố của bố là \"ông nội\"."}]},{"id":"HSK4-081","title":"总的来说 /zǒngde láishuō/","explanation":"Dùng làm thành phần chêm xen, dùng để tóm tắt hoặc đánh giá (nói chung).","examples":[{"zh":"我对这个方案的看法，总的来说，是支持的，不过还有一些细节需要完善。","pinyin":"Wǒ duì zhège fāng'àn de kànfǎ, zǒngde láishuō, shì zhīchí de, búguò hái yǒu yīxiē xìjié xūyào wánshàn","vi":"Ý kiến của tôi về phương án này, nhìn chung, là ủng hộ, tuy nhiên vẫn còn một số chi tiết cần hoàn thiện."}]},{"id":"HSK4-082","title":"在于/zàiyú/","explanation":"Động từ, dùng trong văn viết, dùng để chỉ bản chất, là trọng tâm, là mấu chốt.","examples":[{"zh":"选择职业的关键在于兴趣.","pinyin":"Xuǎnzé zhíyè de guānjiàn zàiyú xìngqù","vi":"Điều cốt lõi khi chọn nghề nằm ở sở thích"}]},{"id":"HSK4-083","title":"Cấu trúc: Động từ 1 +着+ Động từ 1 +着+ (，就/却/ 忽然…) + Hành động/Trạng thái mới","explanation":"Cấu trúc này mô tả một hành động đang kéo dài thì đột nhiên hoặc tự nhiên dẫn đến một kết quả, thay đổi hoặc một hành động khác.","examples":[{"zh":"她看着看着书，就睡着了。","pinyin":"Tā kànzhe kànzhe shū, jiù shuì zháo le.","vi":"Cô ấy đang xem sách, thì ngủ gật mất rồi."}]},{"id":"HSK4-084","title":"一…就… /yī… jiù…/","explanation":"Cấu trúc biểu thị hai sự việc xảy ra liên tiếp hoặc biểu thị điều kiện/kết quả.","examples":[{"zh":"女儿一回来就告诉她这个好消息.","pinyin":"Nǚ'ér yī huílái jiù gàosu tā zhège hǎo xiāoxi","vi":"Con gái vừa về thì lập tức nói cho cô ấy tin vui này."}]},{"id":"HSK4-085","title":"究竟/jiūjìng/","explanation":"Phó từ, dùng trong câu hỏi nghi vấn/có đại từ nghi vấn, nhấn mạnh ngữ khí truy vấn (rốt cuộc), thường dùng trong văn viết.","examples":[{"zh":"究竟哪个季节去丽江旅游比较好.","pinyin":"Jiūjìng nǎ ge jìjié qù Lìjiāng lǚyóu bǐjiào hǎo","vi":"Rốt cuộc đi du lịch Lệ Giang vào mùa nào là tốt nhất?"}]},{"id":"HSK4-086","title":"起来/qǐlái/","explanation":"Động từ/Bổ ngữ xu hướng, biểu thị hành động bắt đầu/tiếp tục, hoặc biểu thị đánh giá cá nhân.","examples":[{"zh":"你先把桌子上的东西收拾起来.","pinyin":"Nǐ xiān bǎ zhuōzi shàng de dōngxi shōushi qǐlái","vi":"Bạn dọn dẹp đồ trên bàn trước đi."},{"zh":"这件事说起来容易，做起来难。","pinyin":"Zhè jiàn shì shuō qǐlái róngyì, zuò qǐlái nán","vi":"Việc này nói ra thì dễ, làm thì mới khó."}]},{"id":"HSK4-087","title":"Cấu trúc:动词+ 起(dòngcí + qǐ)","explanation":"Cấu trúc này nhấn mạnh sự khởi điểm của hành động hướng vào một đối tượng cụ thể. Tân ngữ thường là nội dung của cuộc nói chuyện, câu hỏi, hoặc đối tượng của ký ức, cảm xúc.","examples":[{"zh":"他偶然说起了学生时代的往事。","pinyin":"Tā ǒurán shuō qǐ le xuéshēng shídài de wǎngshì","vi":"Anh ấy tình cờ nhắc đến chuyện cũ thời học sinh."}]}],"exam_focus":[]},{"level":5,"name":"HSK 5","grammar_count":109,"grammar":[{"id":"HSK5-001","title":"如何/Rúhé","word_class":"Đại từ","explanation":"Dùng để hỏi phương thức/cách thức giải quyết vấn đề, thường dùng ở cuối câu để trưng cầu ý kiến hoặc hỏi thăm tình hình.","examples":[{"zh":"我们明天举行会议，讨论这个问题该如何解决。","pinyin":"Wǒmen míngtiān jǔxíng huìyì, tǎolùn zhè ge wèntí gāi rúhé jiějué.","vi":"Chúng ta ngày mai tổ chức cuộc họp, thảo luận vấn đề này nên giải quyết thế nào 80后”们月收入情况如何？/ Bālíng hòu men yuè shōurù qíngkuàng rúhé? / Tình hình thu nhập hàng tháng của thế hệ “8x” như thế nào?"}]},{"id":"HSK5-002","title":"靠/Kào/","word_class":"Động từ/Danh từ","explanation":"Là động từ, nghĩa là dựa vào, tựa vào để chống đỡ trọng lượng; nhờ, dựa vào ai đó mới đạt được lợi ích; gần kề, kế liền.","examples":[{"zh":"王老师喜欢靠这桌子讲课。","pinyin":"Wáng lǎoshī xǐhuān kào zhè zhuōzi jiǎngkè.","vi":"Thầy Vương thích dựa vào bàn để giảng bài."},{"zh":"在家靠父母，出门靠朋友。","pinyin":"Zài jiā kào fùmǔ, chūmén kào péngyǒu","vi":"Ở nhà dựa vào cha mẹ, ra ngoài dựa vào bạn bè."}]},{"id":"HSK5-003","title":"居然 /Jūrán/","word_class":"Phó từ","explanation":"Biểu thị sự không ngờ đến, bất ngờ, ngạc nhiên (\"lại có thể\", \"lại\").","examples":[{"zh":"这么简单的题，你居然也不会做？上课时都干什么去了？","pinyin":"Zhème jiǎndān de tí, nǐ jūrán yě bú huì zuò? Shàngkè shí dōu gàn shénme qùle","vi":"Bài tập đơn giản thế này mà cậu lại cũng không biết làm? Lúc lên lớp đã làm gì vậy?"}]},{"id":"HSK5-004","title":"以来 /Yǐlái/","word_class":"Danh từ","explanation":"Biểu thị một khoảng thời gian từ một thời điểm nào đó trong quá khứ đến thời điểm hiện tại.","examples":[{"zh":"改革开放以来，中国发生了巨大的变化。","pinyin":"Gǎigé kāifàng yǐlái, Zhōngguó fāshēngle jùdà de biànhuà","vi":"Từ khi cải cách mở cửa đến nay, Trung Quốc đã có những thay đổi to lớn."}]},{"id":"HSK5-005","title":"临/Lín/","word_class":"Động từ/Giới từ","explanation":"Là động từ, có nghĩa là dựa sát, kề, kế. Là giới từ (\"临.....（时/前）\"), biểu thị sắp đến thời gian phát sinh của một hành động.","examples":[{"zh":"临江新修了一条路，晚饭后很多人都去那儿散步。","pinyin":"Lín jiāng xīn xiūle yī tiáo lù, wǎnfàn hòu hěn duō rén dōu qù nà'er sànbù","vi":"Gần bờ sông mới xây một con đường, sau bữa tối rất nhiều người đi dạo ở đó."},{"zh":"临走那天，父亲从老家赶来送我们。","pinyin":"Lín zǒu nèitiān, fùqin cóng lǎojiā gǎn lái sòng wǒmen","vi":"Ngày sắp đi, bố tôi từ quê nhà đến tiễn chúng tôi."}]},{"id":"HSK5-006","title":"立刻/Lìkè/","word_class":"Phó từ","explanation":"Biểu thị sự ngay lập tức, nhấn mạnh một hành động nối tiếp hành động phát sinh ngay trước đó.","examples":[{"zh":"实验数据一出来，研究员们立刻展开了激烈的讨论。","pinyin":"Shíyàn shùjù yī chūlái, yánjiūyuán men lìkè zhǎnkāi le jīliè de tǎolùn","vi":"Ngay khi dữ liệu thí nghiệm vừa được công bố, các nhà nghiên cứu lập tức triển khai một cuộc thảo luận sôi nổi."}]},{"id":"HSK5-007","title":"各自/Gèzì/","word_class":"Đại từ","explanation":"Chỉ bản thân một người hoặc chỉ một trong những phương diện của bản thân, thường cùng với đối tượng được nhắc đến làm chủ ngữ, định ngữ.","examples":[{"zh":"学生们都有各自的理想。","pinyin":"Xuéshēngmen dōu yǒu gèzì de lǐxiǎng","vi":"Các học sinh đều có những lý tưởng riêng."}]},{"id":"HSK5-008","title":"勿/Wù/","word_class":"Phó từ","explanation":"Ngôn ngữ viết, biểu thị sự cấm đoán, không cho phép hoặc can ngăn (\"chớ, đừng\"), tương đương với “不要”.","examples":[{"zh":"非工作人员，请勿入内。","pinyin":"Fēi gōngzuò rényuán, qǐng wù rù nèi","vi":"Người không phận sự, xin đừng vào trong."},{"zh":"网上购票者须注意网站的安全性，切勿上当受骗。","pinyin":"Wǎngshàng gòupiào zhě xū zhùyì wǎngzhàn de ānquán xìng, qiè wù shàngdàng shòupiàn","vi":"Người mua vé trực tuyến cần chú ý tính an toàn của trang web, chớ để bị lừa gạt."}]},{"id":"HSK5-009","title":"包括 /Bāokuò/","word_class":"Động từ","explanation":"Biểu thị bao hàm các bộ phận. Nhấn mạnh một vài bộ phận, có tác dụng nêu ví dụ, bổ sung, giải thích.","examples":[{"zh":"汉语技能教学包括听、说、读、写四个方面","pinyin":"Hànyǔ jìnéng jiàoxué bāokuò tīng, shuō, dú, xiě sì gè fāngmiàn","vi":"Giảng dạy kỹ năng tiếng Hán bao gồm bốn khía cạnh: nghe, nói, đọc, viết."},{"zh":"我们班所有人，包括最不爱运动的刘方也都参加了这次运动会。","pinyin":"Wǒmen bān suǒyǒu rén, bāokuò zuì bù ài yùndòng de Liú Fāng yě dōu cānjiāle zhè cì yùndònghuì.","vi":"Tất cả mọi người trong lớp chúng tôi, bao gồm cả Lưu Phương, người ít yêu thích thể thao nhất, cũng đã tham gia hội thao lần này."}]},{"id":"HSK5-010","title":"时刻 /Shíkè/","word_class":"Danh từ/Phó từ","explanation":"Danh từ: Biểu thị ở một vài thời điểm hoặc một đoạn thời gian. Phó từ: Biểu thị ý nghĩa mỗi thời mỗi khắc, thường xuyên (có thể lặp lại là “时时刻刻”).","examples":[{"zh":"在最后时刻，他为本队踢进了赢得比赛的关键一球。","pinyin":"Zài zuìhòu shíkè, tā wèi běn
